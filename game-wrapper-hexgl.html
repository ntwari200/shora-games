<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ntwari200/shora-games/main/frontend/assets/icons/shora-icon.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ntwari200/shora-games/main/frontend/assets/icons/shora-icon.png">
    <meta name="theme-color" content="#06111F">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HexGL - Shora Games</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== ALL STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06111F;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }
        #gameWrapper {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
           LOADING OVERLAY - SHORA STYLE
           ============================================================ */

        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #06111F;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
            background: radial-gradient(circle at center, #0d1f3c, #081120, #020305);
            overflow: hidden;
        }

        #loadingOverlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 10% 50%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 50% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 30% 90%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.3), transparent);
            background-size: 200px 200px;
            opacity: 0.6;
            animation: starFloat 20s linear infinite;
            pointer-events: none;
        }

        @keyframes starFloat {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-50px) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }

        #loadingOverlay::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.06), transparent 70%);
            border-radius: 50%;
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        /* ===== LOADING CONTENT ===== */
        .loading-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loading-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 20px #00bfff, 0 0 40px #008cff, 0 0 80px rgba(0, 180, 255, 0.3);
            animation: titleGlow 3s ease-in-out infinite;
            text-align: center;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px #00bfff, 0 0 40px #008cff, 0 0 80px rgba(0,180,255,0.2); }
            50% { text-shadow: 0 0 30px #00d4ff, 0 0 60px #0099ff, 0 0 100px rgba(0,180,255,0.4); }
        }

        .loading-subtitle {
            margin-top: 6px;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: 500;
            letter-spacing: 10px;
            color: #82d4ff;
            text-transform: uppercase;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .loading-subtitle i {
            color: #FFD700;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
        }

        .loading-powered {
            margin-top: 30px;
            font-size: clamp(0.6rem, 1.2vw, 0.8rem);
            font-weight: 300;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading-powered .tornado-icon {
            display: inline-block;
            font-size: 18px;
            animation: tornadoSpin 3s linear infinite;
        }

        @keyframes tornadoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-bar-container {
            margin-top: 40px;
            width: clamp(200px, 40vw, 380px);
            height: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.05);
        }

        .loading-bar-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(0, 180, 255, 0.05), transparent);
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d4ff, #007bff, #00d4ff);
            background-size: 200% 100%;
            animation: load 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards, loadShine 1.5s ease-in-out infinite;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 180, 255, 0.3);
        }

        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes loadShine {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .loading-text {
            margin-top: 18px;
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.3);
            animation: textPulse 1.5s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.3; letter-spacing: 6px; }
            50% { opacity: 0.6; letter-spacing: 8px; }
        }

        .loading-text .dots {
            display: inline-block;
            min-width: 24px;
        }

        .loading-text .dots span {
            display: inline-block;
            animation: dotBounce 1.4s ease-in-out infinite;
        }

        .loading-text .dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-text .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ============================================================
           GAME FRAME
           ============================================================ */

        #gameFrame {
            flex: 1;
            width: 100%;
            border: none;
            background: #000;
            min-height: 0;
            position: relative;
            display: none;
        }

        #gameFrame iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        #gameFrame.active {
            display: block;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 768px) {
            .loading-title { font-size: 2.5rem; letter-spacing: 4px; }
            .loading-subtitle { font-size: 0.9rem; letter-spacing: 6px; }
            .loading-bar-container { width: 260px; }
        }

        @media (max-width: 480px) {
            .loading-title { font-size: 1.8rem; letter-spacing: 3px; }
            .loading-subtitle { font-size: 0.7rem; letter-spacing: 4px; }
            .loading-bar-container { width: 200px; height: 3px; }
            .loading-text { font-size: 0.6rem; letter-spacing: 4px; }
            .loading-powered { font-size: 0.5rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    LOADING OVERLAY - SHORA STYLE
    ============================================================ -->

    <div id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-title">SHORA GAMES</div>
            <div class="loading-subtitle" id="gameSubtitle">
                <i class="fas fa-racing-flag"></i>
                HEXGL
                <i class="fas fa-racing-flag"></i>
            </div>
            
            <div class="loading-bar-container">
                <div class="loading-bar" id="progressBar"></div>
            </div>
            
            <div class="loading-text">
                LOADING<span class="dots"><span>.</span><span>.</span><span>.</span></span>
            </div>
            
            <div class="loading-powered">
                <span class="tornado-icon">🌪️</span>
                <span>|</span>
                <span>POWERED BY TORNADO</span>
            </div>
        </div>
    </div>

    <!-- ============================================================
    GAME FRAME
    ============================================================ -->

    <div id="gameWrapper">
        <div id="gameFrame">
            <iframe id="gameIframe" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups" allowfullscreen></iframe>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->

    <script>
        // ============================================================
        // CONFIG
        // ============================================================

        // Game name
        const GAME_NAME = 'HexGL';

        // Game path - update this to where your HexGL index.html is located
        const GAME_URL = 'games/hexgl/index.html';

        // Get parameters from URL
        const params = new URLSearchParams(window.location.search);
        const DEMO_MODE = params.get('demo') === 'true';

        console.log('🏎️ Game:', GAME_NAME);
        console.log('🎯 Mode:', DEMO_MODE ? 'DEMO' : 'NORMAL');
        console.log('📁 Game Path:', GAME_URL);

        // ============================================================
        // LOAD GAME
        // ============================================================

        function loadGame() {
            const frame = document.getElementById('gameIframe');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const progressBar = document.getElementById('progressBar');

            // Update subtitle with game name
            document.getElementById('gameSubtitle').textContent = GAME_NAME;

            // Load the game
            const timestamp = Date.now();
            const gameUrl = GAME_URL + '?demo=' + DEMO_MODE + '&t=' + timestamp;
            
            console.log('📁 Loading game from:', gameUrl);
            frame.src = gameUrl;

            // Simulate loading progress
            let progress = 0;
            
            const progressInterval = setInterval(function() {
                progress += Math.random() * 8 + 2;
                if (progress > 95) progress = 95;
                progressBar.style.width = progress + '%';
            }, 200);

            // Check when game is loaded
            const loadCheck = setInterval(function() {
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                    if (frameDoc) {
                        // Check if game content is loaded
                        const bodyContent = frameDoc.body?.innerHTML || '';
                        if (bodyContent.length > 100) {
                            clearInterval(progressInterval);
                            clearInterval(loadCheck);
                            progressBar.style.width = '100%';
                            
                            // Wait a moment then show the game
                            setTimeout(function() {
                                loadingOverlay.classList.add('hidden');
                                document.getElementById('gameFrame').classList.add('active');
                                console.log('✅ HexGL loaded successfully!');
                            }, 500);
                            return;
                        }
                    }
                } catch (e) {
                    // Still loading or cross-origin
                }
            }, 300);

            // Fallback: if game doesn't load in 10 seconds, show anyway
            setTimeout(function() {
                if (!loadingOverlay.classList.contains('hidden')) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                    progressBar.style.width = '100%';
                    
                    setTimeout(function() {
                        loadingOverlay.classList.add('hidden');
                        document.getElementById('gameFrame').classList.add('active');
                        console.log('⏰ Game load timeout - showing anyway');
                    }, 500);
                }
            }, 10000);
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================

        document.addEventListener('keydown', function(e) {
            // ESC = Go back to lobby
            if (e.key === 'Escape') {
                window.location.href = '/game-lobby.html';
            }
        });

        // ============================================================
        // PREVENT SCROLLING
        // ============================================================

        document.addEventListener('touchmove', function(e) {
            if (e.target === document.body || e.target === document.getElementById('gameWrapper')) {
                e.preventDefault();
            }
        }, { passive: false });

        // ============================================================
        // INIT
        // ============================================================

        loadGame();

        console.log('');
        console.log('🏎️ ===========================================');
        console.log('🏎️', GAME_NAME, '- GAME WRAPPER');
        console.log('🏎️ ===========================================');
        console.log('🎯 Mode:', DEMO_MODE ? 'DEMO' : 'NORMAL');
        console.log('📁 Game Path:', GAME_URL);
        console.log('✅ Loader: Professional Shora style');
        console.log('🌪️ Powered by Tornado');
        console.log('===========================================');
    </script>

</body>
</html>
