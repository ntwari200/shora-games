<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NinjaRun - Shora Games</title>
    <link rel="icon" type="image/png" href="icon-128.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ============================================================
               RESET & BASE
            ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #06111F;
            --bg2: #0B1F36;
            --primary: #00BFFF;
            --secondary: #6C63FF;
            --success: #00E676;
            --danger: #FF4D6D;
            --gold: #FFD700;
            --text: #F5F7FA;
            --muted: #A7B5C5;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Inter', 'Space Grotesk', sans-serif;
            color: var(--text);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* ============================================================
               GAME WRAPPER - FULL SCREEN
            ============================================================ */
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ============================================================
               GAME CONTAINER - SCALED CANVAS
            ============================================================ */
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
            object-fit: contain;
            image-rendering: auto;
            background: #000;
            touch-action: none;
        }

        /* ============================================================
               TOUCH CONTROLS - MOBILE OVERLAY
            ============================================================ */
        #touchControls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 20;
        }

        @media (hover: none) and (pointer: coarse) {
            #touchControls {
                display: flex !important;
            }
        }

        @media (max-width: 1024px) {
            #touchControls {
                display: flex !important;
            }
        }

        .touch-btn {
            pointer-events: auto;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .touch-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--primary);
        }

        .touch-btn.left {
            margin-right: auto;
        }

        .touch-btn.right {
            margin-left: auto;
        }

        .touch-btn.jump {
            width: 90px;
            height: 90px;
            font-size: 2.4rem;
            background: rgba(0, 191, 255, 0.15);
            border-color: rgba(0, 191, 255, 0.3);
            margin: 0 auto;
        }

        .touch-btn.jump:active {
            background: rgba(0, 191, 255, 0.4);
            border-color: var(--primary);
        }

        .touch-controls-group {
            display: flex;
            gap: 15px;
            align-items: center;
            pointer-events: none;
        }

        .touch-controls-group .touch-btn {
            pointer-events: auto;
        }

        /* ============================================================
               LOBBY OVERLAY
            ============================================================ */
        #lobbyOverlay {
            position: absolute;
            inset: 0;
            z-index: 15;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(6, 17, 31, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        #lobbyOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .lobby-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 40px 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .lobby-box .game-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .lobby-box h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .lobby-box h2 span {
            color: var(--primary);
        }

        .lobby-box .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .lobby-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .lobby-stat {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .lobby-stat .number {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .lobby-stat .label {
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .lobby-stat .number.gold {
            color: var(--gold);
        }

        .lobby-stat .number.green {
            color: var(--success);
        }

        .lobby-stat .number.red {
            color: var(--danger);
        }

        .lobby-box .prize-pool {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 16px;
        }

        .lobby-box .prize-pool small {
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: 400;
        }

        .lobby-box .entry-fee {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .lobby-box .entry-fee strong {
            color: var(--gold);
        }

        .btn-join {
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            width: 100%;
            touch-action: manipulation;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 191, 255, 0.3);
        }

        .btn-join:active {
            transform: scale(0.97);
        }

        .btn-join:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-join.joined {
            background: var(--success);
        }

        .btn-join.playing {
            background: var(--danger);
        }

        /* ============================================================
               PLAYER LIST - MOBILE FRIENDLY
            ============================================================ */
        #playerList {
            position: absolute;
            top: 80px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 14px;
            min-width: 140px;
            max-width: 200px;
            max-height: 50vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 12;
            font-size: 0.75rem;
        }

        #playerList .title {
            color: var(--muted);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-size: 0.7rem;
        }

        .player-item .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .player-item .status-dot.ready {
            background: var(--success);
        }

        .player-item .status-dot.waiting {
            background: var(--gold);
        }

        .player-item .player-name {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================
               TOP BAR - MOBILE FRIENDLY
            ============================================================ */
        #topBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 12;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 6px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-stat {
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .top-stat .value {
            color: #fff;
            font-weight: 600;
        }

        .top-stat .value.gold {
            color: var(--gold);
        }

        .top-stat .value.green {
            color: var(--success);
        }

        .top-stat .value.red {
            color: var(--danger);
        }

        .top-stat .value.primary {
            color: var(--primary);
        }

        .back-btn {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 8px;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ============================================================
               STATUS MESSAGE
            ============================================================ */
        #statusMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 13;
            text-align: center;
            pointer-events: none;
            display: none;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #statusMessage.show {
            display: block;
        }

        #statusMessage .main {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        #statusMessage .sub {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 6px;
        }

        /* ============================================================
               RESPONSIVE BREAKPOINTS
            ============================================================ */
        @media (max-width: 1024px) {
            .lobby-box { padding: 30px 35px; max-width: 420px; }
            .lobby-box .game-icon { font-size: 3rem; }
            .lobby-box h2 { font-size: 1.2rem; }
            #playerList { top: 70px; right: 12px; min-width: 120px; font-size: 0.7rem; padding: 10px 12px; }
            .touch-btn { width: 60px; height: 60px; font-size: 1.6rem; }
            .touch-btn.jump { width: 75px; height: 75px; font-size: 2rem; }
        }

        @media (max-width: 768px) {
            #topBar { padding: 8px 12px; font-size: 0.65rem; }
            .top-stat { font-size: 0.6rem; }
            .back-btn { font-size: 0.7rem; padding: 4px 10px; }
            .lobby-box { padding: 24px 20px; max-width: 340px; border-radius: 18px; }
            .lobby-box .game-icon { font-size: 2.5rem; }
            .lobby-box h2 { font-size: 1rem; }
            .lobby-box .subtitle { font-size: 0.75rem; }
            .lobby-stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
            .lobby-stat { padding: 8px 4px; }
            .lobby-stat .number { font-size: 1.2rem; }
            .lobby-stat .label { font-size: 0.5rem; }
            .lobby-box .prize-pool { font-size: 1rem; }
            .lobby-box .entry-fee { font-size: 0.75rem; }
            .btn-join { padding: 12px 20px; font-size: 0.95rem; }
            #playerList { top: 60px; right: 8px; min-width: 100px; max-width: 150px; padding: 8px 10px; font-size: 0.6rem; border-radius: 8px; max-height: 40vh; }
            #playerList .title { font-size: 0.5rem; }
            .player-item { font-size: 0.6rem; padding: 2px 0; }
            .touch-btn { width: 50px; height: 50px; font-size: 1.2rem; }
            .touch-btn.jump { width: 65px; height: 65px; font-size: 1.6rem; }
            #touchControls { bottom: 20px; padding: 0 12px; }
            .touch-controls-group { gap: 10px; }
            #statusMessage { padding: 14px 20px; }
            #statusMessage .main { font-size: 1.1rem; }
            #statusMessage .sub { font-size: 0.7rem; }
        }

        @media (max-width: 400px) {
            .lobby-box { padding: 18px 14px; max-width: 280px; }
            .lobby-box .game-icon { font-size: 2rem; }
            .lobby-box h2 { font-size: 0.85rem; }
            .lobby-stats { grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
            .lobby-stat .number { font-size: 1rem; }
            .btn-join { padding: 10px 16px; font-size: 0.85rem; }
            .touch-btn { width: 42px; height: 42px; font-size: 1rem; }
            .touch-btn.jump { width: 55px; height: 55px; font-size: 1.4rem; }
            #touchControls { bottom: 14px; padding: 0 8px; }
            .touch-controls-group { gap: 6px; }
            #playerList { top: 55px; right: 6px; min-width: 80px; max-width: 120px; padding: 6px 8px; font-size: 0.5rem; }
            #topBar { padding: 6px 8px; }
            .top-stat { font-size: 0.5rem; }
            .back-btn { font-size: 0.6rem; padding: 3px 8px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            #touchControls { bottom: 8px; padding: 0 8px; }
            .touch-btn { width: 40px; height: 40px; font-size: 0.9rem; }
            .touch-btn.jump { width: 50px; height: 50px; font-size: 1.2rem; }
            .lobby-box { padding: 16px 20px; max-width: 320px; }
            .lobby-box .game-icon { font-size: 2rem; }
            .lobby-box h2 { font-size: 0.9rem; }
            .lobby-stats { grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
            .lobby-stat { padding: 4px 4px; }
            .lobby-stat .number { font-size: 0.9rem; }
            .btn-join { padding: 8px 16px; font-size: 0.8rem; }
            #playerList { top: 45px; right: 6px; min-width: 70px; max-width: 100px; padding: 4px 6px; font-size: 0.5rem; max-height: 30vh; }
            #topBar { padding: 4px 8px; }
            .top-stat { font-size: 0.5rem; }
        }

        #playerList::-webkit-scrollbar { width: 3px; }
        #playerList::-webkit-scrollbar-track { background: transparent; }
        #playerList::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* ============================================================
               LOADING
            ============================================================ */
        #loadingScreen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            transition: opacity 0.6s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .loader-progress {
            margin-top: 8px;
            width: 150px;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loadingScreen">
        <div class="loader"></div>
        <div class="loader-text">Loading NinjaRun...</div>
        <div class="loader-progress">
            <div class="loader-progress-bar" id="loadProgress"></div>
        </div>
    </div>

    <!-- ===== GAME WRAPPER ===== -->
    <div id="gameWrapper">

        <!-- Game Container -->
        <div id="gameContainer">
            <!-- The game canvas will be inserted here -->
        </div>

        <!-- ===== TOP BAR ===== -->
        <div id="topBar">
            <div class="top-left">
                <a href="../game-lobby.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
                <span class="top-stat">
                    🏆 ROUND <span class="value primary" id="roundNumber">001</span>
                </span>
            </div>
            <div class="top-right">
                <span class="top-stat">
                    👥 <span class="value green" id="playerCount">0</span>/50
                </span>
                <span class="top-stat">
                    ⏱️ <span class="value red" id="roundTimer">5:00</span>
                </span>
                <span class="top-stat">
                    💰 <span class="value gold" id="prizeDisplay">0</span> RWF
                </span>
            </div>
        </div>

        <!-- ===== PLAYER LIST ===== -->
        <div id="playerList">
            <div class="title">👥 Players</div>
            <div id="playersContainer">
                <div class="player-item" style="color:var(--muted);">Waiting for players...</div>
            </div>
        </div>

        <!-- ===== STATUS MESSAGE ===== -->
        <div id="statusMessage">
            <div class="main" id="statusMain">⏳ Waiting for players...</div>
            <div class="sub" id="statusSub">Need 2 more players to start</div>
        </div>

        <!-- ===== LOBBY OVERLAY ===== -->
        <div id="lobbyOverlay">
            <div class="lobby-box">
                <div class="game-icon">🏃</div>
                <h2>Ninja<span>Run</span></h2>
                <div class="subtitle">🏆 Tournament Mode</div>

                <div class="lobby-stats">
                    <div class="lobby-stat">
                        <div class="number" id="lobbyPlayers">0</div>
                        <div class="label">Players</div>
                    </div>
                    <div class="lobby-stat">
                        <div class="number gold" id="lobbyPrize">0</div>
                        <div class="label">Prize Pool</div>
                    </div>
                    <div class="lobby-stat">
                        <div class="number green" id="lobbyTimer">5:00</div>
                        <div class="label">Time Left</div>
                    </div>
                </div>

                <div class="prize-pool">
                    🏆 Prize Pool: <span id="lobbyPrizePool">0</span> RWF
                </div>

                <div class="entry-fee">
                    Entry Fee: <strong id="entryFeeDisplay">100</strong> RWF
                </div>

                <button class="btn-join" id="joinBtn">
                    <i class="fas fa-gamepad"></i> Join Round
                </button>
            </div>
        </div>

        <!-- ===== TOUCH CONTROLS ===== -->
        <div id="touchControls">
            <div class="touch-controls-group">
                <button class="touch-btn left" id="touchLeft">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="touch-btn right" id="touchRight">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <button class="touch-btn jump" id="touchJump">
                <i class="fas fa-arrow-up"></i>
            </button>
        </div>

    </div>

    <!-- ================================================================
    FIREBASE + GAME INTEGRATION
    ================================================================ -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, onValue, set, update, get, child } from "firebase/database";
        import { getAuth, onAuthStateChanged } from "firebase/auth";

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDTcM9aUFhOpJTdQTSZAF_1XMEt6GL48Hs",
            authDomain: "shora-games.firebaseapp.com",
            projectId: "shora-games",
            databaseURL: "https://shora-games-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // ============================================================
        // CONFIGURATION
        // ============================================================
        const CONFIG = {
            ENTRY_FEE: 100,
            MAX_PLAYERS: 50,
            MIN_PLAYERS: 2,
            ROUND_DURATION: 300,
            GAME_WIDTH: 1280,
            GAME_HEIGHT: 720
        };

        // ============================================================
        // STATE
        // ============================================================
        const state = {
            roundId: '001',
            roundState: 'waiting',
            players: [],
            playerCount: 0,
            timeRemaining: CONFIG.ROUND_DURATION,
            user: null,
            userData: null,
            joined: false,
            gameStarted: false,
            results: null,
            _startTimeout: null
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const dom = {
            container: document.getElementById('gameContainer'),
            canvas: null,
            roundNumber: document.getElementById('roundNumber'),
            playerCount: document.getElementById('playerCount'),
            roundTimer: document.getElementById('roundTimer'),
            prizeDisplay: document.getElementById('prizeDisplay'),
            lobbyOverlay: document.getElementById('lobbyOverlay'),
            lobbyPlayers: document.getElementById('lobbyPlayers'),
            lobbyPrize: document.getElementById('lobbyPrize'),
            lobbyTimer: document.getElementById('lobbyTimer'),
            lobbyPrizePool: document.getElementById('lobbyPrizePool'),
            entryFeeDisplay: document.getElementById('entryFeeDisplay'),
            joinBtn: document.getElementById('joinBtn'),
            playersContainer: document.getElementById('playersContainer'),
            statusMessage: document.getElementById('statusMessage'),
            statusMain: document.getElementById('statusMain'),
            statusSub: document.getElementById('statusSub'),
            loadingScreen: document.getElementById('loadingScreen'),
            loadProgress: document.getElementById('loadProgress'),
            touchLeft: document.getElementById('touchLeft'),
            touchRight: document.getElementById('touchRight'),
            touchJump: document.getElementById('touchJump')
        };

        dom.entryFeeDisplay.textContent = CONFIG.ENTRY_FEE;

        // ============================================================
        // HELPER - Ensure players is always an array
        // ============================================================
        function getPlayersArray() {
            if (Array.isArray(state.players)) {
                return state.players;
            } else if (typeof state.players === 'object' && state.players !== null) {
                return Object.values(state.players);
            }
            return [];
        }

        // ============================================================
        // AUTH CHECK
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.user = user;
                try {
                    const snapshot = await get(child(ref(db), `users/${user.uid}`));
                    if (snapshot.exists()) {
                        state.userData = snapshot.val();
                        console.log('✅ User loaded:', state.userData.username);
                    } else {
                        console.warn('⚠️ User data not found in database');
                        state.userData = { username: 'Player', balance: 0 };
                    }
                } catch (e) {
                    console.error('❌ Error loading user data:', e);
                    state.userData = { username: 'Player', balance: 0 };
                }
            } else {
                console.log('🔒 No user logged in, redirecting to login...');
                window.location.href = '../login.html';
            }
        });

        // ============================================================
        // GAME LOADER
        // ============================================================
        function loadGame() {
            console.log('🎮 Loading NinjaRun game...');

            const canvas = document.createElement('canvas');
            canvas.id = 'c2canvas';
            canvas.width = CONFIG.GAME_WIDTH;
            canvas.height = CONFIG.GAME_HEIGHT;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            dom.container.appendChild(canvas);
            dom.canvas = canvas;

            let progress = 0;
            const loadInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 100) progress = 100;
                dom.loadProgress.style.width = progress + '%';
                if (progress === 100) {
                    clearInterval(loadInterval);
                    setTimeout(() => {
                        dom.loadingScreen.classList.add('hidden');
                        initGame();
                    }, 300);
                }
            }, 200);
        }

        // ============================================================
        // INIT GAME
        // ============================================================
        function initGame() {
            console.log('🏃 Starting NinjaRun...');

            try {
                const script = document.createElement('script');
                script.src = '/games/ninja%20run/c2runtime.js';
                script.onload = () => {
                    console.log('✅ Runtime loaded');
                    try {
                        const runtime = new cr.createRuntime('c2canvas');
                        runtime.setSize(CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT);
                        window.gameRuntime = runtime;
                        setupTouchControls(runtime);
                        startLobby();
                    } catch (e) {
                        console.error('❌ Error creating runtime:', e);
                        dom.statusMain.textContent = '⚠️ Game engine error';
                        dom.statusSub.textContent = 'Please refresh and try again';
                        dom.statusMessage.classList.add('show');
                    }
                };
                script.onerror = (e) => {
                    console.error('❌ Failed to load c2runtime.js:', e);
                    dom.statusMain.textContent = '⚠️ Game failed to load';
                    dom.statusSub.textContent = 'Make sure the game files are in the correct folder';
                    dom.statusMessage.classList.add('show');
                };
                document.head.appendChild(script);

            } catch (e) {
                console.error('❌ Error initializing game:', e);
                dom.statusMain.textContent = '⚠️ Game initialization error';
                dom.statusSub.textContent = 'Please refresh and try again';
                dom.statusMessage.classList.add('show');
            }
        }

        // ============================================================
        // TOUCH CONTROLS
        // ============================================================
        function setupTouchControls(runtime) {
            let leftPressed = false;
            let rightPressed = false;
            let jumpPressed = false;

            function dispatchKeyEvent(type, key, keyCode) {
                const event = new KeyboardEvent(type, {
                    key: key,
                    keyCode: keyCode,
                    code: key,
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);
            }

            // Touch events
            dom.touchLeft.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!leftPressed) {
                    leftPressed = true;
                    dispatchKeyEvent('keydown', 'ArrowLeft', 37);
                }
            });

            dom.touchLeft.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (leftPressed) {
                    leftPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowLeft', 37);
                }
            });

            dom.touchLeft.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                if (leftPressed) {
                    leftPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowLeft', 37);
                }
            });

            dom.touchRight.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!rightPressed) {
                    rightPressed = true;
                    dispatchKeyEvent('keydown', 'ArrowRight', 39);
                }
            });

            dom.touchRight.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (rightPressed) {
                    rightPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowRight', 39);
                }
            });

            dom.touchRight.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                if (rightPressed) {
                    rightPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowRight', 39);
                }
            });

            dom.touchJump.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!jumpPressed) {
                    jumpPressed = true;
                    dispatchKeyEvent('keydown', 'ArrowUp', 38);
                }
            });

            dom.touchJump.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (jumpPressed) {
                    jumpPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowUp', 38);
                }
            });

            dom.touchJump.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                if (jumpPressed) {
                    jumpPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowUp', 38);
                }
            });

            // Mouse fallback for desktop
            dom.touchLeft.addEventListener('mousedown', () => {
                if (!leftPressed) {
                    leftPressed = true;
                    dispatchKeyEvent('keydown', 'ArrowLeft', 37);
                }
            });
            dom.touchLeft.addEventListener('mouseup', () => {
                if (leftPressed) {
                    leftPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowLeft', 37);
                }
            });
            dom.touchLeft.addEventListener('mouseleave', () => {
                if (leftPressed) {
                    leftPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowLeft', 37);
                }
            });

            dom.touchRight.addEventListener('mousedown', () => {
                if (!rightPressed) {
                    rightPressed = true;
                    dispatchKeyEvent('keydown', 'ArrowRight', 39);
                }
            });
            dom.touchRight.addEventListener('mouseup', () => {
                if (rightPressed) {
                    rightPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowRight', 39);
                }
            });
            dom.touchRight.addEventListener('mouseleave', () => {
                if (rightPressed) {
                    rightPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowRight', 39);
                }
            });

            dom.touchJump.addEventListener('mousedown', () => {
                if (!jumpPressed) {
                    jumpPressed = true;
                    dispatchKeyEvent('keydown', 'ArrowUp', 38);
                }
            });
            dom.touchJump.addEventListener('mouseup', () => {
                if (jumpPressed) {
                    jumpPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowUp', 38);
                }
            });
            dom.touchJump.addEventListener('mouseleave', () => {
                if (jumpPressed) {
                    jumpPressed = false;
                    dispatchKeyEvent('keyup', 'ArrowUp', 38);
                }
            });
        }

        // ============================================================
        // LOBBY SYSTEM
        // ============================================================
        function startLobby() {
            console.log('🔄 Starting lobby...');
            dom.lobbyOverlay.classList.remove('hidden');
            updateLobbyUI();
            listenForRoundUpdates();
            listenForPlayerUpdates();
            dom.joinBtn.addEventListener('click', joinRound);
            startRoundTimer();
            simulatePlayers();
        }

        // ============================================================
        // FIREBASE LISTENERS
        // ============================================================
        function listenForRoundUpdates() {
            const roundRef = ref(db, `rounds/${state.roundId}`);
            onValue(roundRef, (snapshot) => {
                try {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        state.roundState = data.status || 'waiting';
                        state.timeRemaining = data.timeRemaining || CONFIG.ROUND_DURATION;
                        
                        if (data.players) {
                            if (Array.isArray(data.players)) {
                                state.players = data.players;
                            } else {
                                state.players = Object.values(data.players);
                            }
                        } else {
                            state.players = [];
                        }
                        
                        state.playerCount = state.players.length;
                        updateUI();
                        
                        if (state.roundState === 'playing' && !state.gameStarted) {
                            startGame();
                        }
                        if (state.roundState === 'ended') {
                            endRound(data.results);
                        }
                    } else {
                        createNewRound();
                    }
                } catch (e) {
                    console.error('❌ Error in round listener:', e);
                }
            });
        }

        function listenForPlayerUpdates() {
            const playersRef = ref(db, `rounds/${state.roundId}/players`);
            onValue(playersRef, (snapshot) => {
                try {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        if (Array.isArray(data)) {
                            state.players = data;
                        } else {
                            state.players = Object.values(data);
                        }
                        state.playerCount = state.players.length;
                        updateUI();
                    }
                } catch (e) {
                    console.error('❌ Error in player listener:', e);
                }
            });
        }

        // ============================================================
        // CREATE NEW ROUND
        // ============================================================
        function createNewRound() {
            const roundRef = ref(db, `rounds/${state.roundId}`);
            set(roundRef, {
                status: 'waiting',
                timeRemaining: CONFIG.ROUND_DURATION,
                players: {},
                prizePool: 0,
                startTime: Date.now(),
                createdAt: Date.now()
            }).catch(e => console.error('❌ Error creating round:', e));
        }

        // ============================================================
        // JOIN ROUND
        // ============================================================
        async function joinRound() {
            if (!state.user || !state.userData) {
                alert('Please login first');
                window.location.href = '../login.html';
                return;
            }

            if (state.joined) {
                alert('You are already in this round!');
                return;
            }

            if (state.playerCount >= CONFIG.MAX_PLAYERS) {
                alert('Round is full!');
                return;
            }

            const balance = state.userData.balance || 0;
            if (balance < CONFIG.ENTRY_FEE) {
                alert(`Insufficient balance! You need ${CONFIG.ENTRY_FEE} RWF to join.`);
                window.location.href = '../deposit.html';
                return;
            }

            try {
                dom.joinBtn.disabled = true;
                dom.joinBtn.textContent = '⏳ Processing...';

                // Deduct entry fee
                const newBalance = balance - CONFIG.ENTRY_FEE;
                await update(ref(db, `users/${state.user.uid}`), {
                    balance: newBalance
                });
                state.userData.balance = newBalance;

                // Add player to round
                const playerRef = ref(db, `rounds/${state.roundId}/players/${state.user.uid}`);
                await set(playerRef, {
                    uid: state.user.uid,
                    username: state.userData.username || 'Player',
                    joinedAt: Date.now(),
                    score: 0,
                    coins: 0,
                    distance: 0,
                    status: 'ready'
                });

                state.joined = true;
                dom.joinBtn.textContent = '✅ Joined!';
                dom.joinBtn.disabled = true;

                // Update prize pool
                const prizeRef = ref(db, `rounds/${state.roundId}/prizePool`);
                const snapshot = await get(prizeRef);
                const currentPrize = snapshot.val() || 0;
                await set(prizeRef, currentPrize + CONFIG.ENTRY_FEE);

                console.log('✅ Joined round!');
            } catch (e) {
                console.error('❌ Error joining round:', e);
                alert('Error joining round. Please try again.');
                dom.joinBtn.disabled = false;
                dom.joinBtn.textContent = '🔄 Try Again';
            }
        }

        // ============================================================
        // START ROUND
        // ============================================================
        function startRound() {
            if (state.roundState !== 'waiting') return;
            const players = getPlayersArray();
            if (players.length < CONFIG.MIN_PLAYERS) return;

            const roundRef = ref(db, `rounds/${state.roundId}`);
            update(roundRef, {
                status: 'playing',
                startTime: Date.now(),
                timeRemaining: CONFIG.ROUND_DURATION
            }).catch(e => console.error('❌ Error starting round:', e));

            state.roundState = 'playing';
            dom.lobbyOverlay.classList.add('hidden');
            dom.statusMessage.classList.remove('show');
            console.log('🏁 Round started!');
        }

        // ============================================================
        // START GAME
        // ============================================================
        function startGame() {
            state.gameStarted = true;
            console.log('🎮 Game is now live!');
            dom.lobbyOverlay.classList.add('hidden');
            dom.statusMessage.classList.remove('show');
        }

        // ============================================================
        // END ROUND
        // ============================================================
        function endRound(results) {
            state.roundState = 'ended';
            state.results = results;
            console.log('🏁 Round ended!');

            const players = getPlayersArray();
            const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
            const winner = sorted[0];

            dom.statusMain.textContent = `🏆 ${winner?.username || 'Player'} Wins!`;
            dom.statusSub.textContent = `Score: ${winner?.score || 0} | Coins: ${winner?.coins || 0} | Distance: ${winner?.distance || 0}`;
            dom.statusMessage.classList.add('show');

            if (winner && winner.uid) {
                const prizePool = players.length * CONFIG.ENTRY_FEE;
                const winnings = Math.floor(prizePool * 0.7);
                const winnerRef = ref(db, `users/${winner.uid}`);
                get(winnerRef).then((snap) => {
                    if (snap.exists()) {
                        const data = snap.val();
                        update(winnerRef, {
                            balance: (data.balance || 0) + winnings
                        }).catch(e => console.error('❌ Error updating winner balance:', e));
                    }
                }).catch(e => console.error('❌ Error getting winner data:', e));
            }
        }

        // ============================================================
        // TIMER
        // ============================================================
        function startRoundTimer() {
            setInterval(() => {
                if (state.roundState === 'playing') {
                    state.timeRemaining--;
                    updateTimerDisplay();
                    if (state.timeRemaining <= 0) {
                        const results = getGameResults();
                        endRound(results);
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(Math.max(0, state.timeRemaining) / 60);
            const secs = Math.floor(Math.max(0, state.timeRemaining) % 60);
            const display = `${mins}:${secs.toString().padStart(2, '0')}`;
            dom.roundTimer.textContent = display;
            dom.lobbyTimer.textContent = display;
        }

        // ============================================================
        // GET GAME RESULTS
        // ============================================================
        function getGameResults() {
            const runtime = window.gameRuntime;
            let score = 0, coins = 0, distance = 0;
            if (runtime) {
                try {
                    const vars = runtime.all_global_vars || [];
                    for (let v of vars) {
                        if (v.name === 'Score') score = v.data || 0;
                        if (v.name === 'Coins') coins = v.data || 0;
                        if (v.name === 'Distances') distance = v.data || 0;
                    }
                } catch (e) {
                    console.warn('Could not read game vars:', e);
                }
            }
            return { score, coins, distance };
        }

        // ============================================================
        // UPDATE UI
        // ============================================================
        function updateUI() {
            const players = getPlayersArray();
            state.playerCount = players.length;
            
            dom.playerCount.textContent = state.playerCount;
            dom.lobbyPlayers.textContent = state.playerCount;

            const prizePool = state.playerCount * CONFIG.ENTRY_FEE;
            dom.prizeDisplay.textContent = prizePool.toLocaleString();
            dom.lobbyPrize.textContent = prizePool.toLocaleString();
            dom.lobbyPrizePool.textContent = prizePool.toLocaleString();

            dom.roundNumber.textContent = state.roundId;
            renderPlayerList();

            if (state.roundState === 'waiting') {
                if (state.playerCount >= CONFIG.MIN_PLAYERS) {
                    dom.statusMain.textContent = '✅ Ready to start!';
                    dom.statusSub.textContent = `⏳ Starting in 5 seconds...`;
                    dom.statusMessage.classList.add('show');
                    if (state._startTimeout) {
                        clearTimeout(state._startTimeout);
                        state._startTimeout = null;
                    }
                    state._startTimeout = setTimeout(() => {
                        if (state.roundState === 'waiting') {
                            startRound();
                        }
                        state._startTimeout = null;
                    }, 5000);
                } else {
                    const needed = CONFIG.MIN_PLAYERS - state.playerCount;
                    dom.statusMain.textContent = '⏳ Waiting for players...';
                    dom.statusSub.textContent = `Need ${needed} more player${needed > 1 ? 's' : ''} to start`;
                    dom.statusMessage.classList.add('show');
                    if (state._startTimeout) {
                        clearTimeout(state._startTimeout);
                        state._startTimeout = null;
                    }
                }
            }
        }

        function updateLobbyUI() {
            updateUI();
        }

        // ============================================================
        // RENDER PLAYER LIST
        // ============================================================
        function renderPlayerList() {
            const players = getPlayersArray();

            if (players.length === 0) {
                dom.playersContainer.innerHTML = `
                    <div class="player-item" style="color:var(--muted);">
                        No players yet...
                    </div>
                `;
                return;
            }

            let html = '';
            players.forEach((p) => {
                const isMe = p.uid === state.user?.uid;
                const statusColor = p.status === 'ready' ? 'ready' : 'waiting';
                html += `
                    <div class="player-item" style="${isMe ? 'color:var(--gold);' : ''}">
                        <span class="player-name">
                            <span class="status-dot ${statusColor}"></span>
                            ${isMe ? '⭐ ' : ''}${p.username || 'Player'}
                        </span>
                        <span>${p.score || 0}</span>
                    </div>
                `;
            });
            dom.playersContainer.innerHTML = html;
        }

        // ============================================================
        // SIMULATE PLAYERS FOR TESTING
        // ============================================================
        function simulatePlayers() {
            setTimeout(() => {
                if (!state.joined && state.userData) {
                    joinRound();
                }
            }, 1500);

            const botNames = ['NinjaBot1', 'Samurai_Pro', 'ShadowRunner', 'SpeedDemon', 'PixelHero'];
            botNames.forEach((name, index) => {
                setTimeout(() => {
                    if (state.playerCount < 8) {
                        const fakeUid = `bot_${Date.now()}_${index}`;
                        state.players.push({
                            uid: fakeUid,
                            username: name,
                            joinedAt: Date.now(),
                            score: Math.floor(Math.random() * 500),
                            coins: Math.floor(Math.random() * 20),
                            distance: Math.floor(Math.random() * 500),
                            status: 'ready'
                        });
                        state.playerCount = state.players.length;
                        updateUI();
                    }
                }, 2000 + (index * 1500));
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        console.log('%c🏃 NINJARUN - TOURNAMENT MODE', 'color: #00BFFF; font-size: 18px; font-weight: bold;');
        console.log('%c📱 Fully responsive on all devices', 'color: #00E676;');
        console.log('%c👥 2-50 players | ⏱️ 5 min rounds | 💰 Prize pool', 'color: #FFD700;');

        loadGame();

        window.state = state;
        window.db = db;

    </script>

</body>
</html>
