<!DOCTYPE html>
<html manifest="offline.appcache">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

<!-- ============================================================
   VIEWPORT - Allow proper scaling
   ============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

<title>SHORA GAMES | Ninja Run</title>

<link rel="manifest" href="app.manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #07111f, #0b1830, #05070d);
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    position: fixed;
    top: 0;
    left: 0;
}

/* ============================================================
   LOADER - Responsive
   ============================================================ */
#loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    background: radial-gradient(circle at top, #19376d, #081120, #020305);
    transition: opacity 0.8s ease;
    padding: 20px;
}

#loader img {
    width: clamp(80px, 20vw, 180px);
    animation: float 2s ease-in-out infinite, glow 2s infinite;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

@keyframes glow {
    0% { filter: drop-shadow(0 0 8px #0099ff); }
    50% { filter: drop-shadow(0 0 35px #00ccff); }
    100% { filter: drop-shadow(0 0 8px #0099ff); }
}

#gameTitle {
    font-size: clamp(24px, 6vw, 55px);
    font-weight: 900;
    letter-spacing: 5px;
    margin-top: clamp(12px, 3vh, 25px);
    color: white;
    text-shadow: 0 0 10px #00bfff, 0 0 25px #008cff;
}

#subTitle {
    margin-top: clamp(4px, 1vh, 10px);
    font-size: clamp(14px, 3vw, 22px);
    color: #82d4ff;
}

.loadingContainer {
    margin-top: clamp(20px, 5vh, 45px);
    width: clamp(200px, 50vw, 400px);
    height: clamp(10px, 2vh, 18px);
    background: #16233a;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 180, 255, 0.2);
}

.loadingBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00d4ff, #007bff);
    animation: load 4s linear forwards;
}

@keyframes load {
    0% { width: 0%; }
    100% { width: 100%; }
}

.loadingText {
    margin-top: clamp(10px, 2vh, 20px);
    font-size: clamp(12px, 2vw, 18px);
    letter-spacing: 2px;
    color: #dbefff;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0.4; }
}

/* ============================================================
   CANVAS CONTAINER - Dynamic sizing
   ============================================================ */
#c2canvasdiv {
    display: none;
    margin: auto;
    width: 100%;
    height: 100%;
    position: fixed;
    top: 0;
    left: 0;
    align-items: center;
    justify-content: center;
    background: #000;
}

/* ============================================================
   CANVAS - Scales dynamically while keeping 1280x720 resolution
   ============================================================ */
#c2canvas {
    display: block;
    /* CRITICAL: Keep game resolution at 1280x720 for touch mapping */
    width: 1280px !important;
    height: 720px !important;
    /* Allow scaling */
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    object-fit: contain;
    image-rendering: auto;
    background: transparent;
    touch-action: none;
    border-radius: clamp(8px, 2vw, 20px);
    box-shadow: 0 0 clamp(20px, 5vw, 40px) rgba(0, 162, 255, 0.45);
    /* Center the canvas */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    /* Allow resize */
    min-width: 320px;
    min-height: 180px;
}

/* ============================================================
   RESPONSIVE - Canvas scales with screen
   ============================================================ */
@media (max-width: 1280px) {
    #c2canvas {
        width: 1280px !important;
        height: 720px !important;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
        object-fit: contain;
    }
}

/* For very small screens, keep aspect ratio */
@media (max-width: 480px) {
    #c2canvas {
        width: 1280px !important;
        height: 720px !important;
        max-width: 100vw;
        max-height: 100vh;
    }
}

/* ============================================================
   SCROLLBAR HIDE
   ============================================================ */
::-webkit-scrollbar {
    width: 0px;
    height: 0px;
}
</style>

</head>
<body>

<!-- ============================================================
   LOADER SCREEN
   ============================================================ -->
<div id="loader">
    <img src="images/shora-logo.png" alt="Shora Games">
    <div id="gameTitle">SHORA GAMES</div>
    <div id="subTitle">Ninja Run</div>
    <div class="loadingContainer">
        <div class="loadingBar"></div>
    </div>
    <div class="loadingText">Loading...</div>
</div>

<!-- ============================================================
   GAME CANVAS
   ============================================================ -->
<div id="c2canvasdiv">
    <canvas id="c2canvas" width="1280" height="720">
        Your browser does not support HTML5.
    </canvas>
</div>

<!-- ============================================================
   SCRIPTS
   ============================================================ -->
<script src="jquery-2.1.1.min.js"></script>
<script src="c2runtime.js"></script>

<script>
// ============================================================
// CONFIG
// ============================================================

var GAME_WIDTH = 1280;
var GAME_HEIGHT = 720;
var isGameReady = false;

// ============================================================
// SMART CANVAS RESIZE - Resize while maintaining 1280x720
// ============================================================

function resizeCanvas() {
    var canvas = document.getElementById('c2canvas');
    var container = document.getElementById('c2canvasdiv');
    
    if (!canvas) return;
    
    // Get viewport dimensions
    var winWidth = window.innerWidth;
    var winHeight = window.innerHeight;
    
    // CRITICAL: Keep canvas at 1280x720 for proper touch mapping
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;
    
    // Make container fill screen
    container.style.width = '100%';
    container.style.height = '100%';
    container.style.position = 'fixed';
    container.style.top = '0';
    container.style.left = '0';
    container.style.display = 'flex';
    container.style.alignItems = 'center';
    container.style.justifyContent = 'center';
    container.style.background = '#000';
    
    // Set canvas CSS to fit screen while maintaining aspect ratio
    canvas.style.width = GAME_WIDTH + 'px';
    canvas.style.height = GAME_HEIGHT + 'px';
    canvas.style.maxWidth = '100vw';
    canvas.style.maxHeight = '100vh';
    canvas.style.maxHeight = '100dvh';
    canvas.style.objectFit = 'contain';
    canvas.style.position = 'absolute';
    canvas.style.top = '50%';
    canvas.style.left = '50%';
    canvas.style.transform = 'translate(-50%, -50%)';
    canvas.style.display = 'block';
    
    // Calculate the actual display size (for the runtime)
    var rect = canvas.getBoundingClientRect();
    var displayWidth = Math.round(rect.width);
    var displayHeight = Math.round(rect.height);
    
    // Update Construct 2 runtime with the actual display size
    if (typeof cr_sizeCanvas === 'function' && isGameReady) {
        cr_sizeCanvas(displayWidth, displayHeight);
    }
    
    console.log('📐 Game: ' + GAME_WIDTH + 'x' + GAME_HEIGHT + ' | Display: ' + displayWidth + 'x' + displayHeight);
    return { width: displayWidth, height: displayHeight };
}

// ============================================================
// TOUCH COORDINATE MAPPING - Maps touch to 1280x720
// ============================================================

function getCanvasCoords(e) {
    var canvas = document.getElementById('c2canvas');
    if (!canvas) return { x: 0, y: 0 };
    
    var rect = canvas.getBoundingClientRect();
    var scaleX = GAME_WIDTH / rect.width;
    var scaleY = GAME_HEIGHT / rect.height;
    
    var clientX, clientY;
    
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else if (e.changedTouches) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
    } else {
        clientX = e.clientX || e.pageX;
        clientY = e.clientY || e.pageY;
    }
    
    // Calculate position relative to canvas
    var x = (clientX - rect.left) * scaleX;
    var y = (clientY - rect.top) * scaleY;
    
    // Clamp to game bounds
    x = Math.max(0, Math.min(GAME_WIDTH, x));
    y = Math.max(0, Math.min(GAME_HEIGHT, y));
    
    return { x: Math.round(x), y: Math.round(y) };
}

// ============================================================
// FIX TOUCH EVENTS
// ============================================================

function fixTouchEvents() {
    var canvas = document.getElementById('c2canvas');
    if (!canvas) return;
    
    console.log('🖱️ Applying touch/click coordinate fix...');
    
    // Store original event handlers
    var originalHandlers = [];
    
    // Override touch events
    canvas.addEventListener('touchstart', function(e) {
        var coords = getCanvasCoords(e);
        // Store corrected coordinates on the event
        e._correctedX = coords.x;
        e._correctedY = coords.y;
        // Allow event to propagate
    }, { passive: true });
    
    canvas.addEventListener('touchmove', function(e) {
        var coords = getCanvasCoords(e);
        e._correctedX = coords.x;
        e._correctedY = coords.y;
    }, { passive: true });
    
    canvas.addEventListener('touchend', function(e) {
        var coords = getCanvasCoords(e);
        e._correctedX = coords.x;
        e._correctedY = coords.y;
    }, { passive: true });
    
    // Fix click events
    canvas.addEventListener('click', function(e) {
        var coords = getCanvasCoords(e);
        // Override clientX/clientY for this event
        Object.defineProperty(e, 'clientX', { 
            value: coords.x, 
            writable: false,
            configurable: true
        });
        Object.defineProperty(e, 'clientY', { 
            value: coords.y, 
            writable: false,
            configurable: true
        });
        Object.defineProperty(e, 'pageX', { 
            value: coords.x, 
            writable: false,
            configurable: true
        });
        Object.defineProperty(e, 'pageY', { 
            value: coords.y, 
            writable: false,
            configurable: true
        });
    }, { passive: true });
    
    console.log('✅ Touch/Click coordinate fix applied');
}

// ============================================================
// HANDLE WINDOW RESIZE
// ============================================================

var resizeTimeout;

function handleResize() {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(function() {
        resizeCanvas();
    }, 200);
}

jQuery(window).resize(handleResize);
window.addEventListener('orientationchange', function() {
    setTimeout(handleResize, 500);
});
window.addEventListener('resize', handleResize);

document.addEventListener('fullscreenchange', function() {
    setTimeout(handleResize, 300);
});
document.addEventListener('webkitfullscreenchange', function() {
    setTimeout(handleResize, 300);
});

// ============================================================
// LOAD GAME
// ============================================================

setTimeout(function() {
    var loader = document.getElementById("loader");
    loader.style.opacity = "0";
    
    setTimeout(function() {
        loader.style.display = "none";
        
        var canvasDiv = document.getElementById("c2canvasdiv");
        canvasDiv.style.display = "flex";
        
        // Create runtime
        cr_createRuntime("c2canvas");
        isGameReady = true;
        
        // Resize canvas after creation
        setTimeout(function() {
            resizeCanvas();
            // Fix touch events after canvas is ready
            setTimeout(fixTouchEvents, 500);
        }, 100);
        
        console.log('🎮 Ninja Run loaded successfully!');
        console.log('📱 Viewport: ' + window.innerWidth + 'x' + window.innerHeight);
        console.log('🖱️ Game: ' + GAME_WIDTH + 'x' + GAME_HEIGHT + ' (fixed resolution)');
        console.log('🔄 Canvas will auto-resize to fit any screen');
        
    }, 800);
    
}, 4000);

// ============================================================
// VISIBILITY CHANGE
// ============================================================

function onVisibilityChanged() {
    if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden) {
        cr_setSuspended(true);
    } else {
        cr_setSuspended(false);
    }
}

document.addEventListener("visibilitychange", onVisibilityChanged, false);
document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

// ============================================================
// PREVENT TOUCH SCROLL
// ============================================================

document.addEventListener('touchmove', function(e) {
    if (e.target === document.body || e.target.id === 'c2canvasdiv' || e.target.tagName === 'CANVAS') {
        e.preventDefault();
    }
}, { passive: false });

// ============================================================
// DEBUG INFO
// ============================================================

console.log('%c🏃 NINJA RUN - SHORA GAMES', 'color: #00d4ff; font-size: 20px; font-weight: bold;');
console.log('%c📱 Fully responsive - Auto-resizes to any screen', 'color: #82d4ff; font-size: 14px;');
console.log('%c🖱️ Touch/Click mapped to 1280x720 game coordinates', 'color: #34d399; font-size: 14px;');
console.log('%c🔄 Canvas will resize dynamically with window', 'color: #fbbf24; font-size: 14px;');

// ============================================================
// EXPOSE RESIZE FUNCTION FOR DEBUGGING
// ============================================================

window.__resizeGame = function() {
    resizeCanvas();
    console.log('🔄 Manual resize triggered');
};

window.__getGameCoords = function(e) {
    return getCanvasCoords(e);
};
</script>

</body>
</html>
