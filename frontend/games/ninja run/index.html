 ﻿<!DOCTYPE html>
<html manifest="offline.appcache">
<head>
<meta charset="UTF-8">

<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHORA GAMES | Ninja Run</title>

<link rel="manifest" href="app.manifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

background:
linear-gradient(180deg,#07111f,#0b1830,#05070d);

display:flex;
justify-content:center;
align-items:center;

}

/* Loader */

#loader{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

z-index:999999;

background:
radial-gradient(circle at top,#19376d,#081120,#020305);

}

/* Logo */

#loader img{

width:180px;

animation:
float 2s ease-in-out infinite,
glow 2s infinite;

}

@keyframes float{

0%{transform:translateY(0px);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0px);}

}

@keyframes glow{

0%{

filter:
drop-shadow(0 0 8px #0099ff);

}

50%{

filter:
drop-shadow(0 0 35px #00ccff);

}

100%{

filter:
drop-shadow(0 0 8px #0099ff);

}

}

#gameTitle{

font-size:55px;

font-weight:900;

letter-spacing:5px;

margin-top:25px;

color:white;

text-shadow:

0 0 10px #00bfff,

0 0 25px #008cff;

}

#subTitle{

margin-top:10px;

font-size:22px;

color:#82d4ff;

}

.loadingContainer{

margin-top:45px;

width:400px;

height:18px;

background:#16233a;

border-radius:50px;

overflow:hidden;

box-shadow:

0 0 20px rgba(0,180,255,.2);

}

.loadingBar{

height:100%;

width:0%;

background:

linear-gradient(90deg,#00d4ff,#007bff);

animation:load 4s linear forwards;

}

@keyframes load{

0%{width:0%;}

100%{width:100%;}

}

.loadingText{

margin-top:20px;

font-size:18px;

letter-spacing:2px;

color:#dbefff;

animation:blink 1s infinite;

}

@keyframes blink{

50%{opacity:.4;}

}

canvas{

border-radius:20px;

box-shadow:

0 0 40px rgba(0,162,255,.45);

}

#c2canvasdiv{

display:none;

margin:auto;

}

</style>

</head>

<body>

<div id="loader">

<img src="images/shora-logo.png" alt="Shora Games">

<div id="gameTitle">

SHORA GAMES

</div>

<div id="subTitle">

Ninja Run

</div>

<div class="loadingContainer">

<div class="loadingBar"></div>

</div>

<div class="loadingText">

Loading...

</div>

</div>

<div id="c2canvasdiv">

<canvas id="c2canvas" width="1280" height="720">

Your browser does not support HTML5.

</canvas>

</div>

<script src="jquery-2.1.1.min.js"></script>

<script src="c2runtime.js"></script>

<script>

jQuery(window).resize(function(){

cr_sizeCanvas(

jQuery(window).width(),

jQuery(window).height()

);

});

setTimeout(function(){

document.getElementById("loader").style.opacity="0";

setTimeout(function(){

document.getElementById("loader").style.display="none";

document.getElementById("c2canvasdiv").style.display="block";

cr_createRuntime("c2canvas");

},800);

},4000);

function onVisibilityChanged(){

if(document.hidden ||

document.mozHidden ||

document.webkitHidden ||

document.msHidden)

cr_setSuspended(true);

else

cr_setSuspended(false);

}

document.addEventListener("visibilitychange",onVisibilityChanged,false);

document.addEventListener("mozvisibilitychange",onVisibilityChanged,false);

document.addEventListener("webkitvisibilitychange",onVisibilityChanged,false);

document.addEventListener("msvisibilitychange",onVisibilityChanged,false);

</script>

</body>
</html>
