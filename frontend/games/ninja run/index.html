<!DOCTYPE html>
<html manifest="offline.appcache">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

<!-- ============================================================
     RESPONSIVE VIEWPORT - Adapts to all devices
     ============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

<title>SHORA GAMES | Ninja Run</title>

<link rel="manifest" href="app.manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #07111f, #0b1830, #05070d);
    display: flex;
    justify-content: center;
    align-items: center;
    position: fixed;
    top: 0;
    left: 0;
}

/* ============================================================
   LOADER
   ============================================================ */
#loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    background: radial-gradient(circle at top, #19376d, #081120, #020305);
    transition: opacity 0.8s ease;
    padding: 20px;
}

#loader img {
    width: clamp(80px, 20vw, 180px);
    animation: float 2s ease-in-out infinite, glow 2s infinite;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

@keyframes glow {
    0% { filter: drop-shadow(0 0 8px #0099ff); }
    50% { filter: drop-shadow(0 0 35px #00ccff); }
    100% { filter: drop-shadow(0 0 8px #0099ff); }
}

#gameTitle {
    font-size: clamp(24px, 6vw, 55px);
    font-weight: 900;
    letter-spacing: 5px;
    margin-top: clamp(12px, 3vh, 25px);
    color: white;
    text-shadow: 0 0 10px #00bfff, 0 0 25px #008cff;
}

#subTitle {
    margin-top: clamp(4px, 1vh, 10px);
    font-size: clamp(14px, 3vw, 22px);
    color: #82d4ff;
}

.loadingContainer {
    margin-top: clamp(20px, 5vh, 45px);
    width: clamp(200px, 50vw, 400px);
    height: clamp(10px, 2vh, 18px);
    background: #16233a;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 180, 255, 0.2);
}

.loadingBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00d4ff, #007bff);
    animation: load 4s linear forwards;
}

@keyframes load {
    0% { width: 0%; }
    100% { width: 100%; }
}

.loadingText {
    margin-top: clamp(10px, 2vh, 20px);
    font-size: clamp(12px, 2vw, 18px);
    letter-spacing: 2px;
    color: #dbefff;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0.4; }
}

/* ============================================================
   CANVAS CONTAINER - Responsive
   ============================================================ */
#c2canvasdiv {
    display: none;
    margin: auto;
    width: 100%;
    height: 100%;
    position: relative;
}

#c2canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    object-fit: contain;
    image-rendering: auto;
    background: transparent;
    touch-action: none;
    border-radius: clamp(8px, 2vw, 20px);
    box-shadow: 0 0 clamp(20px, 5vw, 40px) rgba(0, 162, 255, 0.45);
}

/* ============================================================
   RESPONSIVE BREAKPOINTS
   ============================================================ */

/* ===== LARGE DESKTOP (1200px+) ===== */
@media (min-width: 1200px) {
    #c2canvas {
        border-radius: 20px;
        max-width: 1280px;
        max-height: 720px;
    }
}

/* ===== DESKTOP (768px - 1199px) ===== */
@media (min-width: 768px) and (max-width: 1199px) {
    #c2canvas {
        border-radius: 16px;
        max-width: 100%;
        max-height: 100%;
    }
}

/* ===== TABLET (481px - 767px) ===== */
@media (min-width: 481px) and (max-width: 767px) {
    #c2canvas {
        border-radius: 12px;
        max-width: 100%;
        max-height: 100%;
    }
    #gameTitle {
        font-size: 32px;
    }
    #subTitle {
        font-size: 16px;
    }
}

/* ===== LARGE PHONE (361px - 480px) ===== */
@media (min-width: 361px) and (max-width: 480px) {
    #c2canvas {
        border-radius: 8px;
        max-width: 100%;
        max-height: 100%;
    }
    #gameTitle {
        font-size: 24px;
        letter-spacing: 3px;
    }
    #subTitle {
        font-size: 14px;
    }
    #loader img {
        width: 100px;
    }
    .loadingContainer {
        width: 200px;
        height: 10px;
    }
    .loadingText {
        font-size: 12px;
    }
}

/* ===== SMALL PHONE (320px - 360px) ===== */
@media (min-width: 320px) and (max-width: 360px) {
    #c2canvas {
        border-radius: 6px;
        max-width: 100%;
        max-height: 100%;
    }
    #gameTitle {
        font-size: 18px;
        letter-spacing: 2px;
    }
    #subTitle {
        font-size: 11px;
    }
    #loader img {
        width: 70px;
    }
    .loadingContainer {
        width: 160px;
        height: 8px;
    }
    .loadingText {
        font-size: 10px;
    }
}

/* ===== EXTRA SMALL PHONE (< 320px) ===== */
@media (max-width: 319px) {
    #c2canvas {
        border-radius: 4px;
        max-width: 100%;
        max-height: 100%;
    }
    #gameTitle {
        font-size: 14px;
        letter-spacing: 1px;
    }
    #subTitle {
        font-size: 9px;
    }
    #loader img {
        width: 50px;
    }
    .loadingContainer {
        width: 120px;
        height: 6px;
    }
    .loadingText {
        font-size: 8px;
    }
}

/* ===== LANDSCAPE PHONES ===== */
@media (max-height: 500px) and (orientation: landscape) {
    #c2canvas {
        border-radius: 8px;
        max-width: 100%;
        max-height: 100%;
    }
    #gameTitle {
        font-size: 20px;
        margin-top: 10px;
    }
    #subTitle {
        font-size: 12px;
        margin-top: 4px;
    }
    #loader img {
        width: 60px;
    }
    .loadingContainer {
        width: 180px;
        height: 8px;
        margin-top: 15px;
    }
    .loadingText {
        font-size: 10px;
        margin-top: 8px;
    }
}

/* ============================================================
   CHROME DESKTOP SITE MODE DETECTION
   When user ticks "Desktop Site" in Chrome on mobile
   ============================================================ */
@media (min-width: 768px) and (max-width: 1024px) {
    /* This is Chrome Desktop Site mode on mobile */
    #c2canvas {
        max-width: 100%;
        max-height: 100%;
        border-radius: 12px;
    }
}

/* ============================================================
   SCROLLBAR HIDE
   ============================================================ */
::-webkit-scrollbar {
    width: 0px;
    height: 0px;
}
</style>

</head>
<body>

<!-- ============================================================
   LOADER SCREEN
   ============================================================ -->
<div id="loader">
    <img src="images/shora-logo.png" alt="Shora Games">
    <div id="gameTitle">SHORA GAMES</div>
    <div id="subTitle">Ninja Run</div>
    <div class="loadingContainer">
        <div class="loadingBar"></div>
    </div>
    <div class="loadingText">Loading...</div>
</div>

<!-- ============================================================
   GAME CANVAS
   ============================================================ -->
<div id="c2canvasdiv">
    <canvas id="c2canvas" width="1280" height="720">
        Your browser does not support HTML5.
    </canvas>
</div>

<!-- ============================================================
   SCRIPTS
   ============================================================ -->
<script src="jquery-2.1.1.min.js"></script>
<script src="c2runtime.js"></script>

<script>
// ============================================================
// RESPONSIVE CANVAS SIZING
// ============================================================

function resizeCanvas() {
    var winWidth = window.innerWidth;
    var winHeight = window.innerHeight;
    var canvasDiv = document.getElementById('c2canvasdiv');
    
    // Make sure canvas container fills the screen
    canvasDiv.style.width = '100%';
    canvasDiv.style.height = '100%';
    
    // Use the original canvas size function with proper scaling
    if (typeof cr_sizeCanvas === 'function') {
        cr_sizeCanvas(winWidth, winHeight);
    }
}

// ============================================================
// HANDLE WINDOW RESIZE
// ============================================================

jQuery(window).resize(function() {
    resizeCanvas();
});

// ============================================================
// HANDLE ORIENTATION CHANGE
// ============================================================

window.addEventListener('orientationchange', function() {
    setTimeout(resizeCanvas, 500);
});

// ============================================================
// HANDLE FULLSCREEN CHANGE
// ============================================================

document.addEventListener('fullscreenchange', function() {
    setTimeout(resizeCanvas, 300);
});

document.addEventListener('webkitfullscreenchange', function() {
    setTimeout(resizeCanvas, 300);
});

// ============================================================
// LOAD GAME
// ============================================================

setTimeout(function() {
    var loader = document.getElementById("loader");
    loader.style.opacity = "0";
    
    setTimeout(function() {
        loader.style.display = "none";
        
        var canvasDiv = document.getElementById("c2canvasdiv");
        canvasDiv.style.display = "block";
        
        // Create runtime
        cr_createRuntime("c2canvas");
        
        // Resize canvas after creation
        setTimeout(resizeCanvas, 100);
        
        console.log('🎮 Ninja Run loaded successfully!');
        console.log('📱 Viewport: ' + window.innerWidth + 'x' + window.innerHeight);
        
    }, 800);
    
}, 4000);

// ============================================================
// VISIBILITY CHANGE - Pause when tab hidden
// ============================================================

function onVisibilityChanged() {
    if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden) {
        cr_setSuspended(true);
    } else {
        cr_setSuspended(false);
    }
}

document.addEventListener("visibilitychange", onVisibilityChanged, false);
document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

// ============================================================
// HANDLE TOUCH EVENTS TO PREVENT SCROLL
// ============================================================

document.addEventListener('touchmove', function(e) {
    if (e.target === document.body || e.target.id === 'c2canvasdiv') {
        e.preventDefault();
    }
}, { passive: false });

// ============================================================
// DEBUG INFO
// ============================================================

console.log('%c🏃 NINJA RUN - SHORA GAMES', 'color: #00d4ff; font-size: 20px; font-weight: bold;');
console.log('%c📱 Fully responsive for all devices', 'color: #82d4ff; font-size: 14px;');
console.log('%c🖥️ Chrome Desktop Site mode supported', 'color: #fbbf24; font-size: 14px;');
</script>

</body>
</html>
