<!DOCTYPE html>
<html manifest="offline.appcache">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>SHORA GAMES | Ninja Run</title>

    <link rel="manifest" href="app.manifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           RESET - NO PERCENTAGE STRETCHING ON CANVAS!
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #07111f, #0b1830, #05070d);
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
        }

        /* ============================================================
           LOADER - Professional Animation
           ============================================================ */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            background: radial-gradient(circle at center, #0d1f3c, #081120, #020305);
            overflow: hidden;
            transition: opacity 0.8s ease;
        }

        /* ============================================================
           BACKGROUND ANIMATION - Particles / Stars
           ============================================================ */
        #loader::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 10% 50%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 50% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 30% 90%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.3), transparent);
            background-size: 200px 200px;
            opacity: 0.6;
            animation: starFloat 20s linear infinite;
            pointer-events: none;
        }

        @keyframes starFloat {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-50px) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }

        /* ============================================================
           ORB / GLOW ANIMATION
           ============================================================ */
        #loader::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.06), transparent 70%);
            border-radius: 50%;
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        /* ============================================================
           GAME TITLE - SHORA GAMES
           ============================================================ */
        #gameTitle {
            font-size: 65px;
            font-weight: 900;
            letter-spacing: 8px;
            margin-top: 0px;
            color: white;
            text-shadow: 0 0 20px #00bfff, 0 0 40px #008cff, 0 0 80px rgba(0,180,255,0.3);
            position: relative;
            z-index: 2;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px #00bfff, 0 0 40px #008cff, 0 0 80px rgba(0,180,255,0.2); }
            50% { text-shadow: 0 0 30px #00d4ff, 0 0 60px #0099ff, 0 0 100px rgba(0,180,255,0.4); }
        }

        /* ============================================================
           NINJA RUN SUBTITLE
           ============================================================ */
        #subTitle {
            margin-top: 6px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 12px;
            color: #82d4ff;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            opacity: 0.8;
        }

        /* ============================================================
           POWERED BY TORNADO
           ============================================================ */
        #poweredBy {
            margin-top: 30px;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.25);
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #poweredBy .tornado-icon {
            display: inline-block;
            font-size: 18px;
            animation: tornadoSpin 3s linear infinite;
        }

        @keyframes tornadoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #poweredBy .separator {
            color: rgba(255,255,255,0.08);
            font-size: 18px;
        }

        /* ============================================================
           LOADING BAR CONTAINER
           ============================================================ */
        .loadingContainer {
            margin-top: 40px;
            width: 380px;
            height: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 30px rgba(0,180,255,0.05);
        }

        .loadingContainer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(0, 180, 255, 0.05), transparent);
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ============================================================
           LOADING BAR
           ============================================================ */
        .loadingBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d4ff, #007bff, #00d4ff);
            background-size: 200% 100%;
            animation: load 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                       loadShine 1.5s ease-in-out infinite;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,180,255,0.3);
        }

        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes loadShine {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* ============================================================
           LOADING TEXT
           ============================================================ */
        .loadingText {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 6px;
            color: rgba(255,255,255,0.3);
            position: relative;
            z-index: 2;
            animation: textPulse 1.5s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.3; letter-spacing: 6px; }
            50% { opacity: 0.6; letter-spacing: 8px; }
        }

        /* ============================================================
           LOADING DOTS ANIMATION
           ============================================================ */
        .loadingText .dots {
            display: inline-block;
            min-width: 24px;
        }

        .loadingText .dots span {
            display: inline-block;
            animation: dotBounce 1.4s ease-in-out infinite;
        }

        .loadingText .dots span:nth-child(2) { animation-delay: 0.2s; }
        .loadingText .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ============================================================
           CANVAS - CRITICAL: NO PERCENTAGE STRETCHING!
           ============================================================ */
        /* The canvas size is set EXACTLY by JavaScript */
        #c2canvasdiv {
            display: none;
            margin: auto;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #c2canvasdiv canvas {
            /* CRITICAL: NO width:100% or height:100% here! */
            /* Size is set by JavaScript with exact pixel values */
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 0;
            box-shadow: none;
            background: #000;
            image-rendering: auto;
        }

        /* ============================================================
           RESPONSIVE - Only for loader text
           ============================================================ */
        @media (max-width: 768px) {
            #gameTitle {
                font-size: 38px;
                letter-spacing: 5px;
            }
            #subTitle {
                font-size: 14px;
                letter-spacing: 8px;
            }
            .loadingContainer {
                width: 260px;
            }
            #poweredBy {
                font-size: 11px;
                letter-spacing: 3px;
            }
            #loader::after {
                width: 300px;
                height: 300px;
            }
        }

        @media (max-width: 480px) {
            #gameTitle {
                font-size: 28px;
                letter-spacing: 4px;
            }
            #subTitle {
                font-size: 11px;
                letter-spacing: 6px;
            }
            .loadingContainer {
                width: 200px;
                height: 3px;
            }
            .loadingText {
                font-size: 11px;
                letter-spacing: 4px;
            }
            #poweredBy {
                font-size: 10px;
                letter-spacing: 2px;
                margin-top: 20px;
            }
            #loader::after {
                width: 200px;
                height: 200px;
            }
        }
    </style>

</head>

<body>

    <!-- ===== LOADER ===== -->
    <div id="loader">
        <div id="gameTitle">SHORA GAMES</div>
        <div id="subTitle">Ninja Run</div>
        <div class="loadingContainer">
            <div class="loadingBar"></div>
        </div>
        <div class="loadingText">
            LOADING<span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
        <div id="poweredBy">
            <span class="tornado-icon">🌪️</span>
            <span class="separator">|</span>
            <span>POWERED BY TORNADO</span>
        </div>
    </div>

    <!-- ===== GAME CANVAS CONTAINER ===== -->
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="1280" height="720">
            Your browser does not support HTML5.
        </canvas>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="jquery-2.1.1.min.js"></script>
    <script src="c2runtime.js"></script>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;
        const GAME_ASPECT = GAME_WIDTH / GAME_HEIGHT;

        let gameRuntime = null;
        let canvasElement = null;
        let fitAttempts = 0;

        // ============================================================
        // THE TRICK: LETTERBOX SCALING
        // ============================================================

        function fitCanvasToScreen() {
            fitAttempts++;

            // Get the canvas
            const canvas = document.getElementById('c2canvas');
            if (!canvas) {
                console.log('⏳ Canvas not found, attempt', fitAttempts);
                if (fitAttempts < 30) {
                    setTimeout(fitCanvasToScreen, 200);
                }
                return;
            }
            canvasElement = canvas;

            // Get the runtime
            if (!gameRuntime) {
                if (canvas.c2runtime) {
                    gameRuntime = canvas.c2runtime;
                    window.gameRuntime = gameRuntime;
                } else if (window.c2runtime) {
                    gameRuntime = window.c2runtime;
                    window.gameRuntime = gameRuntime;
                } else {
                    console.log('⏳ Runtime not found, attempt', fitAttempts);
                    if (fitAttempts < 30) {
                        setTimeout(fitCanvasToScreen, 200);
                    }
                    return;
                }
            }

            // Get container dimensions
            const containerW = window.innerWidth;
            const containerH = window.innerHeight;

            // Calculate letterbox dimensions
            const containerAspect = containerW / containerH;
            let displayW, displayH;

            if (containerAspect > GAME_ASPECT) {
                // Container is wider than game - letterbox left/right
                displayH = containerH;
                displayW = displayH * GAME_ASPECT;
            } else {
                // Container is taller/narrower - letterbox top/bottom
                displayW = containerW;
                displayH = displayW / GAME_ASPECT;
            }

            // Ensure valid numbers
            if (!isFinite(displayW) || !isFinite(displayH) || displayW <= 0 || displayH <= 0) {
                displayW = Math.min(containerW, GAME_WIDTH);
                displayH = displayW / GAME_ASPECT;
                if (displayH > containerH) {
                    displayH = containerH;
                    displayW = displayH * GAME_ASPECT;
                }
            }

            // Get the container div
            const container = document.getElementById('c2canvasdiv');
            if (container) {
                container.style.display = 'flex';
                container.style.justifyContent = 'center';
                container.style.alignItems = 'center';
                container.style.position = 'fixed';
                container.style.top = '0';
                container.style.left = '0';
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.background = '#000';
            }

            // Apply exact pixel size (NO PERCENTAGES!)
            canvas.style.width = displayW + 'px';
            canvas.style.height = displayH + 'px';
            canvas.style.position = 'absolute';
            canvas.style.left = ((containerW - displayW) / 2) + 'px';
            canvas.style.top = ((containerH - displayH) / 2) + 'px';
            canvas.style.display = 'block';
            canvas.style.borderRadius = '0';
            canvas.style.boxShadow = 'none';

            // Handle devicePixelRatio for retina
            const dpr = window.devicePixelRatio || 1;
            canvas.width = displayW * dpr;
            canvas.height = displayH * dpr;

            // CRITICAL: Tell the engine the real displayed size, forced
            if (gameRuntime && typeof gameRuntime.setSize === 'function') {
                gameRuntime.setSize(displayW, displayH, true);
                console.log('✅ Runtime size set to:', displayW, 'x', displayH, '(DPR:', dpr, ')');
            }

            console.log('✅ Canvas scaled to:', displayW, 'x', displayH);
            console.log('📍 Canvas position:', canvas.style.left, canvas.style.top);

            // Hide loader
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 500);
            }
        }

        // ============================================================
        // FIX AUDIO LISTENER ERROR
        // ============================================================

        function fixAudioListener() {
            try {
                const runtime = gameRuntime || window.gameRuntime;
                if (!runtime) return false;

                if (runtime.glwrap && runtime.glwrap.ctx && runtime.glwrap.ctx.listener) {
                    const listener = runtime.glwrap.ctx.listener;
                    if (listener.setPosition) {
                        listener.setPosition(640, 360, -600);
                        console.log('✅ Audio listener position fixed');
                    }
                    if (listener.setOrientation) {
                        listener.setOrientation(0, 0, 1, 0, -1, 0);
                    }
                    return true;
                }
                return false;
            } catch (e) {
                console.warn('⚠️ Audio listener fix error:', e);
                return false;
            }
        }

        // ============================================================
        // OVERRIDE ORIGINAL RESIZE
        // ============================================================

        // Override the original cr_sizeCanvas function
        const originalResize = window.cr_sizeCanvas || function(w, h) {};
        window.cr_sizeCanvas = function(w, h) {
            // Let our fitCanvasToScreen handle it
            console.log('📐 cr_sizeCanvas called with:', w, 'x', h);
            // Call original for compatibility
            originalResize(w, h);
            // Apply our scaling
            setTimeout(fitCanvasToScreen, 50);
        };

        // ============================================================
        // INIT GAME
        // ============================================================

        // Show loader
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';

        // Wait for loader animation then start game
        setTimeout(function() {
            // Show canvas container
            const canvasDiv = document.getElementById('c2canvasdiv');
            canvasDiv.style.display = 'flex';

            // Create runtime
            cr_createRuntime('c2canvas');

            // Wait for runtime to be ready
            setTimeout(function() {
                // Get runtime reference
                const canvas = document.getElementById('c2canvas');
                if (canvas && canvas.c2runtime) {
                    gameRuntime = canvas.c2runtime;
                    window.gameRuntime = gameRuntime;
                }

                // Fit canvas to screen
                setTimeout(fitCanvasToScreen, 100);
                setTimeout(fitCanvasToScreen, 300);
                setTimeout(fitCanvasToScreen, 500);

                // Fix audio
                setTimeout(fixAudioListener, 500);
                setTimeout(fixAudioListener, 1000);

                console.log('✅ Game initialized with letterbox scaling');
            }, 100);

        }, 4000);

        // ============================================================
        // WINDOW RESIZE / ORIENTATION CHANGE
        // ============================================================

        window.addEventListener('resize', function() {
            setTimeout(fitCanvasToScreen, 50);
        });

        window.addEventListener('orientationchange', function() {
            setTimeout(fitCanvasToScreen, 300);
        });

        // ============================================================
        // VISIBILITY CHANGE (Pause/Resume)
        // ============================================================

        function onVisibilityChanged() {
            if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden) {
                cr_setSuspended(true);
            } else {
                cr_setSuspended(false);
                // Re-fit on visibility restore
                setTimeout(fitCanvasToScreen, 100);
            }
        }

        document.addEventListener("visibilitychange", onVisibilityChanged, false);
        document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

        // ============================================================
        // DEBUG
        // ============================================================

        console.log('');
        console.log('🪙 ===========================================');
        console.log('🪙 NINJA RUN - LETTERBOX SCALING ENABLED');
        console.log('🪙 ===========================================');
        console.log('📐 Game Size:', GAME_WIDTH + 'x' + GAME_HEIGHT);
        console.log('✅ No CSS stretching on canvas');
        console.log('✅ runtime.setSize() used for engine sync');
        console.log('✅ devicePixelRatio support enabled');
        console.log('✅ Audio listener fix applied');
        console.log('===========================================');

        // Expose for debugging
        window.__gameDebug = {
            fitCanvas: fitCanvasToScreen,
            fixAudio: fixAudioListener,
            runtime: () => gameRuntime || window.gameRuntime,
            status: function() {
                const canvas = document.getElementById('c2canvas');
                return {
                    canvasWidth: canvas ? canvas.width : 'N/A',
                    canvasHeight: canvas ? canvas.height : 'N/A',
                    styleWidth: canvas ? canvas.style.width : 'N/A',
                    styleHeight: canvas ? canvas.style.height : 'N/A',
                    runtime: !!gameRuntime,
                    runtimeSetSize: gameRuntime && typeof gameRuntime.setSize === 'function'
                };
            }
        };

        console.log('📊 Debug: __gameDebug.status()');
        console.log('📊 Fit canvas: __gameDebug.fitCanvas()');
    </script>

    <!-- ===== NINJA RUN BRIDGE ===== -->
    <script src="../../js/ninja-run-bridge.js"></script>

</body>
</html>
