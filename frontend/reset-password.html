<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
<title>Shora Games — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  :root {
    --bg-deep: #06111F;
    --bg-secondary: #0B1F36;
    --bg-tertiary: #102A43;
    --glow-primary: #00BFFF;
    --glow-primary-dim: rgba(0, 191, 255, 0.3);
    --glow-success: #00E5A0;
    --text-primary: #F8FAFC;
    --text-muted: #94A3B8;
    --border-glow: rgba(0, 191, 255, 0.25);
    --blur-lg: blur(20px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    font-family: 'Syne', 'Inter', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
    z-index: -2;
  }

  body::after {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(0, 191, 255, 0.12) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: -1;
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(0, 191, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 191, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--glow-primary);
    border-radius: 50%;
    opacity: 0;
    animation: float-particle linear infinite;
  }
  @keyframes float-particle {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: 0.6; }
    90% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1.5); }
  }

  .glow-line {
    position: fixed;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glow-primary), transparent);
    box-shadow: 0 0 20px var(--glow-primary);
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }
  .glow-line-top { top: 80px; }
  .glow-line-bottom { bottom: 80px; }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .reset-card {
    background: rgba(6, 17, 31, 0.85);
    backdrop-filter: var(--blur-lg);
    border: 1px solid var(--border-glow);
    border-radius: 28px;
    padding: 2.5rem 2rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
    width: 100%;
    max-width: 480px;
    animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo { text-align: center; margin-bottom: 2rem; }
  .logo-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 60px; height: 60px;
    background: linear-gradient(135deg, rgba(0, 191, 255, 0.2), rgba(0, 191, 255, 0.05));
    border-radius: 16px;
    margin-bottom: 0.75rem;
    font-size: 32px;
    border: 1px solid rgba(0, 191, 255, 0.3);
    box-shadow: 0 0 20px rgba(0, 191, 255, 0.2);
  }
  .logo-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem;
    font-weight: 900;
    background: linear-gradient(90deg, #00BFFF, #7C3AED);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .logo-sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .title i { color: var(--glow-primary); font-size: 1.3rem; }

  .description {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 1.5rem;
  }
  .field label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field label i { font-size: 12px; color: var(--glow-primary); }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-icon {
    position: absolute;
    left: 14px;
    font-size: 16px;
    color: var(--text-muted);
    pointer-events: none;
    transition: color 0.2s;
  }
  .input-wrap:focus-within .input-icon { color: var(--glow-primary); }

  .input-wrap input {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(0, 191, 255, 0.25);
    border-radius: 12px;
    padding: 0.9rem 0.9rem 0.9rem 2.75rem;
    color: var(--text-primary);
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: all 0.3s ease;
  }
  .input-wrap input:focus {
    border-color: var(--glow-primary);
    background: rgba(0, 191, 255, 0.05);
    box-shadow: 0 0 20px rgba(0, 191, 255, 0.3);
  }

  .btn-reset {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, rgba(0, 191, 255, 0.2), rgba(0, 191, 255, 0.08));
    border: 1px solid var(--glow-primary);
    border-radius: 14px;
    color: var(--text-primary);
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-reset:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(0, 191, 255, 0.3);
  }
  .btn-reset:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #00BFFF;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-reset.loading .btn-text { display: none; }
  .btn-reset.loading .spinner { display: inline-block; }
  .btn-reset.loading i { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .message-box {
    display: none;
    background: rgba(0, 229, 160, 0.1);
    border: 1px solid var(--glow-success);
    border-radius: 12px;
    padding: 1rem;
    margin-top: 1.5rem;
    text-align: center;
    animation: fade-in 0.4s ease;
  }
  .message-box.show { display: block; }
  .message-box i { color: var(--glow-success); font-size: 1.2rem; margin-right: 8px; }
  .message-box p { color: var(--glow-success); font-size: 0.85rem; }

  .error-box {
    display: none;
    background: rgba(255, 77, 109, 0.1);
    border: 1px solid #FF4D6D;
    border-radius: 12px;
    padding: 1rem;
    margin-top: 1rem;
    text-align: center;
    animation: fade-in 0.4s ease;
  }
  .error-box.show { display: block; }
  .error-box i { color: #FF4D6D; font-size: 1.2rem; margin-right: 8px; }
  .error-box p { color: #FF4D6D; font-size: 0.85rem; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .reset-card { padding: 1.5rem; margin: 1rem; }
    .title { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div class="grid-overlay"></div>
<div class="particles" id="particles"></div>
<div class="glow-line glow-line-top"></div>
<div class="glow-line glow-line-bottom"></div>

<div class="page">
  <div class="reset-card">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-gamepad"></i></div>
      <div class="logo-title">SHORA GAMES</div>
      <div class="logo-sub">Play · Compete · Win</div>
    </div>

    <div class="title">
      <i class="fas fa-key"></i>
      <span>Create New Password</span>
    </div>
    <div class="description">
      Please enter your new password below.
    </div>

    <div class="field">
      <label><i class="fas fa-lock"></i> New Password</label>
      <div class="input-wrap">
        <span class="input-icon"><i class="fas fa-key"></i></span>
        <input type="password" id="newPassword" placeholder="Minimum 6 characters"/>
      </div>
    </div>

    <div class="field">
      <label><i class="fas fa-check-circle"></i> Confirm Password</label>
      <div class="input-wrap">
        <span class="input-icon"><i class="fas fa-check"></i></span>
        <input type="password" id="confirmPassword" placeholder="Confirm your new password"/>
      </div>
    </div>

    <button class="btn-reset" id="resetBtn">
      <i class="fas fa-save"></i>
      <span class="btn-text">RESET PASSWORD</span>
      <div class="spinner"></div>
    </button>

    <div class="message-box" id="successMessage">
      <i class="fas fa-check-circle"></i>
      <p>Password has been reset successfully!</p>
      <p style="font-size: 0.7rem; margin-top: 8px;">Redirecting to login page...</p>
    </div>

    <div class="error-box" id="errorMessage">
      <i class="fas fa-exclamation-triangle"></i>
      <p id="errorText">Something went wrong. Please try again.</p>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
  import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDTcM9aUFhOpJTdQTSZAF_1XMEt6GL48Hs",
    authDomain: "shora-games.firebaseapp.com",
    projectId: "shora-games",
    databaseURL: "https://shora-games-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Particles
  (function(){
    const c = document.getElementById('particles');
    for(let i=0;i<40;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `left:${Math.random()*100}%;bottom:${Math.random()*20}%;animation-duration:${6+Math.random()*10}s;animation-delay:${Math.random()*8}s;width:${1+Math.random()*3}px;height:${1+Math.random()*3}px`;
      c.appendChild(p);
    }
  })();

  // Get the oobCode from URL
  const urlParams = new URLSearchParams(window.location.search);
  const mode = urlParams.get('mode');
  const oobCode = urlParams.get('oobCode');

  let verifiedEmail = null;

  function showError(message){
    const errorBox = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successBox = document.getElementById('successMessage');
    errorText.textContent = message;
    successBox.classList.remove('show');
    errorBox.classList.add('show');
    setTimeout(() => {
      errorBox.classList.remove('show');
    }, 5000);
  }

  function showSuccess(message){
    const successBox = document.getElementById('successMessage');
    const errorBox = document.getElementById('errorMessage');
    errorBox.classList.remove('show');
    successBox.classList.add('show');
  }

  function setLoading(btnId, loading){
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
  }

  // Verify the reset code is valid
  async function verifyResetCode() {
    if (!oobCode || mode !== 'resetPassword') {
      showError('Invalid or expired reset link. Please request a new password reset.');
      document.getElementById('resetBtn').disabled = true;
      return false;
    }

    try {
      const email = await verifyPasswordResetCode(auth, oobCode);
      verifiedEmail = email;
      console.log('Reset code verified for:', email);
      return true;
    } catch (error) {
      console.error('Code verification error:', error.code);
      if (error.code === 'auth/expired-action-code') {
        showError('This reset link has expired. Please request a new password reset.');
      } else if (error.code === 'auth/invalid-action-code') {
        showError('Invalid reset link. Please request a new password reset.');
      } else {
        showError('Unable to verify reset link. Please try again.');
      }
      document.getElementById('resetBtn').disabled = true;
      return false;
    }
  }

  // Reset the password
  async function resetPassword() {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!newPassword || !confirmPassword) {
      showError('Please enter your new password.');
      return;
    }

    if (newPassword.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }

    if (newPassword !== confirmPassword) {
      showError('Passwords do not match.');
      return;
    }

    setLoading('resetBtn', true);

    try {
      await confirmPasswordReset(auth, oobCode, newPassword);
      showSuccess('Password has been reset successfully!');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 3000);
    } catch (error) {
      console.error('Password reset error:', error.code);
      if (error.code === 'auth/expired-action-code') {
        showError('This reset link has expired. Please request a new password reset.');
      } else if (error.code === 'auth/invalid-action-code') {
        showError('Invalid reset link. Please request a new password reset.');
      } else if (error.code === 'auth/weak-password') {
        showError('Password is too weak. Please use a stronger password.');
      } else {
        showError('Unable to reset password. Please try again.');
      }
      setLoading('resetBtn', false);
    }
  }

  document.getElementById('resetBtn').addEventListener('click', resetPassword);
  document.getElementById('newPassword').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') resetPassword();
  });
  document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') resetPassword();
  });

  // Verify the code when page loads
  verifyResetCode();

  console.log('%c🔐 SHORA GAMES - PASSWORD RESET HANDLER', 'color: #00BFFF; font-size: 14px; font-weight: bold;');
  console.log('%c📧 Mode:', mode, '| Code:', oobCode ? 'Present' : 'Missing', 'color: #00E5A0; font-size: 12px;');
</script>
</body>
</html>
