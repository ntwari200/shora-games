<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ninja Run - Shora Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            background: #06111F;
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #gameContainer {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            max-width: 1280px;
            margin: 0 auto;
            background: #000;
            box-shadow: 0 0 60px rgba(0, 191, 255, 0.05);
        }

        .game-header {
            position: relative;
            z-index: 100;
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(16px);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 191, 255, 0.1);
            flex-shrink: 0;
            min-height: 56px;
            gap: 12px;
            flex-wrap: wrap;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            border-left: 1px solid rgba(0, 191, 255, 0.1);
            border-right: 1px solid rgba(0, 191, 255, 0.1);
        }

        .game-header .title {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: #00BFFF;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }
        .game-header .title i { 
            color: #FFD700; 
            font-size: 1rem;
        }
        .game-header .title .sub {
            font-size: 0.6rem;
            color: #A7B5C5;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 191, 255, 0.08);
            border: 1px solid rgba(0, 191, 255, 0.15);
            border-radius: 20px;
            padding: 4px 16px;
            font-family: 'Orbitron', monospace;
            font-size: 0.95rem;
            color: #FFD700;
            white-space: nowrap;
        }
        .score-display i {
            color: #FFD700;
            font-size: 0.8rem;
        }
        .score-display .score-value {
            font-weight: 700;
            min-width: 40px;
            text-align: center;
            color: #00E676;
            transition: all 0.3s ease;
        }
        .score-display .score-value.pulse {
            animation: scorePulse 0.3s ease;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); color: #FFD700; }
        }

        .status-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: #A7B5C5;
            white-space: nowrap;
        }
        .status-display .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00E676;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        .status-display .dot.complete {
            background: #FFD700;
            animation: none;
        }
        .status-display .dot.error {
            background: #FF4D6D;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        #gameFrame {
            flex: 1;
            width: 100%;
            border: none;
            background: #000;
            min-height: 0;
            max-width: 1280px;
            margin: 0 auto;
            height: calc(100vh - 56px);
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #06111F;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(20px);
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingOverlay .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 191, 255, 0.1);
            border-top-color: #00BFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loadingOverlay .text {
            margin-top: 20px;
            color: #A7B5C5;
            font-size: 0.9rem;
            font-family: 'Orbitron', monospace;
        }
        #loadingOverlay .error-text {
            color: #FF4D6D;
            margin-top: 10px;
            font-size: 0.8rem;
            display: none;
        }
        #loadingOverlay .progress-bar {
            margin-top: 16px;
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
        }
        #loadingOverlay .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #00BFFF, #6C63FF);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }
        #loadingOverlay .retry-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #00BFFF, #6C63FF);
            border: none;
            color: #000;
            padding: 10px 30px;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            display: none;
            transition: all 0.3s ease;
        }
        #loadingOverlay .retry-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 191, 255, 0.3);
        }

        .toast-cyber {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 50px;
            padding: 12px 24px;
            color: #00E676;
            font-size: 0.9rem;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .toast-cyber.error {
            border-color: rgba(255, 77, 109, 0.3);
            color: #FF4D6D;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (max-width: 1280px) {
            #gameContainer, .game-header, #gameFrame { max-width: 100%; }
            .game-header { border-left: none; border-right: none; }
        }

        @media (max-width: 768px) {
            .game-header {
                padding: 6px 12px;
                min-height: 48px;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .game-header .title { font-size: 0.8rem; }
            .game-header .title .sub { font-size: 0.5rem; }
            .score-display { font-size: 0.8rem; padding: 3px 12px; }
            .status-display { font-size: 0.6rem; }
            #gameFrame { height: calc(100vh - 48px); }
            body { min-width: unset; min-height: unset; }
        }

        @media (max-width: 480px) {
            .game-header {
                padding: 4px 8px;
                min-height: 42px;
                gap: 4px;
            }
            .game-header .title { font-size: 0.7rem; }
            .game-header .title .sub { font-size: 0.45rem; }
            .score-display { font-size: 0.7rem; padding: 2px 10px; }
            .status-display { font-size: 0.5rem; }
            #gameFrame { height: calc(100vh - 42px); }
            #loadingOverlay .spinner { width: 35px; height: 35px; }
            #loadingOverlay .text { font-size: 0.75rem; }
            #loadingOverlay .progress-bar { width: 140px; }
        }

        ::-webkit-scrollbar { width: 0px; height: 0px; }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="text" id="loadingText">🏃 Loading Ninja Run...</div>
        <div class="error-text" id="errorText">⚠️ Error loading game. Please try again.</div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <button class="retry-btn" id="retryBtn" onclick="location.reload()">
            🔄 Retry
        </button>
    </div>

    <div id="gameContainer">
        <div class="game-header" id="gameHeader">
            <div class="title">
                <i class="fas fa-gamepad"></i>
                <span>Ninja Run</span>
                <span class="sub">| Tournament</span>
            </div>
            <div class="score-display">
                <i class="fas fa-star"></i>
                <span>Score:</span>
                <span class="score-value" id="scoreDisplay">0</span>
            </div>
            <div class="status-display">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Loading...</span>
            </div>
        </div>
        <iframe id="gameFrame" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
    </div>

    <script>
        // ========================================
        // CONFIG
        // ========================================

        const params = new URLSearchParams(window.location.search);
        const EVENT_ID = params.get('event') || 'event_001';
        const USER_ID = params.get('user') || 'user_001';
        const GAME_URL = 'games/ninja run/index.html';

        console.log('🎮 Ninja Run Wrapper loaded');
        console.log(`📋 Event: ${EVENT_ID}`);
        console.log(`👤 User: ${USER_ID}`);

        // ========================================
        // COMPLETE BRIDGE CODE (Embedded)
        // ========================================

        const BRIDGE_CODE = `
        // ========================================
        // NINJA RUN BRIDGE - Embedded Version
        // ========================================
        
        (function() {
            'use strict';
            
            console.log('🏃 Ninja Run Bridge (Embedded) loaded');
            
            const EVENT_ID = '${EVENT_ID}';
            const USER_ID = '${USER_ID}';
            
            let gameScore = 0;
            let scoreSubmitted = false;
            let runtime = null;
            let checkInterval = null;
            let gameStarted = false;
            
            // ========================================
            // SCORE HANDLING
            // ========================================
            
            window.ninjaRunComplete = function(score) {
                console.log('🎮 Game Complete! Score:', score);
                if (scoreSubmitted) return;
                
                const finalScore = parseInt(score) || gameScore || 0;
                gameScore = finalScore;
                console.log('📊 Final Score:', finalScore);
                
                // Store in session storage
                sessionStorage.setItem('ninjaRunScore', finalScore.toString());
                sessionStorage.setItem('ninjaRunPlayed', 'true');
                sessionStorage.setItem('ninjaRunFinalScore', finalScore.toString());
                sessionStorage.setItem('ninjaRunComplete', 'true');
                
                // Send to parent
                if (window.parent && window.parent !== window) {
                    try {
                        window.parent.postMessage({
                            type: 'NINJA_RUN_COMPLETE',
                            score: finalScore,
                            eventId: EVENT_ID,
                            userId: USER_ID,
                            timestamp: Date.now()
                        }, '*');
                        console.log('✅ Score sent to parent via postMessage');
                    } catch (e) {
                        console.log('⚠️ Could not send to parent:', e);
                    }
                }
                
                scoreSubmitted = true;
                showCompletionMessage(finalScore);
            };
            
            function showCompletionMessage(score) {
                if (document.getElementById('ninjaRunOverlay')) return;
                
                const overlay = document.createElement('div');
                overlay.id = 'ninjaRunOverlay';
                overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:Orbitron,monospace;color:#fff;';
                overlay.innerHTML = \`
                    <div style="background:linear-gradient(135deg,#06111F,#0B1F36);border:2px solid #00BFFF;border-radius:20px;padding:30px 40px;text-align:center;max-width:400px;">
                        <div style="font-size:3.5rem;">🏆</div>
                        <h2 style="color:#FFD700;font-size:1.3rem;">Game Complete!</h2>
                        <div style="font-size:2.5rem;color:#00E676;font-weight:700;margin:8px 0;">\${score}</div>
                        <div style="color:#A7B5C5;">points</div>
                        <div style="margin-top:12px;font-size:0.7rem;color:#A7B5C5;">
                            <i class="fas fa-sync fa-spin"></i> Submitting score...
                        </div>
                        <button onclick="window.close()" style="margin-top:20px;background:linear-gradient(135deg,#00BFFF,#6C63FF);border:none;color:#000;padding:10px 25px;border-radius:10px;font-family:Orbitron,monospace;font-weight:700;cursor:pointer;font-size:0.75rem;">
                            Close & View Rankings
                        </button>
                    </div>
                \`;
                document.body.appendChild(overlay);
                
                setTimeout(() => window.close(), 5000);
            }
            
            // ========================================
            // HOOK INTO GAME
            // ========================================
            
            function waitForRuntime() {
                console.log('⏳ Waiting for Construct 2 runtime...');
                let attempts = 0;
                
                const checkRuntime = setInterval(() => {
                    attempts++;
                    try {
                        const canvas = document.getElementById('c2canvas');
                        if (canvas && canvas.c2runtime) {
                            clearInterval(checkRuntime);
                            runtime = canvas.c2runtime;
                            console.log('✅ Runtime detected');
                            hookIntoGame(runtime);
                            return;
                        }
                    } catch(e) {}
                    if (attempts > 50) {
                        clearInterval(checkRuntime);
                        console.log('⚠️ Runtime not found, starting fallback');
                        startFallbackMonitor();
                    }
                }, 500);
            }
            
            function hookIntoGame(runtime) {
                console.log('🔗 Hooking into game...');
                
                // Hook into tick
                const originalTick = runtime.tick;
                runtime.tick = function() {
                    originalTick.call(this);
                    try {
                        if (runtime.globalVars) {
                            // Check for score
                            for (const key in runtime.globalVars) {
                                const lowerKey = key.toLowerCase();
                                if (lowerKey.includes('score') || lowerKey.includes('distance')) {
                                    const val = runtime.globalVars[key];
                                    if (typeof val === 'number' && val > gameScore) {
                                        gameScore = val;
                                        sessionStorage.setItem('ninjaRunLiveScore', gameScore.toString());
                                        // Send live update to parent
                                        try {
                                            if (window.parent && window.parent !== window) {
                                                window.parent.postMessage({
                                                    type: 'NINJA_RUN_SCORE',
                                                    score: gameScore
                                                }, '*');
                                            }
                                        } catch(e) {}
                                    }
                                }
                            }
                            // Check for game over
                            if (runtime.globalVars['GameOver'] === true || runtime.globalVars['gameOver'] === true) {
                                if (gameScore > 0 && !scoreSubmitted) {
                                    console.log('🎯 Game Over detected');
                                    window.ninjaRunComplete(gameScore);
                                }
                            }
                        }
                    } catch(e) {}
                };
                
                // Hook into triggers
                const originalTrigger = runtime.trigger;
                runtime.trigger = function(method, inst, value) {
                    const result = originalTrigger.call(this, method, inst, value);
                    try {
                        if (method && method.name) {
                            const name = method.name;
                            if (name.includes('End') || name.includes('GameOver') || name.includes('Finish') || name.includes('Complete')) {
                                if (gameScore > 0 && !scoreSubmitted) {
                                    console.log('🎯 Game end detected via trigger:', name);
                                    window.ninjaRunComplete(gameScore);
                                }
                            }
                        }
                    } catch(e) {}
                    return result;
                };
                
                gameStarted = true;
                console.log('✅ Game hooked successfully');
                console.log('📊 Initial Score:', gameScore);
            }
            
            // ========================================
            // FALLBACK MONITOR
            // ========================================
            
            function startFallbackMonitor() {
                console.log('📊 Fallback monitor started');
                let noChangeCount = 0;
                let lastScore = 0;
                
                checkInterval = setInterval(() => {
                    try {
                        // Check session storage
                        const played = sessionStorage.getItem('ninjaRunPlayed');
                        const score = sessionStorage.getItem('ninjaRunScore');
                        const liveScore = sessionStorage.getItem('ninjaRunLiveScore');
                        
                        if (liveScore !== null) {
                            const val = parseInt(liveScore);
                            if (val > gameScore) {
                                gameScore = val;
                            }
                        }
                        
                        if (played === 'true' && score !== null && !scoreSubmitted) {
                            clearInterval(checkInterval);
                            window.ninjaRunComplete(parseInt(score));
                            return;
                        }
                        
                        // Check if game ended (score unchanged for 15 seconds with score > 0)
                        if (gameScore > 0 && !scoreSubmitted) {
                            if (gameScore === lastScore) {
                                noChangeCount++;
                                if (noChangeCount > 30) {
                                    console.log('⏰ Auto-submit after timeout');
                                    window.ninjaRunComplete(gameScore);
                                }
                            } else {
                                lastScore = gameScore;
                                noChangeCount = 0;
                            }
                        }
                    } catch(e) {}
                }, 500);
                
                setTimeout(() => {
                    if (checkInterval) {
                        clearInterval(checkInterval);
                        if (gameScore > 0 && !scoreSubmitted) {
                            console.log('⏰ Final timeout, submitting score');
                            window.ninjaRunComplete(gameScore);
                        }
                    }
                }, 120000);
            }
            
            // ========================================
            // DEBUG HELPERS
            // ========================================
            
            window.__ninjaDebug = {
                score: () => gameScore,
                status: () => ({
                    score: gameScore,
                    submitted: scoreSubmitted,
                    started: gameStarted,
                    runtime: !!runtime
                }),
                submit: (s) => window.ninjaRunComplete(s)
            };
            
            // ========================================
            // INIT
            // ========================================
            
            console.log('🚀 Embedded Ninja Run Bridge initializing...');
            waitForRuntime();
            console.log('✅ Embedded bridge ready');
            console.log('📊 Type __ninjaDebug.status() for status');
        })();
        `;

        // ========================================
        // INJECT BRIDGE INTO IFRAME
        // ========================================

        function injectBridge() {
            try {
                const frame = document.getElementById('gameFrame');
                const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                
                if (!frameDoc) {
                    console.log('⚠️ Cannot access iframe document');
                    startFallbackMonitor();
                    return;
                }
                
                // Check if bridge already exists
                if (frameDoc.getElementById('ninjaBridgeScript')) {
                    console.log('✅ Bridge already injected');
                    return;
                }
                
                // Create script with embedded bridge code
                const script = frameDoc.createElement('script');
                script.id = 'ninjaBridgeScript';
                script.type = 'text/javascript';
                script.textContent = BRIDGE_CODE;
                
                frameDoc.head.appendChild(script);
                console.log('✅ Bridge injected successfully (embedded)');
                
            } catch (e) {
                console.log('⚠️ Error injecting bridge:', e);
                startFallbackMonitor();
            }
        }

        // ========================================
        // TOAST
        // ========================================

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast-cyber');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-cyber';
            if (type === 'error') toast.classList.add('error');
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ========================================
        // LOAD GAME
        // ========================================

        function loadGame() {
            const frame = document.getElementById('gameFrame');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const progressFill = document.getElementById('progressFill');
            const loadingText = document.getElementById('loadingText');
            const errorText = document.getElementById('errorText');
            const retryBtn = document.getElementById('retryBtn');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            errorText.style.display = 'none';
            retryBtn.style.display = 'none';
            loadingText.textContent = '🏃 Loading Ninja Run...';
            progressFill.style.width = '0%';
            statusText.textContent = 'Loading...';
            statusDot.className = 'dot';

            const timestamp = Date.now();
            const gameUrl = `${GAME_URL}?event=${EVENT_ID}&user=${USER_ID}&t=${timestamp}`;
            frame.src = gameUrl;

            let progress = 0;
            let loadAttempts = 0;
            const maxAttempts = 50;

            const progressInterval = setInterval(() => {
                progress += Math.random() * 8 + 2;
                if (progress > 95) progress = 95;
                progressFill.style.width = progress + '%';
            }, 200);

            const loadCheck = setInterval(() => {
                loadAttempts++;
                
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                    
                    if (frameDoc) {
                        const canvas = frameDoc.getElementById('c2canvas');
                        const bodyContent = frameDoc.body?.innerHTML || '';
                        
                        if (canvas || bodyContent.includes('c2canvas') || bodyContent.includes('Construct 2')) {
                            clearInterval(progressInterval);
                            clearInterval(loadCheck);
                            
                            progressFill.style.width = '100%';
                            loadingText.textContent = '✅ Game Loaded!';
                            
                            setTimeout(() => {
                                loadingOverlay.classList.add('hidden');
                                statusText.textContent = 'Playing...';
                                statusDot.className = 'dot';
                            }, 400);
                            
                            setTimeout(() => injectBridge(), 1500);
                            return;
                        }
                    }
                } catch (e) {
                    console.log('⏳ Waiting for game to load...', loadAttempts);
                }

                if (loadAttempts >= maxAttempts) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                    
                    errorText.style.display = 'block';
                    retryBtn.style.display = 'block';
                    loadingText.textContent = '⚠️ Game taking too long to load';
                    statusText.textContent = '⚠️ Error';
                    statusDot.className = 'dot error';
                    
                    showToast('⚠️ Game failed to load. Please try again.', 'error');
                }
            }, 200);

            setTimeout(() => {
                if (!loadingOverlay.classList.contains('hidden')) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                }
            }, 10000);
        }

        // ========================================
        // FALLBACK MONITOR (Parent)
        // ========================================

        function startFallbackMonitor() {
            console.log('📊 Starting parent fallback monitor');
            
            const checkInterval = setInterval(() => {
                try {
                    const played = sessionStorage.getItem('ninjaRunPlayed');
                    const score = sessionStorage.getItem('ninjaRunScore');
                    const liveScore = sessionStorage.getItem('ninjaRunLiveScore');
                    
                    if (liveScore !== null) {
                        document.getElementById('scoreDisplay').textContent = parseInt(liveScore).toLocaleString();
                    }
                    
                    if (played === 'true' && score !== null) {
                        clearInterval(checkInterval);
                        const scoreValue = parseInt(score);
                        document.getElementById('scoreDisplay').textContent = scoreValue.toLocaleString();
                        document.getElementById('statusText').textContent = '✅ Complete!';
                        document.getElementById('statusDot').className = 'dot complete';
                        window.onNinjaRunComplete(scoreValue, EVENT_ID, USER_ID);
                    }
                } catch (e) {}
            }, 500);

            setTimeout(() => {
                clearInterval(checkInterval);
            }, 180000);
        }

        // ========================================
        // SCORE UPDATES
        // ========================================

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NINJA_RUN_SCORE') {
                const display = document.getElementById('scoreDisplay');
                const score = event.data.score || 0;
                display.textContent = score.toLocaleString();
                display.className = 'score-value pulse';
                setTimeout(() => {
                    display.className = 'score-value';
                }, 300);
            }
            if (event.data && event.data.type === 'NINJA_RUN_COMPLETE') {
                const display = document.getElementById('scoreDisplay');
                display.textContent = (event.data.score || 0).toLocaleString();
                document.getElementById('statusText').textContent = '✅ Complete!';
                document.getElementById('statusDot').className = 'dot complete';
                window.onNinjaRunComplete(event.data.score, event.data.eventId, event.data.userId);
            }
        });

        window.onNinjaRunComplete = function(score, eventId, userId) {
            console.log('🎯 Game Complete! Score:', score);
            
            const toast = document.createElement('div');
            toast.className = 'toast-cyber';
            toast.textContent = `🏆 Score: ${score} points!`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 4000);

            setTimeout(() => {
                window.close();
            }, 3000);
        };

        // ========================================
        // PREVENT SCROLLING & ZOOM
        // ========================================

        document.addEventListener('touchmove', function(e) {
            if (e.target === document.body || e.target === document.getElementById('gameContainer')) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // ========================================
        // INIT
        // ========================================

        loadGame();

        console.log('🖥️ Desktop mode is FORCED');
        console.log('✅ Press "ESC" to close game');
        console.log('📄 Bridge is EMBEDDED - no external file needed');
    </script>

</body>
</html>
