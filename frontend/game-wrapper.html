<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ninja Run - Shora Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            background: #06111F;
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            position: fixed;
            width: 100%;
            height: 100%;
            /* FORCE DESKTOP MODE - prevents mobile zoom */
            min-width: 1024px;
            min-height: 768px;
        }

        /* Desktop mode forced for all devices */
        #gameContainer {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            max-width: 1280px;
            margin: 0 auto;
            background: #000;
            box-shadow: 0 0 60px rgba(0, 191, 255, 0.05);
        }

        /* ===== HEADER / NAVIGATION BAR ===== */
        .game-header {
            position: relative;
            z-index: 100;
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(16px);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 191, 255, 0.1);
            flex-shrink: 0;
            min-height: 56px;
            gap: 12px;
            flex-wrap: wrap;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            border-left: 1px solid rgba(0, 191, 255, 0.1);
            border-right: 1px solid rgba(0, 191, 255, 0.1);
        }

        .game-header .title {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: #00BFFF;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }
        .game-header .title i { 
            color: #FFD700; 
            font-size: 1rem;
        }
        .game-header .title .sub {
            font-size: 0.6rem;
            color: #A7B5C5;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }

        /* ===== SCORE DISPLAY ===== */
        .score-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 191, 255, 0.08);
            border: 1px solid rgba(0, 191, 255, 0.15);
            border-radius: 20px;
            padding: 4px 16px;
            font-family: 'Orbitron', monospace;
            font-size: 0.95rem;
            color: #FFD700;
            white-space: nowrap;
        }
        .score-display i {
            color: #FFD700;
            font-size: 0.8rem;
        }
        .score-display .score-value {
            font-weight: 700;
            min-width: 40px;
            text-align: center;
            color: #00E676;
            transition: all 0.3s ease;
        }
        .score-display .score-value.pulse {
            animation: scorePulse 0.3s ease;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); color: #FFD700; }
        }

        /* ===== STATUS ===== */
        .status-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: #A7B5C5;
            white-space: nowrap;
        }
        .status-display .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00E676;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        .status-display .dot.complete {
            background: #FFD700;
            animation: none;
        }
        .status-display .dot.error {
            background: #FF4D6D;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ===== GAME FRAME ===== */
        #gameFrame {
            flex: 1;
            width: 100%;
            border: none;
            background: #000;
            min-height: 0;
            max-width: 1280px;
            margin: 0 auto;
            height: calc(100vh - 56px);
        }

        /* ===== LOADING OVERLAY ===== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #06111F;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(20px);
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingOverlay .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 191, 255, 0.1);
            border-top-color: #00BFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loadingOverlay .text {
            margin-top: 20px;
            color: #A7B5C5;
            font-size: 0.9rem;
            font-family: 'Orbitron', monospace;
        }
        #loadingOverlay .error-text {
            color: #FF4D6D;
            margin-top: 10px;
            font-size: 0.8rem;
            display: none;
        }
        #loadingOverlay .progress-bar {
            margin-top: 16px;
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
        }
        #loadingOverlay .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #00BFFF, #6C63FF);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }
        #loadingOverlay .retry-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #00BFFF, #6C63FF);
            border: none;
            color: #000;
            padding: 10px 30px;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            display: none;
            transition: all 0.3s ease;
        }
        #loadingOverlay .retry-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 191, 255, 0.3);
        }

        /* ===== TOAST ===== */
        .toast-cyber {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 50px;
            padding: 12px 24px;
            color: #00E676;
            font-size: 0.9rem;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .toast-cyber.error {
            border-color: rgba(255, 77, 109, 0.3);
            color: #FF4D6D;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== DESKTOP MODE (FORCED) ===== */
        /* This ensures desktop mode is always applied */
        .desktop-forced {
            display: block !important;
        }

        /* ===== RESPONSIVE - Keep desktop feel on all devices ===== */
        @media (max-width: 1280px) {
            #gameContainer {
                max-width: 100%;
                margin: 0;
            }
            .game-header {
                max-width: 100%;
                border-left: none;
                border-right: none;
                border-radius: 0;
            }
            #gameFrame {
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .game-header {
                padding: 6px 12px;
                min-height: 48px;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .game-header .title {
                font-size: 0.8rem;
                gap: 6px;
            }
            .game-header .title .sub {
                font-size: 0.5rem;
            }
            .score-display {
                font-size: 0.8rem;
                padding: 3px 12px;
            }
            .score-display i {
                font-size: 0.7rem;
            }
            .status-display {
                font-size: 0.6rem;
            }
            #gameFrame {
                height: calc(100vh - 48px);
            }
            body {
                min-width: unset;
                min-height: unset;
            }
        }

        @media (max-width: 480px) {
            .game-header {
                padding: 4px 8px;
                min-height: 42px;
                gap: 4px;
            }
            .game-header .title {
                font-size: 0.7rem;
            }
            .game-header .title i {
                font-size: 0.7rem;
            }
            .game-header .title .sub {
                font-size: 0.45rem;
            }
            .score-display {
                font-size: 0.7rem;
                padding: 2px 10px;
            }
            .score-display i {
                font-size: 0.6rem;
            }
            .status-display {
                font-size: 0.5rem;
            }
            #gameFrame {
                height: calc(100vh - 42px);
            }
            #loadingOverlay .spinner {
                width: 35px;
                height: 35px;
            }
            #loadingOverlay .text {
                font-size: 0.75rem;
            }
            #loadingOverlay .progress-bar {
                width: 140px;
            }
        }

        @media (max-width: 360px) {
            .game-header {
                padding: 3px 6px;
                min-height: 38px;
                gap: 2px;
            }
            .game-header .title {
                font-size: 0.6rem;
            }
            .game-header .title i {
                font-size: 0.6rem;
            }
            .game-header .title .sub {
                font-size: 0.4rem;
            }
            .score-display {
                font-size: 0.6rem;
                padding: 1px 6px;
            }
            .status-display {
                font-size: 0.45rem;
            }
            #gameFrame {
                height: calc(100vh - 38px);
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }
    </style>
</head>
<body>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="text" id="loadingText">🏃 Loading Ninja Run...</div>
        <div class="error-text" id="errorText">⚠️ Error loading game. Please try again.</div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <button class="retry-btn" id="retryBtn" onclick="location.reload()">
            🔄 Retry
        </button>
    </div>

    <!-- ===== GAME CONTAINER ===== -->
    <div id="gameContainer">

        <!-- ===== NAVIGATION BAR ===== -->
        <div class="game-header" id="gameHeader">
            
            <!-- Left: Title -->
            <div class="title">
                <i class="fas fa-gamepad"></i>
                <span>Ninja Run</span>
                <span class="sub">| Tournament</span>
            </div>

            <!-- Score Display -->
            <div class="score-display">
                <i class="fas fa-star"></i>
                <span>Score:</span>
                <span class="score-value" id="scoreDisplay">0</span>
            </div>

            <!-- Status -->
            <div class="status-display">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Loading...</span>
            </div>

        </div>

        <!-- ===== GAME FRAME ===== -->
        <iframe id="gameFrame" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
    </div>

    <script>
        // ========================================
        // CONFIG
        // ========================================

        const params = new URLSearchParams(window.location.search);
        const EVENT_ID = params.get('event') || 'event_001';
        const USER_ID = params.get('user') || 'user_001';
        const GAME_URL = 'games/ninja run/index.html';

        console.log('🎮 Ninja Run Wrapper loaded (DESKTOP MODE FORCED)');
        console.log(`📋 Event: ${EVENT_ID}`);
        console.log(`👤 User: ${USER_ID}`);
        console.log('🖥️ Desktop mode: ALWAYS ON');

        // ========================================
        // TOAST
        // ========================================

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast-cyber');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-cyber';
            if (type === 'error') toast.classList.add('error');
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ========================================
        // LOAD GAME
        // ========================================

        function loadGame() {
            const frame = document.getElementById('gameFrame');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const progressFill = document.getElementById('progressFill');
            const loadingText = document.getElementById('loadingText');
            const errorText = document.getElementById('errorText');
            const retryBtn = document.getElementById('retryBtn');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            // Reset states
            errorText.style.display = 'none';
            retryBtn.style.display = 'none';
            loadingText.textContent = '🏃 Loading Ninja Run...';
            progressFill.style.width = '0%';
            statusText.textContent = 'Loading...';
            statusDot.className = 'dot';

            // Build game URL
            const timestamp = Date.now();
            const gameUrl = `${GAME_URL}?event=${EVENT_ID}&user=${USER_ID}&t=${timestamp}`;
            
            // Set iframe src
            frame.src = gameUrl;

            // Track loading progress
            let progress = 0;
            let loadAttempts = 0;
            const maxAttempts = 50;

            // Simulate progress
            const progressInterval = setInterval(() => {
                progress += Math.random() * 8 + 2;
                if (progress > 95) progress = 95;
                progressFill.style.width = progress + '%';
            }, 200);

            // Check if game loaded
            const loadCheck = setInterval(() => {
                loadAttempts++;
                
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                    
                    if (frameDoc) {
                        const canvas = frameDoc.getElementById('c2canvas');
                        const bodyContent = frameDoc.body?.innerHTML || '';
                        
                        if (canvas || bodyContent.includes('c2canvas') || bodyContent.includes('Construct 2')) {
                            // Game loaded!
                            clearInterval(progressInterval);
                            clearInterval(loadCheck);
                            
                            progressFill.style.width = '100%';
                            loadingText.textContent = '✅ Game Loaded!';
                            
                            setTimeout(() => {
                                loadingOverlay.classList.add('hidden');
                                statusText.textContent = 'Playing...';
                                statusDot.className = 'dot';
                            }, 400);
                            
                            // Inject bridge
                            injectBridge();
                            return;
                        }
                    }
                } catch (e) {
                    console.log('⏳ Waiting for game to load...', loadAttempts);
                }

                // Check for timeout
                if (loadAttempts >= maxAttempts) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                    
                    errorText.style.display = 'block';
                    retryBtn.style.display = 'block';
                    loadingText.textContent = '⚠️ Game taking too long to load';
                    statusText.textContent = '⚠️ Error';
                    statusDot.className = 'dot error';
                    
                    showToast('⚠️ Game failed to load. Please try again.', 'error');
                }
            }, 200);

            // Timeout fallback
            setTimeout(() => {
                if (!loadingOverlay.classList.contains('hidden')) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                }
            }, 10000);
        }

        // ========================================
        // INJECT BRIDGE
        // ========================================

        function injectBridge() {
            try {
                const frame = document.getElementById('gameFrame');
                const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                
                if (!frameDoc) {
                    startFallbackMonitor();
                    return;
                }
                
                if (frameDoc.getElementById('ninjaBridgeScript')) {
                    return;
                }
                
                const bridgeScript = document.createElement('script');
                bridgeScript.id = 'ninjaBridgeScript';
                bridgeScript.src = '../js/ninja-run-bridge.js';
                bridgeScript.onload = function() {
                    console.log('✅ Bridge script injected');
                };
                bridgeScript.onerror = function() {
                    startFallbackMonitor();
                };
                
                frameDoc.head.appendChild(bridgeScript);
                
            } catch (e) {
                startFallbackMonitor();
            }
        }

        // ========================================
        // FALLBACK MONITOR
        // ========================================

        function startFallbackMonitor() {
            console.log('📊 Starting fallback monitor');
            
            const checkInterval = setInterval(() => {
                try {
                    const played = sessionStorage.getItem('ninjaRunPlayed');
                    const score = sessionStorage.getItem('ninjaRunScore');
                    const liveScore = sessionStorage.getItem('ninjaRunLiveScore');
                    
                    if (liveScore !== null) {
                        document.getElementById('scoreDisplay').textContent = parseInt(liveScore).toLocaleString();
                    }
                    
                    if (played === 'true' && score !== null) {
                        clearInterval(checkInterval);
                        const scoreValue = parseInt(score);
                        document.getElementById('scoreDisplay').textContent = scoreValue.toLocaleString();
                        document.getElementById('statusText').textContent = '✅ Complete!';
                        document.getElementById('statusDot').className = 'dot complete';
                        window.onNinjaRunComplete(scoreValue, EVENT_ID, USER_ID);
                    }
                } catch (e) {}
            }, 500);

            setTimeout(() => {
                clearInterval(checkInterval);
            }, 180000);
        }

        // ========================================
        // SCORE UPDATES
        // ========================================

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NINJA_RUN_SCORE') {
                const display = document.getElementById('scoreDisplay');
                const score = event.data.score || 0;
                display.textContent = score.toLocaleString();
                display.className = 'score-value pulse';
                setTimeout(() => {
                    display.className = 'score-value';
                }, 300);
            }
            if (event.data && event.data.type === 'NINJA_RUN_COMPLETE') {
                const display = document.getElementById('scoreDisplay');
                display.textContent = (event.data.score || 0).toLocaleString();
                document.getElementById('statusText').textContent = '✅ Complete!';
                document.getElementById('statusDot').className = 'dot complete';
                window.onNinjaRunComplete(event.data.score, event.data.eventId, event.data.userId);
            }
        });

        // ========================================
        // GAME COMPLETION
        // ========================================

        window.onNinjaRunComplete = function(score, eventId, userId) {
            console.log('🎯 Game Complete! Score:', score);
            
            const toast = document.createElement('div');
            toast.className = 'toast-cyber';
            toast.textContent = `🏆 Score: ${score} points!`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 4000);

            setTimeout(() => {
                window.close();
            }, 3000);
        };

        // ========================================
        // PREVENT SCROLLING & ZOOM
        // ========================================

        document.addEventListener('touchmove', function(e) {
            if (e.target === document.body || e.target === document.getElementById('gameContainer')) {
                e.preventDefault();
            }
        }, { passive: false });

        // Prevent zoom with pinch
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // ========================================
        // INIT
        // ========================================

        // Start loading
        loadGame();

        console.log('🖥️ Desktop mode is FORCED - No mobile toggle available');
        console.log('✅ Press "ESC" to close game');
    </script>

</body>
</html>
