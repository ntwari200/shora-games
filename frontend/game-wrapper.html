<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- ============================================================
         VIEWPORT - Supports both mobile and desktop site modes
         When user ticks "Desktop Site" in Chrome, this adapts
         ============================================================ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    
    <!-- ============================================================
         FORCE DESKTOP SITE MODE - Chrome Desktop Site Toggle
         ============================================================ -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Ninja Run - Shora Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           RESPONSIVE DESIGN - Auto-detects Chrome Desktop Site mode
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --header-height: 56px;
            --header-padding: 8px 16px;
            --font-size-title: 0.9rem;
            --font-size-score: 0.85rem;
            --font-size-status: 0.65rem;
            --gap: 8px;
            --border-radius: 12px;
            --padding-score: 4px 12px;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06111F;
            color: #fff;
            font-family: 'Inter', 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* ============================================================
           CHROME DESKTOP SITE DETECTION
           When user ticks "Desktop Site" in Chrome, width is > 768px
           ============================================================ */
        
        /* Default: Mobile view */
        #gameWrapper {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
           DESKTOP SITE MODE - Activates when Chrome Desktop Site is ticked
           ============================================================ */
        @media (min-width: 768px) {
            /* When screen is 768px+, treat as desktop site */
            :root {
                --header-height: 60px;
                --header-padding: 10px 24px;
                --font-size-title: 1.1rem;
                --font-size-score: 0.95rem;
                --font-size-status: 0.75rem;
                --gap: 14px;
                --border-radius: 14px;
                --padding-score: 5px 16px;
            }
            
            #gameWrapper {
                max-width: 1280px;
                margin: 0 auto;
                box-shadow: 0 0 60px rgba(0, 191, 255, 0.05);
            }
            
            .game-header {
                border-left: 1px solid rgba(0, 191, 255, 0.08);
                border-right: 1px solid rgba(0, 191, 255, 0.08);
            }
            
            #gameFrame {
                max-width: 1280px;
                margin: 0 auto;
            }
            
            .game-header .title .sub {
                display: inline;
            }
            .score-display .label {
                display: inline;
            }
            .status-display .status-text {
                display: inline;
            }
            .desktop-toggle .toggle-label {
                display: inline;
            }
        }

        /* ============================================================
           DETECT IF USER MANUALLY SELECTED DESKTOP SITE
           Chrome sends width > 768px even on mobile when desktop mode is ON
           ============================================================ */
        
        /* When Chrome Desktop Site is active on mobile, width is 980px+ */
        @media (min-width: 768px) and (max-width: 1024px) {
            /* This is the sweet spot - Chrome desktop site on mobile */
            :root {
                --header-height: 56px;
                --header-padding: 8px 20px;
                --font-size-title: 1rem;
                --font-size-score: 0.9rem;
                --font-size-status: 0.7rem;
                --gap: 12px;
                --border-radius: 14px;
                --padding-score: 5px 16px;
            }
            
            #gameWrapper {
                max-width: 100%;
                margin: 0;
                box-shadow: none;
            }
            
            .game-header {
                border-left: none;
                border-right: none;
            }
            
            #gameFrame {
                max-width: 100%;
                margin: 0;
            }
            
            .game-header .title .sub {
                display: inline;
            }
            .score-display .label {
                display: inline;
            }
            .status-display .status-text {
                display: inline;
            }
        }

        /* ============================================================
           HEADER - Responsive
           ============================================================ */
        .game-header {
            position: relative;
            z-index: 100;
            background: rgba(6, 17, 31, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: var(--header-padding);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 191, 255, 0.08);
            flex-shrink: 0;
            min-height: var(--header-height);
            height: var(--header-height);
            gap: var(--gap);
            flex-wrap: nowrap;
            width: 100%;
        }

        .game-header .title {
            font-family: 'Orbitron', monospace;
            font-size: var(--font-size-title);
            color: #00BFFF;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
        }
        .game-header .title i {
            color: #FFD700;
            font-size: calc(var(--font-size-title) * 0.9);
        }
        .game-header .title .sub {
            font-size: calc(var(--font-size-title) * 0.5);
            color: #A7B5C5;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            display: none;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 191, 255, 0.06);
            border: 1px solid rgba(0, 191, 255, 0.1);
            border-radius: var(--border-radius);
            padding: var(--padding-score);
            font-family: 'Orbitron', monospace;
            font-size: var(--font-size-score);
            color: #FFD700;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
        }
        .score-display i {
            color: #FFD700;
            font-size: calc(var(--font-size-score) * 0.8);
        }
        .score-display .score-value {
            font-weight: 700;
            min-width: 30px;
            text-align: center;
            color: #00E676;
            transition: all 0.3s ease;
        }
        .score-display .score-value.pulse {
            animation: scorePulse 0.3s ease;
        }
        .score-display .label {
            display: none;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); color: #FFD700; }
        }

        .status-display {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: var(--font-size-status);
            color: #A7B5C5;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-display .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00E676;
            animation: pulse 1.5s infinite;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-display .dot.complete {
            background: #FFD700;
            animation: none;
        }
        .status-display .dot.error {
            background: #FF4D6D;
            animation: none;
        }
        .status-display .status-text {
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ============================================================
           GAME FRAME
           ============================================================ */
        #gameFrame {
            flex: 1;
            width: 100%;
            border: none;
            background: #000;
            min-height: 0;
            height: calc(100% - var(--header-height));
        }

        /* ============================================================
           LOADING OVERLAY
           ============================================================ */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #06111F;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingOverlay .spinner {
            width: clamp(40px, 8vw, 60px);
            height: clamp(40px, 8vw, 60px);
            border: 3px solid rgba(0, 191, 255, 0.1);
            border-top-color: #00BFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loadingOverlay .text {
            margin-top: 16px;
            color: #A7B5C5;
            font-size: clamp(0.7rem, 2vw, 1rem);
            font-family: 'Orbitron', monospace;
            text-align: center;
        }
        #loadingOverlay .error-text {
            color: #FF4D6D;
            margin-top: 8px;
            font-size: clamp(0.6rem, 1.5vw, 0.9rem);
            display: none;
            text-align: center;
        }
        #loadingOverlay .progress-bar {
            margin-top: 16px;
            width: clamp(150px, 40vw, 250px);
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
        }
        #loadingOverlay .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #00BFFF, #6C63FF);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }
        #loadingOverlay .retry-btn {
            margin-top: 16px;
            background: linear-gradient(135deg, #00BFFF, #6C63FF);
            border: none;
            color: #000;
            padding: clamp(8px, 1.5vh, 12px) clamp(20px, 4vw, 36px);
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            font-size: clamp(0.6rem, 1.5vw, 0.9rem);
            display: none;
            transition: all 0.3s ease;
        }
        #loadingOverlay .retry-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 191, 255, 0.3);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-cyber {
            position: fixed;
            bottom: clamp(16px, 3vh, 40px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 50px;
            padding: clamp(8px, 1.5vh, 14px) clamp(16px, 3vw, 28px);
            color: #00E676;
            font-size: clamp(0.65rem, 1.5vw, 1rem);
            z-index: 9999;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .toast-cyber.error {
            border-color: rgba(255, 77, 109, 0.3);
            color: #FF4D6D;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ============================================================
           DESKTOP MODE TOGGLE BUTTON
           ============================================================ */
        .desktop-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: calc(var(--font-size-status) * 0.85);
            color: #A7B5C5;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            transition: all 0.3s ease;
            user-select: none;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .desktop-toggle:hover {
            border-color: rgba(0, 191, 255, 0.3);
            background: rgba(0, 191, 255, 0.05);
        }
        .desktop-toggle .toggle-track {
            width: clamp(22px, 3vw, 32px);
            height: clamp(12px, 1.5vw, 16px);
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            position: relative;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .desktop-toggle .toggle-track .toggle-thumb {
            width: clamp(8px, 1vw, 12px);
            height: clamp(8px, 1vw, 12px);
            background: #A7B5C5;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }
        .desktop-toggle.active .toggle-track {
            background: rgba(0, 191, 255, 0.3);
        }
        .desktop-toggle.active .toggle-track .toggle-thumb {
            left: calc(100% - clamp(10px, 1.2vw, 14px));
            background: #00BFFF;
        }
        .desktop-toggle .toggle-label {
            font-weight: 500;
            font-size: calc(var(--font-size-status) * 0.85);
            display: none;
        }

        /* ============================================================
           RESPONSIVE BREAKPOINTS
           ============================================================ */

        /* ===== LARGE DESKTOP (1200px+) ===== */
        @media (min-width: 1200px) {
            :root {
                --header-height: 64px;
                --header-padding: 12px 28px;
                --font-size-title: 1.2rem;
                --font-size-score: 1rem;
                --font-size-status: 0.8rem;
                --gap: 16px;
                --border-radius: 16px;
                --padding-score: 6px 20px;
            }
            .game-header .title .sub { display: inline; }
            .score-display .label { display: inline; }
            .status-display .status-text { display: inline; }
            .desktop-toggle .toggle-label { display: inline; }
        }

        /* ===== DESKTOP / CHROME DESKTOP SITE (768px - 1199px) ===== */
        @media (min-width: 768px) and (max-width: 1199px) {
            :root {
                --header-height: 56px;
                --header-padding: 8px 20px;
                --font-size-title: 1rem;
                --font-size-score: 0.9rem;
                --font-size-status: 0.7rem;
                --gap: 12px;
                --border-radius: 14px;
                --padding-score: 5px 16px;
            }
            .game-header .title .sub { display: inline; }
            .score-display .label { display: inline; }
            .status-display .status-text { display: inline; }
            .desktop-toggle .toggle-label { display: inline; }
        }

        /* ===== TABLET (481px - 767px) ===== */
        @media (min-width: 481px) and (max-width: 767px) {
            :root {
                --header-height: 48px;
                --header-padding: 6px 14px;
                --font-size-title: 0.85rem;
                --font-size-score: 0.75rem;
                --font-size-status: 0.6rem;
                --gap: 8px;
                --border-radius: 10px;
                --padding-score: 3px 12px;
            }
            .game-header .title .sub { display: none; }
            .score-display .label { display: none; }
            .status-display .status-text { display: none; }
            .desktop-toggle .toggle-label { display: none; }
        }

        /* ===== LARGE PHONE (361px - 480px) ===== */
        @media (min-width: 361px) and (max-width: 480px) {
            :root {
                --header-height: 44px;
                --header-padding: 4px 10px;
                --font-size-title: 0.75rem;
                --font-size-score: 0.65rem;
                --font-size-status: 0.55rem;
                --gap: 6px;
                --border-radius: 8px;
                --padding-score: 2px 10px;
            }
            .game-header .title .sub { display: none; }
            .game-header .title i { display: none; }
            .score-display .label { display: none; }
            .score-display i { display: none; }
            .status-display .status-text { display: none; }
            .desktop-toggle .toggle-label { display: none; }
            .desktop-toggle { padding: 2px 6px; }
        }

        /* ===== SMALL PHONE (320px - 360px) ===== */
        @media (min-width: 320px) and (max-width: 360px) {
            :root {
                --header-height: 38px;
                --header-padding: 3px 8px;
                --font-size-title: 0.6rem;
                --font-size-score: 0.55rem;
                --font-size-status: 0.45rem;
                --gap: 4px;
                --border-radius: 6px;
                --padding-score: 2px 8px;
            }
            .game-header .title .sub { display: none; }
            .game-header .title i { display: none; }
            .score-display .label { display: none; }
            .score-display i { display: none; }
            .status-display .status-text { display: none; }
            .desktop-toggle .toggle-label { display: none; }
            .desktop-toggle { padding: 2px 4px; }
            .desktop-toggle .toggle-track {
                width: 18px;
                height: 10px;
            }
            .desktop-toggle .toggle-track .toggle-thumb {
                width: 6px;
                height: 6px;
                top: 2px;
                left: 2px;
            }
            .desktop-toggle.active .toggle-track .toggle-thumb {
                left: calc(100% - 8px);
            }
            .score-display .score-value { min-width: 20px; }
            .status-display .dot { width: 5px; height: 5px; }
        }

        /* ===== EXTRA SMALL PHONE (< 320px) ===== */
        @media (max-width: 319px) {
            :root {
                --header-height: 34px;
                --header-padding: 2px 6px;
                --font-size-title: 0.5rem;
                --font-size-score: 0.45rem;
                --font-size-status: 0.4rem;
                --gap: 3px;
                --border-radius: 4px;
                --padding-score: 1px 6px;
            }
            .game-header .title .sub { display: none; }
            .game-header .title i { display: none; }
            .score-display .label { display: none; }
            .score-display i { display: none; }
            .status-display .status-text { display: none; }
            .desktop-toggle .toggle-label { display: none; }
            .desktop-toggle { padding: 1px 4px; }
            .desktop-toggle .toggle-track {
                width: 14px;
                height: 8px;
            }
            .desktop-toggle .toggle-track .toggle-thumb {
                width: 4px;
                height: 4px;
                top: 2px;
                left: 2px;
            }
            .desktop-toggle.active .toggle-track .toggle-thumb {
                left: calc(100% - 6px);
            }
            .score-display .score-value { min-width: 14px; }
            .status-display .dot { width: 4px; height: 4px; }
        }

        /* ===== LANDSCAPE PHONES ===== */
        @media (max-height: 500px) and (orientation: landscape) {
            :root {
                --header-height: 36px;
                --header-padding: 4px 12px;
                --font-size-title: 0.65rem;
                --font-size-score: 0.55rem;
                --font-size-status: 0.5rem;
                --gap: 6px;
                --border-radius: 8px;
                --padding-score: 2px 10px;
            }
            .game-header .title .sub { display: none; }
            .game-header .title i { display: none; }
            .score-display .label { display: none; }
            .score-display i { display: none; }
            .status-display .status-text { display: none; }
            .desktop-toggle .toggle-label { display: none; }
            .desktop-toggle { padding: 2px 6px; }
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="text" id="loadingText">🏃 Loading Ninja Run...</div>
        <div class="error-text" id="errorText">⚠️ Error loading game. Please try again.</div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <button class="retry-btn" id="retryBtn" onclick="location.reload()">
            🔄 Retry
        </button>
    </div>

    <div id="gameWrapper">
        <div class="game-header" id="gameHeader">
            <div class="title">
                <i class="fas fa-gamepad"></i>
                <span>Ninja Run</span>
                <span class="sub">| Tournament</span>
            </div>
            <div class="score-display">
                <i class="fas fa-star"></i>
                <span class="label">Score:</span>
                <span class="score-value" id="scoreDisplay">0</span>
            </div>
            <div class="status-display">
                <span class="dot" id="statusDot"></span>
                <span class="status-text" id="statusText">Loading...</span>
            </div>
            <div class="desktop-toggle active" id="desktopToggle" onclick="toggleDesktopMode()">
                <span class="toggle-label">🖥️</span>
                <span class="toggle-track">
                    <span class="toggle-thumb"></span>
                </span>
            </div>
        </div>
        <iframe id="gameFrame" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
    </div>

    <script>
        // ============================================================
        // DETECT CHROME DESKTOP SITE MODE
        // ============================================================
        function detectDesktopMode() {
            // Check if screen width indicates desktop site mode
            // Chrome's "Desktop Site" mode typically uses 980px+ width
            const isDesktopMode = window.innerWidth >= 768;
            
            // Check if user agent indicates mobile but width is desktop
            const isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent);
            
            // If mobile user agent but desktop width, Chrome Desktop Site is enabled
            if (isMobileUA && isDesktopMode) {
                console.log('📱 Chrome Desktop Site mode detected!');
                document.body.classList.add('chrome-desktop-mode');
                return true;
            }
            
            return false;
        }

        // ============================================================
        // DESKTOP MODE TOGGLE
        // ============================================================
        let desktopMode = true;
        const STORAGE_KEY = 'shora_desktop_mode';

        function loadDesktopMode() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null) {
                desktopMode = saved === 'true';
            } else {
                // Default: ON - but check if Chrome Desktop Site is active
                const chromeDesktop = detectDesktopMode();
                desktopMode = chromeDesktop || true;
                localStorage.setItem(STORAGE_KEY, String(desktopMode));
            }
            applyDesktopMode();
        }

        function applyDesktopMode() {
            const toggle = document.getElementById('desktopToggle');
            const body = document.body;
            const wrapper = document.getElementById('gameWrapper');
            
            if (desktopMode) {
                body.classList.add('desktop-mode');
                toggle.classList.add('active');
                // Remove max-width for Chrome Desktop Site mode
                if (body.classList.contains('chrome-desktop-mode')) {
                    wrapper.style.maxWidth = '100%';
                    wrapper.style.boxShadow = 'none';
                } else {
                    wrapper.style.maxWidth = '1280px';
                    wrapper.style.boxShadow = '0 0 60px rgba(0, 191, 255, 0.05)';
                }
            } else {
                body.classList.remove('desktop-mode');
                toggle.classList.remove('active');
                wrapper.style.maxWidth = '100%';
                wrapper.style.boxShadow = 'none';
            }
            
            localStorage.setItem(STORAGE_KEY, String(desktopMode));
        }

        function toggleDesktopMode() {
            desktopMode = !desktopMode;
            applyDesktopMode();
            showToast(desktopMode ? '🖥️ Desktop mode ON' : '📱 Mobile mode ON', 'info');
        }

        // ============================================================
        // CONFIG
        // ============================================================
        const params = new URLSearchParams(window.location.search);
        const EVENT_ID = params.get('event') || 'event_001';
        const USER_ID = params.get('user') || 'user_001';
        const GAME_URL = 'games/ninja run/index.html';

        console.log('🎮 Ninja Run Wrapper loaded');
        console.log(`📋 Event: ${EVENT_ID}`);
        console.log(`👤 User: ${USER_ID}`);
        console.log(`🖥️ Desktop mode: ${desktopMode ? 'ON' : 'OFF'}`);

        // Detect Chrome Desktop Site on load
        setTimeout(() => {
            detectDesktopMode();
            loadDesktopMode();
        }, 100);

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast-cyber');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-cyber';
            if (type === 'error') toast.classList.add('error');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ============================================================
        // SCORE TRACKING
        // ============================================================
        let gameScore = 0;
        let scoreSubmitted = false;
        let scoreInterval = null;

        function startScoreTracking() {
            if (scoreInterval) clearInterval(scoreInterval);
            console.log('📊 Starting score tracking...');

            scoreInterval = setInterval(() => {
                if (!window.gameRuntime) return;
                try {
                    const rt = window.gameRuntime;
                    let score = 0;

                    const vars = rt.all_global_vars || [];
                    for (let v of vars) {
                        if (v && v.name) {
                            if (v.name === 'Score' || v.name === 'score') {
                                score = v.data || 0;
                            }
                            if (v.name === 'GameOver' || v.name === 'gameOver') {
                                if (v.data === true && score > 0 && !scoreSubmitted) {
                                    console.log('🎯 Game Over detected');
                                    submitScore(score);
                                }
                            }
                        }
                    }

                    if (rt.globalVars) {
                        for (const key in rt.globalVars) {
                            const lowerKey = key.toLowerCase();
                            if ((lowerKey.includes('score') || lowerKey.includes('distance')) && !lowerKey.includes(
                                'coins')) {
                                const val = rt.globalVars[key];
                                if (typeof val === 'number' && val > score) score = val;
                            }
                            if (lowerKey === 'gameover' && rt.globalVars[key] === true) {
                                if (score > 0 && !scoreSubmitted) {
                                    console.log('🎯 Game Over detected from globalVars');
                                    submitScore(score);
                                }
                            }
                        }
                    }

                    if (score > gameScore) {
                        gameScore = score;
                        console.log('📊 Score updated:', gameScore);
                        document.getElementById('scoreDisplay').textContent = gameScore.toLocaleString();
                        sessionStorage.setItem('ninjaRunLiveScore', gameScore.toString());
                    }

                } catch (e) { /* Silent */ }
            }, 300);
        }

        // ============================================================
        // SUBMIT SCORE
        // ============================================================
        function submitScore(score) {
            if (scoreSubmitted) return;
            const finalScore = parseInt(score) || gameScore || 0;
            if (finalScore === 0) return;

            console.log('🏆 Submitting score:', finalScore);
            scoreSubmitted = true;

            sessionStorage.setItem('ninjaRunScore', finalScore.toString());
            sessionStorage.setItem('ninjaRunPlayed', 'true');
            sessionStorage.setItem('ninjaRunFinalScore', finalScore.toString());
            sessionStorage.setItem('ninjaRunComplete', 'true');

            if (window.parent && window.parent !== window) {
                try {
                    window.parent.postMessage({
                        type: 'NINJA_RUN_COMPLETE',
                        score: finalScore,
                        eventId: EVENT_ID,
                        userId: USER_ID,
                        timestamp: Date.now()
                    }, '*');
                    console.log('✅ Score sent to parent');
                } catch (e) {}
            }

            document.getElementById('scoreDisplay').textContent = finalScore.toLocaleString();
            document.getElementById('statusText').textContent = '✅ Complete!';
            document.getElementById('statusDot').className = 'dot complete';

            showToast(`🏆 Score: ${finalScore} points!`, 'success');
            setTimeout(() => window.close(), 3000);
        }

        // ============================================================
        // INJECT BRIDGE
        // ============================================================
        function injectBridge() {
            try {
                const frame = document.getElementById('gameFrame');
                const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                if (!frameDoc) return;

                if (frameDoc.getElementById('ninjaBridgeScript')) return;

                const script = frameDoc.createElement('script');
                script.id = 'ninjaBridgeScript';
                script.type = 'text/javascript';
                script.textContent = `
                    (function() {
                        console.log('🏃 Ninja Run Bridge loaded');
                        let gameScore = 0, scoreSubmitted = false, runtime = null, scoreInterval = null;

                        function startScoreTracking() {
                            if (scoreInterval) clearInterval(scoreInterval);
                            scoreInterval = setInterval(() => {
                                if (!window.gameRuntime) return;
                                try {
                                    const rt = window.gameRuntime;
                                    let score = 0;
                                    const vars = rt.all_global_vars || [];
                                    for (let v of vars) {
                                        if (v && v.name) {
                                            if (v.name === 'Score' || v.name === 'score') score = v.data || 0;
                                            if ((v.name === 'GameOver' || v.name === 'gameOver') && v.data === true && score > 0 && !scoreSubmitted) {
                                                submitScore(score);
                                            }
                                        }
                                    }
                                    if (rt.globalVars) {
                                        for (const key in rt.globalVars) {
                                            const lowerKey = key.toLowerCase();
                                            if ((lowerKey.includes('score') || lowerKey.includes('distance')) && !lowerKey.includes('coins')) {
                                                const val = rt.globalVars[key];
                                                if (typeof val === 'number' && val > score) score = val;
                                            }
                                            if (lowerKey === 'gameover' && rt.globalVars[key] === true) {
                                                if (score > 0 && !scoreSubmitted) submitScore(score);
                                            }
                                        }
                                    }
                                    if (score > gameScore) {
                                        gameScore = score;
                                        sessionStorage.setItem('ninjaRunLiveScore', gameScore.toString());
                                        if (window.parent && window.parent !== window) {
                                            try {
                                                window.parent.postMessage({ type: 'NINJA_RUN_SCORE', score: gameScore }, '*');
                                            } catch(e) {}
                                        }
                                    }
                                } catch(e) {}
                            }, 300);
                        }

                        function submitScore(score) {
                            if (scoreSubmitted) return;
                            const finalScore = parseInt(score) || gameScore || 0;
                            if (finalScore === 0) return;
                            scoreSubmitted = true;
                            sessionStorage.setItem('ninjaRunScore', finalScore.toString());
                            sessionStorage.setItem('ninjaRunPlayed', 'true');
                            sessionStorage.setItem('ninjaRunFinalScore', finalScore.toString());
                            sessionStorage.setItem('ninjaRunComplete', 'true');
                            if (window.parent && window.parent !== window) {
                                try {
                                    window.parent.postMessage({
                                        type: 'NINJA_RUN_COMPLETE',
                                        score: finalScore,
                                        eventId: '${EVENT_ID}',
                                        userId: '${USER_ID}',
                                        timestamp: Date.now()
                                    }, '*');
                                } catch(e) {}
                            }
                            const overlay = document.createElement('div');
                            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:Orbitron,monospace;color:#fff;';
                            overlay.innerHTML = '<div style="background:linear-gradient(135deg,#06111F,#0B1F36);border:2px solid #00BFFF;border-radius:20px;padding:30px 40px;text-align:center;max-width:400px;"><div style="font-size:3.5rem;">🏆</div><h2 style="color:#FFD700;font-size:1.3rem;">Game Complete!</h2><div style="font-size:2.5rem;color:#00E676;font-weight:700;margin:8px 0;">' + finalScore + '</div><div style="color:#A7B5C5;">points</div><button onclick="window.close()" style="margin-top:20px;background:linear-gradient(135deg,#00BFFF,#6C63FF);border:none;color:#000;padding:10px 25px;border-radius:10px;font-family:Orbitron,monospace;font-weight:700;cursor:pointer;">Close</button></div>';
                            document.body.appendChild(overlay);
                            setTimeout(() => window.close(), 4000);
                        }

                        function waitForRuntime() {
                            let attempts = 0;
                            const checkRuntime = setInterval(() => {
                                attempts++;
                                try {
                                    const canvas = document.getElementById('c2canvas');
                                    if (canvas && canvas.c2runtime) {
                                        clearInterval(checkRuntime);
                                        runtime = canvas.c2runtime;
                                        window.gameRuntime = runtime;
                                        startScoreTracking();
                                        return;
                                    }
                                    if (window.c2runtime) {
                                        clearInterval(checkRuntime);
                                        runtime = window.c2runtime;
                                        window.gameRuntime = runtime;
                                        startScoreTracking();
                                        return;
                                    }
                                } catch(e) {}
                                if (attempts > 50) {
                                    clearInterval(checkRuntime);
                                }
                            }, 500);
                        }

                        window.__ninjaDebug = {
                            score: () => gameScore,
                            status: () => ({ score: gameScore, submitted: scoreSubmitted, runtime: !!runtime }),
                            submit: (s) => submitScore(s)
                        };

                        waitForRuntime();
                        console.log('✅ Bridge ready');
                    })();
                `;

                frameDoc.head.appendChild(script);
                console.log('✅ Bridge injected');

            } catch (e) {
                console.log('⚠️ Error injecting bridge:', e);
            }
        }

        // ============================================================
        // LOAD GAME
        // ============================================================
        function loadGame() {
            const frame = document.getElementById('gameFrame');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const progressFill = document.getElementById('progressFill');
            const loadingText = document.getElementById('loadingText');
            const errorText = document.getElementById('errorText');
            const retryBtn = document.getElementById('retryBtn');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            errorText.style.display = 'none';
            retryBtn.style.display = 'none';
            loadingText.textContent = '🏃 Loading Ninja Run...';
            progressFill.style.width = '0%';
            statusText.textContent = 'Loading...';
            statusDot.className = 'dot';

            const timestamp = Date.now();
            const gameUrl = `${GAME_URL}?event=${EVENT_ID}&user=${USER_ID}&t=${timestamp}`;
            frame.src = gameUrl;

            let progress = 0;
            let loadAttempts = 0;
            const maxAttempts = 50;

            const progressInterval = setInterval(() => {
                progress += Math.random() * 8 + 2;
                if (progress > 95) progress = 95;
                progressFill.style.width = progress + '%';
            }, 200);

            const loadCheck = setInterval(() => {
                loadAttempts++;
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                    if (frameDoc) {
                        const canvas = frameDoc.getElementById('c2canvas');
                        const bodyContent = frameDoc.body?.innerHTML || '';
                        if (canvas || bodyContent.includes('c2canvas') || bodyContent.includes('Construct 2')) {
                            clearInterval(progressInterval);
                            clearInterval(loadCheck);
                            progressFill.style.width = '100%';
                            loadingText.textContent = '✅ Game Loaded!';
                            setTimeout(() => {
                                loadingOverlay.classList.add('hidden');
                                statusText.textContent = 'Playing...';
                                statusDot.className = 'dot';
                            }, 400);
                            setTimeout(() => injectBridge(), 1500);
                            // Re-detect desktop mode after game loads
                            setTimeout(() => {
                                detectDesktopMode();
                                loadDesktopMode();
                            }, 500);
                            return;
                        }
                    }
                } catch (e) {
                    console.log('⏳ Waiting for game to load...', loadAttempts);
                }
                if (loadAttempts >= maxAttempts) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                    errorText.style.display = 'block';
                    retryBtn.style.display = 'block';
                    loadingText.textContent = '⚠️ Game taking too long to load';
                    statusText.textContent = '⚠️ Error';
                    statusDot.className = 'dot error';
                    showToast('⚠️ Game failed to load. Please try again.', 'error');
                }
            }, 200);

            setTimeout(() => {
                if (!loadingOverlay.classList.contains('hidden')) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                }
            }, 10000);
        }

        // ============================================================
        // MESSAGE LISTENER
        // ============================================================
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NINJA_RUN_SCORE') {
                const display = document.getElementById('scoreDisplay');
                const score = event.data.score || 0;
                display.textContent = score.toLocaleString();
                display.className = 'score-value pulse';
                setTimeout(() => { display.className = 'score-value'; }, 300);
                gameScore = score;
            }
            if (event.data && event.data.type === 'NINJA_RUN_COMPLETE') {
                const display = document.getElementById('scoreDisplay');
                display.textContent = (event.data.score || 0).toLocaleString();
                document.getElementById('statusText').textContent = '✅ Complete!';
                document.getElementById('statusDot').className = 'dot complete';
                submitScore(event.data.score);
            }
        });

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'd' || e.key === 'D') {
                toggleDesktopMode();
            }
            if (e.key === 'Escape') {
                if (confirm('Close game and return to tournaments?')) {
                    window.close();
                }
            }
        });

        // ============================================================
        // PREVENT SCROLLING & ZOOM
        // ============================================================
        document.addEventListener('touchmove', function(e) {
            if (e.target === document.body || e.target === document.getElementById('gameWrapper')) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });

        // ============================================================
        // WINDOW RESIZE - Detect Chrome Desktop Site changes
        // ============================================================
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const wasDesktop = document.body.classList.contains('chrome-desktop-mode');
                const isDesktop = detectDesktopMode();
                if (wasDesktop !== isDesktop) {
                    console.log('🔄 Chrome Desktop Site mode changed:', isDesktop ? 'ON' : 'OFF');
                    loadDesktopMode();
                }
            }, 300);
        });

        // ============================================================
        // DEBUG (Parent)
        // ============================================================
        window.__ninjaParentDebug = {
            getStatus: function() {
                return {
                    score: gameScore,
                    submitted: scoreSubmitted,
                    sessionScore: sessionStorage.getItem('ninjaRunScore'),
                    liveScore: sessionStorage.getItem('ninjaRunLiveScore'),
                    desktopMode: desktopMode,
                    chromeDesktopMode: document.body.classList.contains('chrome-desktop-mode'),
                    windowWidth: window.innerWidth,
                    windowHeight: window.innerHeight,
                    isMobileUA: /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent)
                };
            },
            submitScore: function(score) {
                window.submitScore(score);
            },
            toggleDesktop: function() {
                toggleDesktopMode();
            }
        };

        // ============================================================
        // INIT
        // ============================================================
        loadGame();

        console.log('');
        console.log('🖥️ ===========================================');
        console.log('🖥️ NINJA RUN - CHROME DESKTOP SITE READY');
        console.log('🖥️ ===========================================');
        console.log('📱 When you tick "Desktop Site" in Chrome:');
        console.log('   ✅ Game auto-adjusts to desktop view');
        console.log('   ✅ UI scales for desktop experience');
        console.log('   ✅ Clear, visible interface');
        console.log('');
        console.log('🔘 Desktop toggle button available');
        console.log('⌨️  Press "D" to toggle desktop mode');
        console.log('⌨️  Press "ESC" to close game');
        console.log('');
        console.log('🔍 DEBUG COMMANDS:');
        console.log('  __ninjaParentDebug.getStatus()  - Check status');
        console.log('  __ninjaParentDebug.submitScore(1000)  - Submit score');
        console.log('  __ninjaParentDebug.toggleDesktop()  - Toggle desktop mode');
    </script>

</body>
