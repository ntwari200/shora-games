<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Run - Shora Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #06111F;
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        #gameContainer {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        #gameFrame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(6, 17, 31, 0.85);
            backdrop-filter: blur(16px);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 191, 255, 0.1);
        }
        .game-header .title {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: #00BFFF;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .game-header .title i { color: #FFD700; }
        .game-header .status {
            font-size: 0.75rem;
            color: #A7B5C5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00E676;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #06111F;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingOverlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 191, 255, 0.1);
            border-top-color: #00BFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loadingOverlay .text {
            margin-top: 20px;
            color: #A7B5C5;
            font-size: 0.9rem;
            font-family: 'Orbitron', monospace;
        }
        #loadingOverlay .progress-bar {
            margin-top: 15px;
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
        }
        #loadingOverlay .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #00BFFF, #6C63FF);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .toast-cyber {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 50px;
            padding: 12px 24px;
            color: #00E676;
            font-size: 0.9rem;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="text">🏃 Loading Ninja Run...</div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
    </div>

    <div id="gameContainer">
        <div class="game-header">
            <div class="title">
                <i class="fas fa-gamepad"></i>
                <span>Ninja Run</span>
            </div>
            <div class="status">
                <span class="dot"></span>
                <span id="statusText">Playing...</span>
            </div>
        </div>
        <iframe id="gameFrame" src="games/ninja run/index.html?event=%%EVENT_ID%%&user=%%USER_ID%%&t=%%TIMESTAMP%%"></iframe>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const EVENT_ID = params.get('event') || 'event_001';
        const USER_ID = params.get('user') || 'user_001';

        let progress = 0;
        const progressFill = document.getElementById('progressFill');
        const loadingOverlay = document.getElementById('loadingOverlay');

        const loadingInterval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress > 100) progress = 100;
            progressFill.style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                }, 500);
            }
        }, 200);

        window.onNinjaRunComplete = function(score, eventId, userId) {
            console.log('🎯 Game Complete! Score:', score);
            document.getElementById('statusText').textContent = '✅ Complete!';
            
            const toast = document.createElement('div');
            toast.className = 'toast-cyber';
            toast.textContent = `🏆 Score: ${score} points!`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 4000);

            setTimeout(() => {
                window.close();
            }, 3000);
        };

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NINJA_RUN_COMPLETE') {
                window.onNinjaRunComplete(event.data.score, event.data.eventId, event.data.userId);
            }
        });

        const frame = document.getElementById('gameFrame');
        const timestamp = Date.now();
        frame.src = frame.src
            .replace('%%EVENT_ID%%', EVENT_ID)
            .replace('%%USER_ID%%', USER_ID)
            .replace('%%TIMESTAMP%%', timestamp);

        // Inject bridge into iframe
        frame.addEventListener('load', function() {
            console.log('📄 Game iframe loaded');
            
            try {
                const frameDoc = document.getElementById('gameFrame').contentDocument;
                if (frameDoc) {
                    const bridgeScript = document.createElement('script');
                    bridgeScript.src = '../js/ninja-run-bridge.js';
                    bridgeScript.onerror = function() {
                        console.log('⚠️ Bridge script failed, using fallback');
                        startFallbackMonitor();
                    };
                    frameDoc.head.appendChild(bridgeScript);
                    console.log('✅ Bridge script injected');
                } else {
                    console.log('⚠️ Cannot access iframe, using fallback');
                    startFallbackMonitor();
                }
            } catch (e) {
                console.log('⚠️ Error injecting bridge:', e);
                startFallbackMonitor();
            }
        });

        function startFallbackMonitor() {
            console.log('📊 Starting fallback monitor');
            const checkInterval = setInterval(() => {
                const played = sessionStorage.getItem('ninjaRunPlayed');
                const score = sessionStorage.getItem('ninjaRunScore');
                if (played === 'true' && score !== null) {
                    clearInterval(checkInterval);
                    console.log('🎯 Game completion detected via session storage');
                    window.onNinjaRunComplete(parseInt(score), EVENT_ID, USER_ID);
                }
            }, 1000);

            setTimeout(() => {
                clearInterval(checkInterval);
            }, 300000);
        }

        console.log('🎮 Ninja Run Wrapper loaded');
        console.log(`📋 Event: ${EVENT_ID}`);
        console.log(`👤 User: ${USER_ID}`);
    </script>
</body>
</html>
