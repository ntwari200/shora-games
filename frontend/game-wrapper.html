<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe 
        id="gameFrame"
        src="https://html5.gamedistribution.com/908ed6a402314c1e8dc62b8103dd4adf/"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-popups-to-escape-sandbox"
        allow="fullscreen">
    </iframe>
    
    <script>
        // Prevent the iframe from redirecting the parent window
        window.addEventListener('message', function(event) {
            // Forward score messages to parent
            if (event.data && (event.data.type === 'SCORE' || event.data.score)) {
                window.parent.postMessage(event.data, '*');
            }
        });
        
        // Block any attempt to navigate away
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        });
    </script>
</body>
</html>
