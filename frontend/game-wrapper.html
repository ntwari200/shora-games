<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ninja Run - Shora Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           FORCE DESKTOP MODE - OVERRIDE ALL MOBILE SETTINGS
           ============================================================ */
        
        /* Reset everything to desktop */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Force desktop viewport - prevents mobile zoom/resize */
        html {
            min-width: 1024px;
            min-height: 768px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            background: #06111F;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-width: 1024px;
            min-height: 768px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            /* Prevent any mobile scaling */
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            transform: none !important;
            -webkit-transform: none !important;
        }

        /* Block any mobile zoom/scale */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        /* ============================================================
           DESKTOP CONTAINER - Fixed size
           ============================================================ */
        #gameContainer {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            max-width: 1280px;
            margin: 0 auto;
            background: #000;
            box-shadow: 0 0 60px rgba(0, 191, 255, 0.05);
            min-height: 768px;
            min-width: 1024px;
        }

        /* ============================================================
           HEADER - Desktop style
           ============================================================ */
        .game-header {
            position: relative;
            z-index: 100;
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(16px);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 191, 255, 0.1);
            flex-shrink: 0;
            min-height: 60px;
            gap: 16px;
            flex-wrap: nowrap;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            border-left: 1px solid rgba(0, 191, 255, 0.1);
            border-right: 1px solid rgba(0, 191, 255, 0.1);
        }

        .game-header .title {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: #00BFFF;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .game-header .title i {
            color: #FFD700;
            font-size: 1.1rem;
        }
        .game-header .title .sub {
            font-size: 0.65rem;
            color: #A7B5C5;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 191, 255, 0.08);
            border: 1px solid rgba(0, 191, 255, 0.15);
            border-radius: 20px;
            padding: 6px 20px;
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: #FFD700;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .score-display i {
            color: #FFD700;
            font-size: 0.9rem;
        }
        .score-display .score-value {
            font-weight: 700;
            min-width: 50px;
            text-align: center;
            color: #00E676;
            transition: all 0.3s ease;
        }
        .score-display .score-value.pulse {
            animation: scorePulse 0.3s ease;
        }

        @keyframes scorePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
                color: #FFD700;
            }
        }

        .status-display {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: #A7B5C5;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-display .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00E676;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        .status-display .dot.complete {
            background: #FFD700;
            animation: none;
        }
        .status-display .dot.error {
            background: #FF4D6D;
            animation: none;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        /* ============================================================
           GAME FRAME - Desktop size
           ============================================================ */
        #gameFrame {
            flex: 1;
            width: 100%;
            border: none;
            background: #000;
            min-height: 0;
            max-width: 1280px;
            margin: 0 auto;
            height: calc(100vh - 60px);
            min-height: 708px;
        }

        /* ============================================================
           LOADING OVERLAY - Desktop style
           ============================================================ */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #06111F;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(20px);
            min-width: 1024px;
            min-height: 768px;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingOverlay .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 191, 255, 0.1);
            border-top-color: #00BFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loadingOverlay .text {
            margin-top: 24px;
            color: #A7B5C5;
            font-size: 1rem;
            font-family: 'Orbitron', monospace;
        }
        #loadingOverlay .error-text {
            color: #FF4D6D;
            margin-top: 12px;
            font-size: 0.9rem;
            display: none;
        }
        #loadingOverlay .progress-bar {
            margin-top: 20px;
            width: 250px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
        }
        #loadingOverlay .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #00BFFF, #6C63FF);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }
        #loadingOverlay .retry-btn {
            margin-top: 24px;
            background: linear-gradient(135deg, #00BFFF, #6C63FF);
            border: none;
            color: #000;
            padding: 12px 36px;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
            transition: all 0.3s ease;
        }
        #loadingOverlay .retry-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 191, 255, 0.3);
        }

        /* ============================================================
           TOAST - Desktop style
           ============================================================ */
        .toast-cyber {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 50px;
            padding: 14px 28px;
            color: #00E676;
            font-size: 1rem;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            white-space: nowrap;
        }
        .toast-cyber.error {
            border-color: rgba(255, 77, 109, 0.3);
            color: #FF4D6D;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ============================================================
           DESKTOP ONLY - No responsive breakpoints allowed
           ============================================================ */
        /* ALL breakpoints are removed - Desktop ONLY */

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        /* ============================================================
           FORCE DESKTOP MODE OVERRIDES - Prevent any mobile scaling
           ============================================================ */
        
        /* Block any viewport changes on mobile */
        @media (max-width: 1023px) {
            html, body {
                min-width: 1024px !important;
                min-height: 768px !important;
                width: 1024px !important;
                height: 768px !important;
                overflow: hidden !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                transform: none !important;
                -webkit-transform: none !important;
                zoom: 1 !important;
                -webkit-zoom: 1 !important;
                -moz-transform: none !important;
                -o-transform: none !important;
            }
            
            #gameContainer {
                min-width: 1024px !important;
                min-height: 768px !important;
                width: 1024px !important;
                height: 768px !important;
                transform: none !important;
                -webkit-transform: none !important;
                margin: 0 auto !important;
            }
            
            #gameFrame {
                min-height: 708px !important;
                height: 708px !important;
            }
            
            .game-header {
                min-height: 60px !important;
                height: 60px !important;
            }
            
            #loadingOverlay {
                min-width: 1024px !important;
                min-height: 768px !important;
                width: 1024px !important;
                height: 768px !important;
            }
        }

        /* Block any zoom gestures */
        body {
            touch-action: none !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
        }

        /* Prevent double-tap zoom */
        * {
            touch-action: manipulation !important;
        }

        /* Force hardware acceleration */
        #gameContainer,
        #gameFrame,
        .game-header {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-perspective: 1000;
            perspective: 1000;
        }

        /* Desktop only - no mobile styles */
        .desktop-only {
            display: block !important;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="text" id="loadingText">🏃 Loading Ninja Run...</div>
        <div class="error-text" id="errorText">⚠️ Error loading game. Please try again.</div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <button class="retry-btn" id="retryBtn" onclick="location.reload()">
            🔄 Retry
        </button>
    </div>

    <div id="gameContainer">
        <div class="game-header" id="gameHeader">
            <div class="title">
                <i class="fas fa-gamepad"></i>
                <span>Ninja Run</span>
                <span class="sub">| Tournament</span>
            </div>
            <div class="score-display">
                <i class="fas fa-star"></i>
                <span>Score:</span>
                <span class="score-value" id="scoreDisplay">0</span>
            </div>
            <div class="status-display">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Loading...</span>
            </div>
        </div>
        <iframe id="gameFrame" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
    </div>

    <script>
        // ============================================================
        // DESKTOP FORCE - BLOCK ANY MOBILE CHANGES
        // ============================================================
        
        // Force desktop viewport
        (function forceDesktop() {
            // Block viewport changes
            const metaViewport = document.querySelector('meta[name=viewport]');
            if (metaViewport) {
                metaViewport.content = 'width=1280, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
            }
            
            // Block device orientation changes
            window.addEventListener('orientationchange', function(e) {
                e.preventDefault();
                // Force back to desktop
                document.documentElement.style.transform = 'none';
                document.body.style.transform = 'none';
                document.documentElement.style.zoom = '1';
                document.body.style.zoom = '1';
                return false;
            }, true);
            
            // Block resize events from changing layout
            let lastWidth = window.innerWidth;
            window.addEventListener('resize', function(e) {
                if (window.innerWidth < 1024 || window.innerHeight < 768) {
                    // Force back to desktop size
                    document.documentElement.style.minWidth = '1024px';
                    document.documentElement.style.minHeight = '768px';
                    document.body.style.minWidth = '1024px';
                    document.body.style.minHeight = '768px';
                }
            }, true);
            
            // Block touch events from zooming
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            console.log('🖥️ Desktop mode FORCED - All mobile features blocked');
        })();

        // ============================================================
        // CONFIG
        // ============================================================
        const params = new URLSearchParams(window.location.search);
        const EVENT_ID = params.get('event') || 'event_001';
        const USER_ID = params.get('user') || 'user_001';
        const GAME_URL = 'games/ninja run/index.html';

        console.log('🎮 Ninja Run Wrapper loaded (DESKTOP ONLY)');
        console.log(`📋 Event: ${EVENT_ID}`);
        console.log(`👤 User: ${USER_ID}`);
        console.log('🖥️ Desktop mode: FORCED - No mobile views allowed');

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast-cyber');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-cyber';
            if (type === 'error') toast.classList.add('error');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        // ============================================================
        // SCORE TRACKING (From working version)
        // ============================================================
        let gameScore = 0;
        let scoreSubmitted = false;
        let scoreInterval = null;

        function startScoreTracking() {
            if (scoreInterval) clearInterval(scoreInterval);
            console.log('📊 Starting score tracking...');

            scoreInterval = setInterval(() => {
                if (!window.gameRuntime) return;
                try {
                    const rt = window.gameRuntime;
                    let score = 0;

                    // Check global variables
                    const vars = rt.all_global_vars || [];
                    for (let v of vars) {
                        if (v && v.name) {
                            if (v.name === 'Score' || v.name === 'score') {
                                score = v.data || 0;
                            }
                            if (v.name === 'GameOver' || v.name === 'gameOver') {
                                if (v.data === true && score > 0 && !scoreSubmitted) {
                                    console.log('🎯 Game Over detected');
                                    submitScore(score);
                                }
                            }
                        }
                    }

                    // Check runtime globalVars
                    if (rt.globalVars) {
                        for (const key in rt.globalVars) {
                            const lowerKey = key.toLowerCase();
                            if ((lowerKey.includes('score') || lowerKey.includes('distance')) && !lowerKey.includes(
                                'coins')) {
                                const val = rt.globalVars[key];
                                if (typeof val === 'number' && val > score) score = val;
                            }
                            if (lowerKey === 'gameover' && rt.globalVars[key] === true) {
                                if (score > 0 && !scoreSubmitted) {
                                    console.log('🎯 Game Over detected from globalVars');
                                    submitScore(score);
                                }
                            }
                        }
                    }

                    // Update score
                    if (score > gameScore) {
                        gameScore = score;
                        console.log('📊 Score updated:', gameScore);
                        document.getElementById('scoreDisplay').textContent = gameScore.toLocaleString();
                        sessionStorage.setItem('ninjaRunLiveScore', gameScore.toString());
                    }

                } catch (e) { /* Silent */ }
            }, 300);
        }

        // ============================================================
        // SUBMIT SCORE
        // ============================================================
        function submitScore(score) {
            if (scoreSubmitted) return;
            const finalScore = parseInt(score) || gameScore || 0;
            if (finalScore === 0) return;

            console.log('🏆 Submitting score:', finalScore);
            scoreSubmitted = true;

            sessionStorage.setItem('ninjaRunScore', finalScore.toString());
            sessionStorage.setItem('ninjaRunPlayed', 'true');
            sessionStorage.setItem('ninjaRunFinalScore', finalScore.toString());
            sessionStorage.setItem('ninjaRunComplete', 'true');

            if (window.parent && window.parent !== window) {
                try {
                    window.parent.postMessage({
                        type: 'NINJA_RUN_COMPLETE',
                        score: finalScore,
                        eventId: EVENT_ID,
                        userId: USER_ID,
                        timestamp: Date.now()
                    }, '*');
                    console.log('✅ Score sent to parent');
                } catch (e) {}
            }

            document.getElementById('scoreDisplay').textContent = finalScore.toLocaleString();
            document.getElementById('statusText').textContent = '✅ Complete!';
            document.getElementById('statusDot').className = 'dot complete';

            showToast(`🏆 Score: ${finalScore} points!`, 'success');
            setTimeout(() => window.close(), 3000);
        }

        // ============================================================
        // INJECT BRIDGE
        // ============================================================
        function injectBridge() {
            try {
                const frame = document.getElementById('gameFrame');
                const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                if (!frameDoc) return;

                if (frameDoc.getElementById('ninjaBridgeScript')) return;

                const script = frameDoc.createElement('script');
                script.id = 'ninjaBridgeScript';
                script.type = 'text/javascript';
                script.textContent = `
                    (function() {
                        console.log('🏃 Ninja Run Bridge loaded');
                        let gameScore = 0, scoreSubmitted = false, runtime = null, scoreInterval = null;

                        function startScoreTracking() {
                            if (scoreInterval) clearInterval(scoreInterval);
                            scoreInterval = setInterval(() => {
                                if (!window.gameRuntime) return;
                                try {
                                    const rt = window.gameRuntime;
                                    let score = 0;
                                    const vars = rt.all_global_vars || [];
                                    for (let v of vars) {
                                        if (v && v.name) {
                                            if (v.name === 'Score' || v.name === 'score') score = v.data || 0;
                                            if ((v.name === 'GameOver' || v.name === 'gameOver') && v.data === true && score > 0 && !scoreSubmitted) {
                                                submitScore(score);
                                            }
                                        }
                                    }
                                    if (rt.globalVars) {
                                        for (const key in rt.globalVars) {
                                            const lowerKey = key.toLowerCase();
                                            if ((lowerKey.includes('score') || lowerKey.includes('distance')) && !lowerKey.includes('coins')) {
                                                const val = rt.globalVars[key];
                                                if (typeof val === 'number' && val > score) score = val;
                                            }
                                            if (lowerKey === 'gameover' && rt.globalVars[key] === true) {
                                                if (score > 0 && !scoreSubmitted) submitScore(score);
                                            }
                                        }
                                    }
                                    if (score > gameScore) {
                                        gameScore = score;
                                        sessionStorage.setItem('ninjaRunLiveScore', gameScore.toString());
                                        if (window.parent && window.parent !== window) {
                                            try {
                                                window.parent.postMessage({ type: 'NINJA_RUN_SCORE', score: gameScore }, '*');
                                            } catch(e) {}
                                        }
                                    }
                                } catch(e) {}
                            }, 300);
                        }

                        function submitScore(score) {
                            if (scoreSubmitted) return;
                            const finalScore = parseInt(score) || gameScore || 0;
                            if (finalScore === 0) return;
                            scoreSubmitted = true;
                            sessionStorage.setItem('ninjaRunScore', finalScore.toString());
                            sessionStorage.setItem('ninjaRunPlayed', 'true');
                            sessionStorage.setItem('ninjaRunFinalScore', finalScore.toString());
                            sessionStorage.setItem('ninjaRunComplete', 'true');
                            if (window.parent && window.parent !== window) {
                                try {
                                    window.parent.postMessage({
                                        type: 'NINJA_RUN_COMPLETE',
                                        score: finalScore,
                                        eventId: '${EVENT_ID}',
                                        userId: '${USER_ID}',
                                        timestamp: Date.now()
                                    }, '*');
                                } catch(e) {}
                            }
                            const overlay = document.createElement('div');
                            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:Orbitron,monospace;color:#fff;';
                            overlay.innerHTML = '<div style="background:linear-gradient(135deg,#06111F,#0B1F36);border:2px solid #00BFFF;border-radius:20px;padding:30px 40px;text-align:center;max-width:400px;"><div style="font-size:3.5rem;">🏆</div><h2 style="color:#FFD700;font-size:1.3rem;">Game Complete!</h2><div style="font-size:2.5rem;color:#00E676;font-weight:700;margin:8px 0;">' + finalScore + '</div><div style="color:#A7B5C5;">points</div><button onclick="window.close()" style="margin-top:20px;background:linear-gradient(135deg,#00BFFF,#6C63FF);border:none;color:#000;padding:10px 25px;border-radius:10px;font-family:Orbitron,monospace;font-weight:700;cursor:pointer;">Close</button></div>';
                            document.body.appendChild(overlay);
                            setTimeout(() => window.close(), 4000);
                        }

                        function waitForRuntime() {
                            let attempts = 0;
                            const checkRuntime = setInterval(() => {
                                attempts++;
                                try {
                                    const canvas = document.getElementById('c2canvas');
                                    if (canvas && canvas.c2runtime) {
                                        clearInterval(checkRuntime);
                                        runtime = canvas.c2runtime;
                                        window.gameRuntime = runtime;
                                        startScoreTracking();
                                        return;
                                    }
                                    if (window.c2runtime) {
                                        clearInterval(checkRuntime);
                                        runtime = window.c2runtime;
                                        window.gameRuntime = runtime;
                                        startScoreTracking();
                                        return;
                                    }
                                } catch(e) {}
                                if (attempts > 50) {
                                    clearInterval(checkRuntime);
                                }
                            }, 500);
                        }

                        window.__ninjaDebug = {
                            score: () => gameScore,
                            status: () => ({ score: gameScore, submitted: scoreSubmitted, runtime: !!runtime }),
                            submit: (s) => submitScore(s)
                        };

                        waitForRuntime();
                        console.log('✅ Bridge ready');
                    })();
                `;

                frameDoc.head.appendChild(script);
                console.log('✅ Bridge injected');

            } catch (e) {
                console.log('⚠️ Error injecting bridge:', e);
            }
        }

        // ============================================================
        // LOAD GAME
        // ============================================================
        function loadGame() {
            const frame = document.getElementById('gameFrame');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const progressFill = document.getElementById('progressFill');
            const loadingText = document.getElementById('loadingText');
            const errorText = document.getElementById('errorText');
            const retryBtn = document.getElementById('retryBtn');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            errorText.style.display = 'none';
            retryBtn.style.display = 'none';
            loadingText.textContent = '🏃 Loading Ninja Run...';
            progressFill.style.width = '0%';
            statusText.textContent = 'Loading...';
            statusDot.className = 'dot';

            const timestamp = Date.now();
            const gameUrl = `${GAME_URL}?event=${EVENT_ID}&user=${USER_ID}&t=${timestamp}`;
            frame.src = gameUrl;

            let progress = 0;
            let loadAttempts = 0;
            const maxAttempts = 50;

            const progressInterval = setInterval(() => {
                progress += Math.random() * 8 + 2;
                if (progress > 95) progress = 95;
                progressFill.style.width = progress + '%';
            }, 200);

            const loadCheck = setInterval(() => {
                loadAttempts++;
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow?.document;
                    if (frameDoc) {
                        const canvas = frameDoc.getElementById('c2canvas');
                        const bodyContent = frameDoc.body?.innerHTML || '';
                        if (canvas || bodyContent.includes('c2canvas') || bodyContent.includes('Construct 2')) {
                            clearInterval(progressInterval);
                            clearInterval(loadCheck);
                            progressFill.style.width = '100%';
                            loadingText.textContent = '✅ Game Loaded!';
                            setTimeout(() => {
                                loadingOverlay.classList.add('hidden');
                                statusText.textContent = 'Playing...';
                                statusDot.className = 'dot';
                            }, 400);
                            setTimeout(() => injectBridge(), 1500);
                            return;
                        }
                    }
                } catch (e) {
                    console.log('⏳ Waiting for game to load...', loadAttempts);
                }
                if (loadAttempts >= maxAttempts) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                    errorText.style.display = 'block';
                    retryBtn.style.display = 'block';
                    loadingText.textContent = '⚠️ Game taking too long to load';
                    statusText.textContent = '⚠️ Error';
                    statusDot.className = 'dot error';
                    showToast('⚠️ Game failed to load. Please try again.', 'error');
                }
            }, 200);

            setTimeout(() => {
                if (!loadingOverlay.classList.contains('hidden')) {
                    clearInterval(progressInterval);
                    clearInterval(loadCheck);
                }
            }, 10000);
        }

        // ============================================================
        // MESSAGE LISTENER
        // ============================================================
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NINJA_RUN_SCORE') {
                const display = document.getElementById('scoreDisplay');
                const score = event.data.score || 0;
                display.textContent = score.toLocaleString();
                display.className = 'score-value pulse';
                setTimeout(() => { display.className = 'score-value'; }, 300);
                gameScore = score;
            }
            if (event.data && event.data.type === 'NINJA_RUN_COMPLETE') {
                const display = document.getElementById('scoreDisplay');
                display.textContent = (event.data.score || 0).toLocaleString();
                document.getElementById('statusText').textContent = '✅ Complete!';
                document.getElementById('statusDot').className = 'dot complete';
                submitScore(event.data.score);
            }
        });

        // ============================================================
        // PREVENT ALL TOUCH/MOBILE INTERACTIONS
        // ============================================================
        document.addEventListener('touchmove', function(e) {
            if (e.target === document.body || e.target === document.getElementById('gameContainer')) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

        // Block pinch zoom
        document.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // ============================================================
        // DEBUG (Parent)
        // ============================================================
        window.__ninjaParentDebug = {
            getStatus: function() {
                return {
                    score: gameScore,
                    submitted: scoreSubmitted,
                    sessionScore: sessionStorage.getItem('ninjaRunScore'),
                    liveScore: sessionStorage.getItem('ninjaRunLiveScore'),
                    desktopMode: 'FORCED'
                };
            },
            submitScore: function(score) {
                window.submitScore(score);
            }
        };

        // ============================================================
        // INIT
        // ============================================================
        loadGame();

        console.log('');
        console.log('🖥️ ===========================================');
        console.log('🖥️ DESKTOP MODE - FORCED & LOCKED');
        console.log('🖥️ ===========================================');
        console.log('📱 Mobile/Tablet views are BLOCKED');
        console.log('🔒 Device toolbar changes are OVERRIDDEN');
        console.log('📐 Always displays at 1280x720+ resolution');
        console.log('✅ Press "ESC" to close game');
        console.log('');
        console.log('🔍 DEBUG COMMANDS (in console):');
        console.log('  __ninjaParentDebug.getStatus()  - Check game status');
        console.log('  __ninjaParentDebug.submitScore(1000)  - Manually submit score');
    </script>

</body>
</html>
