<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Game Lobby - Shora Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ========================================
           ALL STYLES
           ======================================== */
        :root {
            --bg: #06111F;
            --bg2: #0B1F36;
            --primary: #00BFFF;
            --secondary: #6C63FF;
            --success: #00E676;
            --danger: #FF4D6D;
            --gold: #FFD700;
            --text: #F5F7FA;
            --muted: #A7B5C5;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bg-layer::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, #0D1B2A 100%); }
        .bg-layer::after { content: ''; position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0, 191, 255, 0.05) 0%, transparent 70%); transform: translate(-50%, -50%); animation: glowPulse 8s ease-in-out infinite; }
        @keyframes glowPulse { 0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.05); } }

        .grid-overlay { position: fixed; inset: 0; background-image: linear-gradient(rgba(0, 191, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 191, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 1; }

        /* ===== NAVBAR ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6, 17, 31, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 191, 255, 0.1);
            padding: 10px 0;
        }

        .nav-row {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo { font-family: 'Orbitron', monospace; font-size: 1.2rem; font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo i { font-size: 1.4rem; -webkit-text-fill-color: var(--primary); }

        .nav-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .nav-right .balance-display { display: flex; align-items: center; gap: 6px; font-family: 'Orbitron', monospace; font-weight: 700; color: var(--success); font-size: 0.95rem; background: rgba(0, 230, 118, 0.05); padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(0, 230, 118, 0.1); }
        .nav-right .balance-display i { font-size: 0.9rem; color: var(--gold); }
        .nav-right .username-display { color: var(--text); font-weight: 500; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
        .nav-right .username-display i { color: var(--primary); font-size: 0.9rem; }
        .nav-right .logout-btn { color: var(--muted); text-decoration: none; font-size: 0.75rem; padding: 6px 14px; border-radius: 8px; transition: var(--transition); border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); cursor: pointer; }
        .nav-right .logout-btn:hover { background: rgba(255, 77, 109, 0.1); border-color: var(--danger); color: var(--danger); }

        /* ===== USER NAVIGATION ===== */
        .user-nav {
            background: rgba(6, 17, 31, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 191, 255, 0.08);
            padding: 8px 0;
            position: sticky;
            top: 60px;
            z-index: 99;
        }

        .user-nav-row {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            gap: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .user-nav-row::-webkit-scrollbar { display: none; }

        .user-nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            border: 1px solid transparent;
            flex-shrink: 0;
        }

        .user-nav-link i { font-size: 0.9rem; width: 18px; text-align: center; }
        .user-nav-link:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); border-color: rgba(0, 191, 255, 0.1); }
        .user-nav-link.active { color: var(--primary); background: rgba(0, 191, 255, 0.08); border-color: rgba(0, 191, 255, 0.2); box-shadow: 0 0 20px rgba(0, 191, 255, 0.05); }
        .user-nav-link .badge { background: var(--danger); color: #fff; font-size: 0.5rem; padding: 1px 6px; border-radius: 20px; margin-left: 2px; font-weight: 700; }

        @media (max-width: 480px) {
            .user-nav { top: 56px; padding: 6px 0; }
            .user-nav-link { padding: 6px 12px; font-size: 0.65rem; gap: 4px; }
            .user-nav-link i { font-size: 0.75rem; width: 14px; }
            .user-nav-link span { font-size: 0.6rem; }
        }

        /* ===== CONTAINER ===== */
        .container { max-width: 1280px; margin: 0 auto; padding: 16px 16px 40px; position: relative; z-index: 2; }

        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 { font-family: 'Orbitron', monospace; font-size: 1.3rem; }
        .page-header h1 span { color: var(--primary); }
        .page-header .subtitle { color: var(--muted); font-size: 0.8rem; }

        /* ===== GAME GRID ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* ===== GAME CARD ===== */
        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        .game-card:hover {
            border-color: rgba(0, 191, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .game-card .card-cover {
            position: relative;
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--bg2), #0D1B2A);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-card .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .game-card .card-cover .placeholder-icon {
            font-size: 3rem;
            opacity: 0.3;
            color: var(--primary);
        }

        .game-card .card-cover .card-status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .game-card .card-cover .card-status-badge.active { color: var(--success); border-color: rgba(0, 230, 118, 0.3); }
        .game-card .card-cover .card-status-badge.inactive { color: var(--danger); border-color: rgba(255, 77, 109, 0.3); }
        .game-card .card-cover .card-status-badge.maintenance { color: var(--gold); border-color: rgba(255, 200, 87, 0.3); }

        /* ===== COUNTDOWN OVERLAY ===== */
        .game-card .card-countdown {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            z-index: 10;
        }
        .game-card .card-countdown .countdown-label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
        }
        .game-card .card-countdown .countdown-timer {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary);
        }
        .game-card .card-countdown .countdown-timer.urgent {
            color: var(--danger);
            animation: timerPulse 1s ease-in-out infinite;
        }
        .game-card .card-countdown .countdown-timer.live-text {
            color: var(--success);
            font-size: 0.8rem;
        }

        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== CARD BODY ===== */
        .game-card .card-body { padding: 16px 18px; }
        .game-card .card-body .card-title { font-family: 'Orbitron', monospace; font-size: 1rem; margin-bottom: 4px; }
        .game-card .card-body .card-category { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }

        .game-card .card-body .card-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 8px 0;
        }
        .game-card .card-body .card-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--muted);
        }
        .game-card .card-body .card-meta .meta-item i { color: var(--primary); width: 14px; font-size: 0.65rem; }
        .game-card .card-body .card-meta .meta-item strong { color: var(--text); font-weight: 600; }
        .game-card .card-body .card-meta .meta-item .gold { color: var(--gold); }

        /* ===== PRIZE DISPLAY ===== */
        .prize-display {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px 12px;
            margin: 8px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .prize-display .prize-pool {
            text-align: center;
            padding: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .prize-display .prize-pool .pool-amount {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
            display: block;
        }

        .prize-display .prize-pool .pool-label {
            font-size: 0.55rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prize-display .top-prizes {
            display: flex;
            justify-content: space-around;
            padding: 6px 0;
        }

        .prize-display .prize-rank {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            gap: 1px;
        }

        .prize-display .prize-rank .rank-icon { font-size: 1rem; }
        .prize-display .prize-rank .rank-amount { font-weight: 700; color: var(--text); font-size: 0.7rem; }
        .prize-display .prize-rank.gold .rank-amount { color: #FFD700; }
        .prize-display .prize-rank.silver .rank-amount { color: #C0C0C0; }
        .prize-display .prize-rank.bronze .rank-amount { color: #CD7F32; }

        /* ===== CARD ACTIONS ===== */
        .game-card .card-body .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .game-card .card-body .card-actions .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: center;
            min-width: 80px;
        }

        /* ===== DEMO BUTTON - ALWAYS VISIBLE ===== */
        .btn-card-demo {
            background: linear-gradient(135deg, #FF1744, #D50000);
            color: #fff;
            border: 1px solid rgba(255, 23, 68, 0.3);
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.2);
            animation: demoPulse 2s ease-in-out infinite;
            flex: 1 !important;
        }
        .btn-card-demo:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 30px rgba(255, 23, 68, 0.4);
            background: linear-gradient(135deg, #FF5252, #D50000);
        }
        .btn-card-demo i { 
            color: #fff; 
            animation: demoSpin 3s linear infinite;
        }
        
        @keyframes demoPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 23, 68, 0.2); }
            50% { box-shadow: 0 0 40px rgba(255, 23, 68, 0.5); }
        }
        
        @keyframes demoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-card-demo .demo-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0 6px;
            border-radius: 4px;
            font-size: 0.5rem;
            font-weight: 700;
            margin-left: 2px;
        }

        /* ===== JOIN NOW BUTTON - GREEN ===== */
        .btn-card-join {
            background: linear-gradient(135deg, var(--success), #00C853);
            color: #000;
            font-weight: 700;
        }
        .btn-card-join:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 230, 118, 0.3); }
        .btn-card-join:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== PLAY NOW BUTTON - GOLD ===== */
        .btn-card-play {
            background: linear-gradient(135deg, var(--gold), #FFA000);
            color: #000;
            font-weight: 700;
        }
        .btn-card-play:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(255, 200, 87, 0.3); 
        }
        .btn-card-play:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== BLOCKED / LOCKED BUTTON ===== */
        .btn-card-blocked {
            background: rgba(255, 77, 109, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 109, 0.2);
            cursor: not-allowed;
        }

        /* ===== INFO BUTTON ===== */
        .btn-card-view {
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            flex: 0.4 !important;
            min-width: auto !important;
            padding: 8px 12px !important;
        }
        .btn-card-view:hover { border-color: var(--primary); background: rgba(0, 191, 255, 0.05); }

        /* ===== PLAYER PROGRESS ===== */
        .game-card .card-body .card-players {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .game-card .card-body .card-players .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
        }
        .game-card .card-body .card-players .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        .game-card .card-body .card-players .count {
            font-size: 0.7rem;
            color: var(--muted);
            white-space: nowrap;
        }
        .game-card .card-body .card-players .count strong { color: var(--text); }

        /* ===== TOAST ===== */
        .toast-cyber {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 17, 31, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 191, 255, 0.3);
            border-radius: 50px;
            padding: 10px 20px;
            color: var(--primary);
            font-size: 0.8rem;
            z-index: 5000;
            display: none;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .toast-cyber.error { border-color: var(--danger); color: var(--danger); }
        .toast-cyber.success { border-color: var(--success); color: var(--success); }
        .toast-cyber.warning { border-color: var(--gold); color: var(--gold); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .nav-row { flex-direction: column; align-items: stretch; gap: 8px; }
            .nav-right { justify-content: space-between; }
            .game-grid { grid-template-columns: 1fr 1fr; }
            .page-header h1 { font-size: 1rem; }
            .game-card .card-cover { height: 140px; }
        }

        @media (max-width: 480px) {
            .container { padding: 10px 10px 30px; }
            .game-grid { grid-template-columns: 1fr; }
            .game-card .card-cover { height: 120px; }
            .game-card .card-body { padding: 12px 14px; }
            .game-card .card-body .card-title { font-size: 0.9rem; }
            .game-card .card-body .card-actions .btn { font-size: 0.65rem; padding: 6px 12px; }
            .nav-right { flex-wrap: wrap; justify-content: center; }
            .nav-right .username-display { width: 100%; text-align: center; justify-content: center; }
        }

        @media (max-width: 360px) {
            .game-grid { grid-template-columns: 1fr; }
            .game-card .card-body .card-meta { grid-template-columns: 1fr; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 191, 255, 0.3); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 191, 255, 0.5); }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-layer"></div>
    <div class="grid-overlay"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-row">
            <div class="logo" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-gamepad"></i> SHORA
            </div>
            <div class="nav-right">
                <span class="username-display" id="usernameDisplay">
                    <i class="fas fa-user"></i> <span id="navUsername">Player</span>
                </span>
                <span class="balance-display">
                    <i class="fas fa-coins"></i>
                    <span id="balanceDisplay">0</span> RWF
                </span>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> <span class="logout-text">Logout</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ===== USER NAVIGATION ===== -->
    <nav class="user-nav">
        <div class="user-nav-row">
            <a href="dashboard.html" class="user-nav-link">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="game-lobby.html" class="user-nav-link active">
                <i class="fas fa-gamepad"></i>
                <span>Games</span>
                <span class="badge" id="gameBadge">0</span>
            </a>
            <a href="tournaments.html" class="user-nav-link">
                <i class="fas fa-trophy"></i>
                <span>Tournaments</span>
            </a>
            <a href="rankings.html" class="user-nav-link">
                <i class="fas fa-ranking-star"></i>
                <span>Rankings</span>
            </a>
            <a href="profile.html" class="user-nav-link">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
            <a href="deposit.html" class="user-nav-link">
                <i class="fas fa-wallet"></i>
                <span>Wallet</span>
            </a>
            <a href="withdraw.html" class="user-nav-link">
                <i class="fas fa-arrow-up"></i>
                <span>Withdraw</span>
            </a>
            <a href="support.html" class="user-nav-link">
                <i class="fas fa-headset"></i>
                <span>Support</span>
            </a>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>🎮 <span>Game Lobby</span></h1>
                <div class="subtitle">Join live rounds and compete for prizes!</div>
            </div>
            <div id="gameCounter" style="font-size:0.8rem;color:var(--muted);">
                <i class="fas fa-users"></i> <span id="totalPlayers">0</span> players online
            </div>
        </div>

        <!-- ===== GAME GRID ===== -->
        <div id="gameGrid" class="game-grid">
            <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">
                <div class="loading-spinner" style="display:inline-block;width:30px;height:30px;border:3px solid rgba(255,255,255,0.1);border-top:3px solid var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                <p style="margin-top:12px;">Loading games...</p>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast-cyber">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage">Message</span>
    </div>

    <!-- ===== FIREBASE IMPORTS ===== -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js"
            }
        }
    </script>

    <!-- ===== JAVASCRIPT ===== -->
    <script type="module">
        // ========================================
        // IMPORTS
        // ========================================

        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, onValue, get, update, set, push } from "firebase/database";
        import { getAuth, onAuthStateChanged } from "firebase/auth";

        // ========================================
        // FIREBASE CONFIG
        // ========================================

        const firebaseConfig = {
            apiKey: "AIzaSyDTcM9aUFhOpJTdQTSZAF_1XMEt6GL48Hs",
            authDomain: "shora-games.firebaseapp.com",
            projectId: "shora-games",
            databaseURL: "https://shora-games-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // ========================================
        // STATE
        // ========================================

        let currentUser = null;
        let userData = { balance: 0, username: 'Player' };
        let allGames = [];
        let userJoinedRounds = {};
        let countdownIntervals = {};

        // ========================================
        // AUTH STATE
        // ========================================

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadUserData(user.uid);
                loadGames();
                updateUI();
            } else {
                window.location.href = 'login.html';
            }
        });

        // ========================================
        // LOAD USER DATA
        // ========================================

        async function loadUserData(uid) {
            try {
                const userRef = ref(db, `users/${uid}`);
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    userData = {
                        balance: data.balance || 0,
                        username: data.username || 'Player',
                        email: data.email || '',
                        phone: data.phone || ''
                    };
                }
                document.getElementById('navUsername').textContent = userData.username;
                document.getElementById('balanceDisplay').textContent = userData.balance.toLocaleString();
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        // ========================================
        // LOAD GAMES
        // ========================================

        function loadGames() {
            const gamesRef = ref(db, 'games');
            
            onValue(gamesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    processGames(data);
                } else {
                    processGames({});
                }
            });
        }

        // ========================================
        // PROCESS GAMES
        // ========================================

        function processGames(data) {
            const games = [];
            let totalPlayers = 0;

            for (const [id, game] of Object.entries(data || {})) {
                if (!game || typeof game !== 'object') continue;
                
                // Skip inactive games
                if (game.status === 'inactive') continue;
                
                // Get current round info
                const currentRound = getCurrentRound(game);
                
                // Check if user has joined this round
                const userHasJoined = currentUser && currentRound?.roundId && 
                    userJoinedRounds[currentRound.roundId] === true;
                
                // Check if user has played this round
                let userHasPlayed = false;
                if (currentUser && currentRound?.roundId) {
                    // We'll check this later when rendering
                }
                
                games.push({
                    id: id,
                    name: game.name || 'Unnamed Game',
                    category: game.category || 'Unknown',
                    image: game.image || '',
                    description: game.description || '',
                    status: game.status || 'active',
                    isActive: game.isActive || false,
                    locked: game.locked || false,
                    url: game.url || '',
                    
                    roundSettings: {
                        duration: game.roundSettings?.duration || 15,
                        joinWindow: game.roundSettings?.joinWindow || 5,
                        minPlayers: game.roundSettings?.minPlayers || 2,
                        maxPlayers: game.roundSettings?.maxPlayers || 50,
                        entryFee: game.roundSettings?.entryFee || 100,
                        breakDuration: game.roundSettings?.breakDuration || 10,
                        refundBreak: game.roundSettings?.refundBreak || 5,
                        enabled: game.roundSettings?.enabled || false
                    },
                    
                    prizeDistribution: {
                        tiers: game.prizeDistribution?.tiers || { '1st': 60, '2nd': 25, '3rd': 15 },
                        platformFee: game.prizeDistribution?.platformFee || 10,
                        distributionModel: game.prizeDistribution?.distributionModel || 'dynamic',
                        participationBonus: game.prizeDistribution?.participationBonus || false
                    },
                    
                    currentRound: currentRound,
                    userHasJoined: userHasJoined,
                    userHasPlayed: userHasPlayed,
                    
                    stats: game.stats || {
                        totalRounds: 0,
                        totalPlayers: 0,
                        totalRevenue: 0,
                        totalPayout: 0,
                        platformEarnings: 0,
                        currentPlayers: 0
                    },
                    
                    createdAt: game.createdAt || new Date().toISOString(),
                    updatedAt: game.updatedAt || new Date().toISOString()
                });
                
                totalPlayers += game.stats?.currentPlayers || 0;
            }

            // Sort: Active games first
            games.sort((a, b) => {
                if (a.status === 'active' && b.status !== 'active') return -1;
                if (a.status !== 'active' && b.status === 'active') return 1;
                return a.name.localeCompare(b.name);
            });

            allGames = games;
            document.getElementById('totalPlayers').textContent = totalPlayers;
            document.getElementById('gameBadge').textContent = games.filter(g => g.status === 'active').length;
            
            renderGames(games);
            
            // Start countdowns for all games
            games.forEach(game => {
                if (game.currentRound) {
                    startCountdown(game);
                }
            });
        }

               // ========================================
        // GET CURRENT ROUND - FIXED
        // ========================================

        function getCurrentRound(game) {
            const now = new Date();
            const duration = game.roundSettings?.duration || 15;
            const joinWindow = game.roundSettings?.joinWindow || 5;
            
            // Get the start of today
            const startOfDay = new Date(now);
            startOfDay.setHours(0, 0, 0, 0);
            
            // Calculate current round index
            const minutesSinceMidnight = (now.getHours() * 60) + now.getMinutes();
            const currentRoundIndex = Math.floor(minutesSinceMidnight / duration);
            
            // Calculate round start time
            const roundStart = new Date(startOfDay);
            roundStart.setMinutes(roundStart.getMinutes() + (currentRoundIndex * duration));
            
            // Calculate round end time
            const roundEnd = new Date(roundStart);
            roundEnd.setMinutes(roundEnd.getMinutes() + duration);
            
            // Calculate join window start (joinWindow minutes before round starts)
            const joinStart = new Date(roundStart);
            joinStart.setMinutes(joinStart.getMinutes() - joinWindow);
            
            const roundId = `round_${currentRoundIndex + 1}`;
            
            // LOG FOR DEBUGGING
            console.log(`🕐 Round #${currentRoundIndex + 1} for ${game.name || 'game'}`);
            console.log(`   Join Start: ${joinStart.toLocaleTimeString()}`);
            console.log(`   Round Start: ${roundStart.toLocaleTimeString()}`);
            console.log(`   Round End: ${roundEnd.toLocaleTimeString()}`);
            console.log(`   Current Time: ${now.toLocaleTimeString()}`);
            
            let status = 'scheduled';
            let statusLabel = '⏳ Upcoming';
            let statusClass = 'soon';
            let isOpen = false;
            let isActive = false;
            let isEnded = false;
            
            // Check if round is open for joining (joinWindow before start)
            if (now >= joinStart && now < roundStart) {
                status = 'open';
                statusLabel = '🟢 Open - Join Now!';
                statusClass = 'live';
                isOpen = true;
                console.log('   ✅ Round is OPEN for joining!');
            } 
            // Check if round is active (game is being played)
            else if (now >= roundStart && now < roundEnd) {
                status = 'active';
                statusLabel = '🔴 Active';
                statusClass = 'live';
                isActive = true;
                console.log('   🔴 Round is ACTIVE (in progress)');
            } 
            // Check if round has ended
            else if (now >= roundEnd) {
                status = 'ended';
                statusLabel = '✅ Ended';
                statusClass = 'ended';
                isEnded = true;
                console.log('   ✅ Round has ENDED');
            } 
            // Round is scheduled (not yet in join window)
            else {
                status = 'scheduled';
                statusLabel = '⏳ Upcoming';
                statusClass = 'soon';
                console.log('   ⏳ Round is SCHEDULED (waiting for join window)');
            }
            
            return {
                roundId: roundId,
                roundNumber: currentRoundIndex + 1,
                startTime: roundStart.toISOString(),
                endTime: roundEnd.toISOString(),
                joinStart: joinStart.toISOString(),
                status: status,
                statusLabel: statusLabel,
                statusClass: statusClass,
                isOpen: isOpen,
                isActive: isActive,
                isEnded: isEnded
            };
        }
        // ========================================
        // COUNTDOWN HELPERS
        // ========================================

        function getTimeRemaining(targetTime) {
            const now = Date.now();
            const target = new Date(targetTime).getTime();
            const diff = target - now;
            
            if (diff <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, total: 0 };
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            return { days, hours, minutes, seconds, total: diff };
        }

        function formatCountdown(time, showDays = true) {
            if (time.total <= 0) return '00:00';
            
            if (showDays && time.days > 0) {
                return `${time.days}d ${String(time.hours).padStart(2, '0')}h ${String(time.minutes).padStart(2, '0')}m`;
            }
            
            if (time.hours > 0) {
                return `${String(time.hours).padStart(2, '0')}:${String(time.minutes).padStart(2, '0')}:${String(time.seconds).padStart(2, '0')}`;
            }
            
            return `${String(time.minutes).padStart(2, '0')}:${String(time.seconds).padStart(2, '0')}`;
        }

        // ========================================
        // START COUNTDOWN
        // ========================================

        function startCountdown(game) {
            const gameId = game.id;
            const round = game.currentRound;
            
            if (!round) return;
            
            let targetTime;
            let isLive = false;
            
            if (round.isOpen) {
                // Round is open - countdown to start
                targetTime = round.startTime;
                isLive = true;
            } else if (round.isActive) {
                // Round is active - countdown to end
                targetTime = round.endTime;
                isLive = true;
            } else {
                // Round is scheduled or ended - no countdown needed
                return;
            }
            
            // Clear existing interval
            if (countdownIntervals[gameId]) {
                clearInterval(countdownIntervals[gameId]);
            }
            
            countdownIntervals[gameId] = setInterval(() => {
                const timeRemaining = getTimeRemaining(targetTime);
                const timerElement = document.querySelector(`[data-game-id="${gameId}"]`);
                
                if (!timerElement) {
                    clearInterval(countdownIntervals[gameId]);
                    return;
                }

                if (timeRemaining.total <= 0) {
                    clearInterval(countdownIntervals[gameId]);
                    timerElement.textContent = '00:00';
                    timerElement.className = 'countdown-timer live-text';
                    // Reload games to update round status
                    loadGames();
                    return;
                }

                const display = formatCountdown(timeRemaining, false);
                timerElement.textContent = display;

                if (timeRemaining.total < 300000) {
                    timerElement.className = 'countdown-timer urgent';
                } else {
                    timerElement.className = 'countdown-timer';
                }
            }, 1000);
        }

        // ========================================
        // RENDER GAMES - COMPLETE WITH COUNTDOWN
        // ========================================

        function renderGames(games) {
            const grid = document.getElementById('gameGrid');
            
            if (games.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);">
                        <i class="fas fa-gamepad" style="font-size:3rem;opacity:0.3;display:block;margin-bottom:16px;"></i>
                        <h3 style="color:var(--text);font-family:'Orbitron',monospace;font-size:1.1rem;">No Active Games</h3>
                        <p style="margin-top:6px;font-size:0.9rem;">Check back soon for new games!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = games.map(game => {
                const round = game.currentRound;
                const isOpen = round?.isOpen || false;
                const isActive = round?.isActive || false;
                const isEnded = round?.isEnded || false;
                
                const entryFee = game.roundSettings.entryFee || 100;
                const maxPlayers = game.roundSettings.maxPlayers || 50;
                const currentPlayers = game.stats?.currentPlayers || 0;
                const progress = (currentPlayers / maxPlayers) * 100;
                const prizePool = currentPlayers * entryFee;
                
                const isLocked = game.locked || false;
                const userHasJoined = game.userHasJoined || false;
                const isFull = currentPlayers >= maxPlayers;
                
                // Calculate prize distribution
                const tiers = game.prizeDistribution.tiers || { '1st': 60, '2nd': 25, '3rd': 15 };
                const platformFee = game.prizeDistribution.platformFee || 10;
                const platformAmount = prizePool * (platformFee / 100);
                const totalPrizePool = prizePool - platformAmount;
                
                // Build prize display
                let prizeHtml = '';
                const rankEmojis = { '1st': '🥇', '2nd': '🥈', '3rd': '🥉' };
                const rankClasses = { '1st': 'gold', '2nd': 'silver', '3rd': 'bronze' };
                
                let topPrizesHtml = '';
                const tierKeys = Object.keys(tiers);
                for (let i = 0; i < Math.min(tierKeys.length, 3); i++) {
                    const key = tierKeys[i];
                    const percent = tiers[key];
                    const amount = Math.round(totalPrizePool * (percent / 100));
                    const emoji = rankEmojis[key] || '🏅';
                    const cls = rankClasses[key] || '';
                    topPrizesHtml += `
                        <div class="prize-rank ${cls}">
                            <span class="rank-icon">${emoji}</span>
                            <span class="rank-amount">${amount.toLocaleString()} RWF</span>
                        </div>
                    `;
                }
                
                if (topPrizesHtml) {
                    prizeHtml = `
                        <div class="prize-display">
                            <div class="prize-pool">
                                <span class="pool-amount">${totalPrizePool.toLocaleString()} RWF</span>
                                <span class="pool-label">🏆 Prize Pool</span>
                            </div>
                            <div class="top-prizes">${topPrizesHtml}</div>
                        </div>
                    `;
                }

                // ===== COUNTDOWN HTML =====
                let countdownHtml = '';
                let targetTime = '';
                let countdownLabel = '';
                
                if (isOpen) {
                    targetTime = round.startTime;
                    countdownLabel = 'Starts in';
                } else if (isActive) {
                    targetTime = round.endTime;
                    countdownLabel = 'Ends in';
                }
                
                if (targetTime) {
                    const timeRemaining = getTimeRemaining(targetTime);
                    const display = formatCountdown(timeRemaining, false);
                    
                    countdownHtml = `
                        <div class="card-countdown">
                            <span class="countdown-label">
                                <i class="fas fa-${isActive ? 'hourglass-end' : 'hourglass-start'}"></i>
                                ${countdownLabel}
                            </span>
                            <span class="countdown-timer ${isActive && timeRemaining.total < 300 ? 'urgent' : ''}" 
                                  data-game-id="${game.id}" data-target="${targetTime}">
                                ${display}
                            </span>
                        </div>
                    `;
                }

                            // ===== BUILD CARD ACTIONS =====
                let buttonsHtml = '';
                
                // 1. DEMO BUTTON - ALWAYS VISIBLE
                buttonsHtml += `
                    <button class="btn btn-card-demo" onclick="openDemo('${game.id}')" title="Practice mode - Always available">
                        <i class="fas fa-gamepad"></i> Demo <span class="demo-badge">FREE</span>
                    </button>
                `;

                // 2. MAIN ACTION BUTTON - FIXED LOGIC
                console.log(`🔍 Game: ${game.name}, Locked: ${isLocked}, Status: ${game.status}, Round Open: ${isOpen}, User Joined: ${userHasJoined}, Is Full: ${isFull}`);
                
                if (isLocked) {
                    // Game is locked - ONLY show Demo button, no join/play
                    buttonsHtml += `
                        <button class="btn btn-card-blocked" disabled>
                            <i class="fas fa-lock"></i> Locked
                        </button>
                    `;
                } else if (game.status !== 'active') {
                    // Game is not active
                    buttonsHtml += `
                        <button class="btn btn-card-blocked" disabled>
                            <i class="fas fa-pause-circle"></i> ${game.status === 'maintenance' ? 'Maintenance' : 'Inactive'}
                        </button>
                    `;
                } else if (userHasJoined) {
                    // User already joined → Show Play Now
                    buttonsHtml += `
                        <button class="btn btn-card-play" onclick="playGame('${game.id}')">
                            <i class="fas fa-play"></i> Play Now
                        </button>
                    `;
                } else if (isOpen && !isFull) {
                    // ✅ Round is OPEN and not full → Show Join Now (Green)
                    buttonsHtml += `
                        <button class="btn btn-card-join" onclick="joinRound('${game.id}')">
                            <i class="fas fa-ticket-alt"></i> Join Now (${entryFee} RWF)
                        </button>
                    `;
                } else if (isFull) {
                    buttonsHtml += `
                        <button class="btn btn-card-blocked" disabled>
                            <i class="fas fa-users"></i> Full (${currentPlayers}/${maxPlayers})
                        </button>
                    `;
                } else if (isActive) {
                    // Round is active but user hasn't joined
                    buttonsHtml += `
                        <button class="btn btn-card-blocked" disabled>
                            <i class="fas fa-clock"></i> Round in Progress
                        </button>
                    `;
                } else if (isEnded) {
                    buttonsHtml += `
                        <button class="btn btn-card-blocked" disabled>
                            <i class="fas fa-hourglass-end"></i> Next Round Soon
                        </button>
                    `;
                } else {
                    // Round is scheduled but not open yet
                    const timeRemaining = getTimeRemaining(round.startTime);
                    const waitTime = formatCountdown(timeRemaining, false);
                    buttonsHtml += `
                        <button class="btn btn-card-blocked" disabled>
                            <i class="fas fa-clock"></i> Opens in ${waitTime}
                        </button>
                    `;
                }
                // 3. INFO BUTTON
                buttonsHtml += `
                    <button class="btn btn-card-view" onclick="showGameInfo('${game.id}')" title="Game Info">
                        <i class="fas fa-info-circle"></i>
                    </button>
                `;

                // ===== IMAGE HTML =====
                let imageHtml = '';
                if (game.image) {
                    imageHtml = `
                        <img src="${game.image}" alt="${game.name}" loading="lazy" 
                             onerror="this.style.display='none';this.parentNode.querySelector('.placeholder-icon').style.display='flex';">
                        <span class="placeholder-icon" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:3rem;opacity:0.3;color:var(--primary);background:linear-gradient(135deg,var(--bg2),#0D1B2A);">
                            <i class="fas fa-gamepad"></i>
                        </span>
                    `;
                } else {
                    imageHtml = `
                        <span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:3rem;opacity:0.3;color:var(--primary);background:linear-gradient(135deg,var(--bg2),#0D1B2A);">
                            <i class="fas fa-gamepad"></i>
                        </span>
                    `;
                }

                // Status badge
                const statusClass = game.status === 'active' ? 'active' : 
                                   game.status === 'maintenance' ? 'maintenance' : 'inactive';
                const statusLabel = game.status === 'active' ? '🟢 Active' :
                                   game.status === 'maintenance' ? '🟡 Maintenance' : '🔴 Inactive';

                // Lock badge
                let lockBadgeHtml = '';
                if (isLocked) {
                    lockBadgeHtml = `<span style="position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:30px;font-size:0.55rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);color:var(--danger);">🔒 Locked</span>`;
                } else {
                    lockBadgeHtml = `<span style="position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:30px;font-size:0.55rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);color:var(--success);">🔓 Open</span>`;
                }

                // Round status label
                let roundStatusHtml = '';
                if (round) {
                    roundStatusHtml = `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:rgba(0,191,255,0.05);border-radius:6px;margin-top:6px;border:1px solid rgba(0,191,255,0.05);">
                            <span style="font-size:0.6rem;color:var(--muted);">Round #${round.roundNumber}</span>
                            <span style="font-size:0.6rem;font-weight:600;color:${round.isOpen ? 'var(--success)' : round.isActive ? 'var(--gold)' : 'var(--muted)'}">
                                ${round.statusLabel}
                            </span>
                        </div>
                    `;
                }

                return `
                    <div class="game-card" data-id="${game.id}">
                        <div class="card-cover">
                            ${imageHtml}
                            <span class="card-status-badge ${statusClass}">${statusLabel}</span>
                            ${lockBadgeHtml}
                            ${countdownHtml}
                        </div>
                        <div class="card-body">
                            <div class="card-title">${game.name}</div>
                            <div class="card-category"><i class="fas fa-tag" style="color:var(--primary);font-size:0.65rem;"></i> ${game.category}</div>
                            
                            <div class="card-meta">
                                <div class="meta-item">
                                    <i class="fas fa-coins"></i>
                                    Entry: <strong>${entryFee.toLocaleString()} RWF</strong>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-trophy"></i>
                                    Prize: <strong class="gold">${totalPrizePool > 0 ? totalPrizePool.toLocaleString() : '0'} RWF</strong>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-clock"></i>
                                    Round: <strong>${game.roundSettings.duration} min</strong>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-user-friends"></i>
                                    Players: <strong>${currentPlayers}/${maxPlayers}</strong>
                                </div>
                            </div>

                            ${prizeHtml}
                            ${roundStatusHtml}

                            <div class="card-players">
                                <span style="font-size:0.6rem;color:var(--muted);">Capacity</span>
                                <div class="progress-bar">
                                    <div class="fill" style="width:${Math.min(progress, 100)}%;"></div>
                                </div>
                                <span class="count"><strong>${currentPlayers}</strong> / ${maxPlayers}</span>
                            </div>

                            ${game.description ? `<div style="font-size:0.7rem;color:var(--muted);margin-top:6px;">${game.description}</div>` : ''}

                            <div class="card-actions">
                                ${buttonsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Start countdown timers for active/open rounds
            games.forEach(game => {
                if (game.currentRound && (game.currentRound.isOpen || game.currentRound.isActive)) {
                    startCountdown(game);
                }
            });
        }

        // ========================================
        // JOIN ROUND - COMPLETE
        // ========================================

        window.joinRound = async function(gameId) {
            if (!currentUser) {
                showToast('Please login first', 'error');
                return;
            }

            const game = allGames.find(g => g.id === gameId);
            if (!game) {
                showToast('Game not found', 'error');
                return;
            }

            // Check if game is locked
            if (game.locked) {
                showToast('🔒 This game is locked. You cannot join.', 'error');
                return;
            }

            if (game.status !== 'active') {
                showToast('Game is not active', 'error');
                return;
            }

            if (!game.currentRound?.isOpen) {
                showToast('Round is not open for joining', 'error');
                return;
            }

            const entryFee = game.roundSettings.entryFee || 100;

            if (userData.balance < entryFee) {
                showToast(`Insufficient balance! Need ${entryFee} RWF`, 'error');
                return;
            }

            const maxPlayers = game.roundSettings.maxPlayers || 50;
            const currentPlayers = game.stats?.currentPlayers || 0;

            if (currentPlayers >= maxPlayers) {
                showToast('Round is full!', 'error');
                return;
            }

            // Check if user already joined this round
            const roundId = game.currentRound.roundId;
            if (userJoinedRounds[roundId]) {
                showToast('You already joined this round!', 'error');
                return;
            }

            try {
                // Deduct entry fee
                const newBalance = userData.balance - entryFee;
                await update(ref(db, `users/${currentUser.uid}`), { balance: newBalance });
                userData.balance = newBalance;
                document.getElementById('balanceDisplay').textContent = newBalance.toLocaleString();

                // Add player to round
                const playerData = {
                    username: userData.username,
                    joinedAt: new Date().toISOString(),
                    hasPlayed: false,
                    score: 0
                };

                await set(ref(db, `rounds/${gameId}/${roundId}/players/${currentUser.uid}`), playerData);

                // Update game stats
                await update(ref(db, `games/${gameId}/stats`), {
                    currentPlayers: currentPlayers + 1,
                    totalPlayers: (game.stats?.totalPlayers || 0) + 1,
                    totalRevenue: (game.stats?.totalRevenue || 0) + entryFee,
                    updatedAt: new Date().toISOString()
                });

                // Mark user as joined this round
                userJoinedRounds[roundId] = true;

                showToast(`✅ Joined round! Entry fee: ${entryFee} RWF`, 'success');

                // Reload games to update UI
                loadGames();

                // Auto-open game after joining
                setTimeout(() => {
                    playGame(gameId);
                }, 1500);

            } catch (error) {
                console.error('Error joining round:', error);
                showToast('Error joining round. Please try again.', 'error');
            }
        };

        // ========================================
        // PLAY GAME
        // ========================================

        window.playGame = async function(gameId) {
            if (!currentUser) {
                showToast('Please login first', 'error');
                return;
            }

            const game = allGames.find(g => g.id === gameId);
            if (!game) {
                showToast('Game not found', 'error');
                return;
            }

            if (game.status !== 'active') {
                showToast('Game is not active', 'error');
                return;
            }

            // Check if game is locked
            if (game.locked) {
                showToast('🔒 This game is locked. You cannot play.', 'error');
                return;
            }

            const roundId = game.currentRound?.roundId;
            if (!roundId) {
                showToast('No active round found', 'error');
                return;
            }

            // Check if user has joined this round
            try {
                const playerRef = ref(db, `rounds/${gameId}/${roundId}/players/${currentUser.uid}`);
                const snapshot = await get(playerRef);
                
                if (!snapshot.exists()) {
                    showToast('Please join the round first!', 'error');
                    return;
                }

                if (snapshot.val().hasPlayed === true) {
                    showToast('❌ You already played in this round!', 'error');
                    return;
                }
            } catch (error) {
                console.error('Error checking player status:', error);
                showToast('Error checking player status', 'error');
                return;
            }

            // Set fresh start flag
            sessionStorage.setItem('ninjaRunFreshStart', 'true');
            sessionStorage.removeItem('ninjaRunGameStarted');
            sessionStorage.removeItem('ninjaRunAutoSubmitted');
            sessionStorage.removeItem('ninjaRunDisconnected');
            sessionStorage.removeItem('ninjaRunScore');
            sessionStorage.removeItem('ninjaRunPlayed');
            sessionStorage.removeItem('ninjaRunFinalScore');
            sessionStorage.removeItem('ninjaRunComplete');
            sessionStorage.removeItem('ninjaRunCheated');
            sessionStorage.removeItem('ninjaRunTimerExpired');

            // Set hasStartedGame flag
            try {
                await update(ref(db, `users/${currentUser.uid}`), {
                    hasStartedGame: true,
                    currentGameId: gameId
                });
            } catch (error) {
                console.error('Error setting hasStartedGame:', error);
            }

            // Open the game
            const userId = currentUser.uid;
            const gameUrl = `/game-wrapper.html?game=${encodeURIComponent(gameId)}&user=${userId}&round=${game.currentRound.roundNumber}`;
            
            const gameWindow = window.open(gameUrl, '_blank');
            
            if (!gameWindow) {
                showToast('⚠️ Please allow pop-ups for this site', 'error');
                return;
            }

            showToast(`🎮 Opening ${game.name}... Good luck!`, 'success');
        };

        // ========================================
        // OPEN DEMO
        // ========================================

        window.openDemo = function(gameId) {
            const game = allGames.find(g => g.id === gameId);
            if (!game) {
                showToast('Game not found', 'error');
                return;
            }

            const demoUrl = `/game-wrapper.html?demo=true&game=${encodeURIComponent(gameId)}`;
            const demoWindow = window.open(demoUrl, '_blank');
            
            if (!demoWindow) {
                showToast('⚠️ Please allow pop-ups for this site', 'error');
                return;
            }

            showToast('🎮 Demo mode - Practice as much as you want!', 'success');
        };

        // ========================================
        // SHOW GAME INFO
        // ========================================

        window.showGameInfo = function(gameId) {
            const game = allGames.find(g => g.id === gameId);
            if (!game) {
                showToast('Game not found', 'error');
                return;
            }

            const entryFee = game.roundSettings.entryFee || 100;
            const maxPlayers = game.roundSettings.maxPlayers || 50;
            const currentPlayers = game.stats?.currentPlayers || 0;
            const prizePool = currentPlayers * entryFee;
            const platformFee = game.prizeDistribution.platformFee || 10;
            const platformAmount = prizePool * (platformFee / 100);
            const totalPrizePool = prizePool - platformAmount;

            const tiers = game.prizeDistribution.tiers || { '1st': 60, '2nd': 25, '3rd': 15 };
            let prizeDetails = '';
            const rankNames = { '1st': '🥇 1st', '2nd': '🥈 2nd', '3rd': '🥉 3rd' };
            for (const [rank, percent] of Object.entries(tiers)) {
                const amount = Math.round(totalPrizePool * (percent / 100));
                prizeDetails += `\n${rankNames[rank] || rank}: ${amount.toLocaleString()} RWF (${percent}%)`;
            }

            const message = `
        🎮 ${game.name}
        ━━━━━━━━━━━━━━━━━━━━━━
        📂 Category: ${game.category}
        📅 Status: ${game.status.toUpperCase()}
        ${game.locked ? '🔒 LOCKED - Cannot join' : '🔓 UNLOCKED - Open for joining'}
        💰 Entry Fee: ${entryFee.toLocaleString()} RWF
        👥 Players: ${currentPlayers}/${maxPlayers}
        ⏱️ Round Duration: ${game.roundSettings.duration} minutes

        ━━━━━━━━━━━━━━━━━━━━━━
        🎁 PRIZE DISTRIBUTION:
        ${prizeDetails || 'No prize distribution set'}
        
        ━━━━━━━━━━━━━━━━━━━━━━
        💰 PAYOUT INFORMATION:
        • Platform fee: ${platformFee}%
        • Winners are paid AUTOMATICALLY
        • Payouts are sent directly to your wallet
        • Winners are determined by highest score
            `;

            alert(message);
        };

        // ========================================
        // UPDATE UI
        // ========================================

        function updateUI() {
            document.getElementById('balanceDisplay').textContent = userData.balance.toLocaleString();
            document.getElementById('navUsername').textContent = userData.username;
        }

        // ========================================
        // TOAST
        // ========================================

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.className = 'toast-cyber';
            if (type === 'error') toast.classList.add('error');
            if (type === 'success') toast.classList.add('success');
            if (type === 'warning') toast.classList.add('warning');
            toast.style.display = 'flex';
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 4000);
        }

        // ========================================
        // LOGOUT
        // ========================================

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('shora_user');
                window.location.href = 'login.html';
            }
        });

        // ========================================
        // CONSOLE
        // ========================================

        console.log('%c🎮 SHORA GAMES - GAME LOBBY (FIXED)', 'color: #00BFFF; font-size: 20px; font-weight: bold;');
        console.log('%c⏰ Countdown timers: ENABLED for open/active rounds', 'color: #FFD700; font-size: 14px;');
        console.log('%c🟢 Join Now: Shows when round is open and unlocked', 'color: #00E676; font-size: 14px;');
        console.log('%c🟡 Play Now: Shows after joining a round', 'color: #FFD700; font-size: 14px;');
        console.log('%c🔒 Locked: Only Demo button shows', 'color: #FF4D6D; font-size: 14px;');
        
        window.joinRound = joinRound;
        window.playGame = playGame;
        window.openDemo = openDemo;
        window.showGameInfo = showGameInfo;
    </script>

</body>
</html>
